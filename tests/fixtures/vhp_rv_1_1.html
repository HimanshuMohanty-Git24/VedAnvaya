    <h3>Rigveda – Shakala Samhita – Mandala 01 Sukta 001</h3>
    <p>२ मधुच्छन्दा वैश्वामित्रः । अग्निः। गायत्री।</p>
    <p>अ॒ग्निमी॑ळे पु॒रोहि॑तं य॒ज्ञस्य॑ दे॒वमृ॒त्विज॑म्। होता॑रं रत्न॒धात॑मम्॥१॥</p>
    <p>अ॒ग्निः पूर्वे॑भि॒र्ऋषि॑भि॒रीड्यो॒ नूत॑नैरु॒त। स दे॒वाँ एह व॑क्षति॥२॥</p>
