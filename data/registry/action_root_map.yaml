adjudicator: MODEL_ADJUDICATED
adjudicator_model: claude-opus-5
adjudication_method: >-
  every root with tokens >= 5 was adjudicated individually; 7 roots below that floor were rescued for
  religious centrality and are flagged in their notes; the remaining sub-floor roots are UNMAPPED_ROOT under
  the stated bulk rule.
frequency_floor: 5
sub_floor_rule: >-
  a root with fewer than 5 tokens is UNMAPPED_ROOT and produces no predicate edge, unless it is named in
  rescued_below_floor. 258 lemmas totalling 488 tokens (1.52% of the corpus) fall under this rule. They are
  not listed individually.
rescued_below_floor: ["√gr̥h-", "√mah- ?", "√śruṣ-", "√gup-", "√bhiṣaj-", "√bhiṣajy-", "√gopāy-"]
