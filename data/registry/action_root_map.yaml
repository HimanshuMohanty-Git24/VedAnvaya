      or generating, and a large share of the tokens are fixed collocations (namas kr̥- 'do homage', araṁ
      kr̥- 'make ready', ādhāraṁ kr̥-) where the predicate belongs to the noun and not to the verb.
      RECOMMENDATION: exclude kr̥- from action profiles by default, exactly as IS_OR_BECOMES is excluded, or
      surface it behind an explicit low-information flag. Mapping it rather than leaving it UNMAPPED_ROOT is
      a deliberate choice to keep the evidence countable, not a claim that the predicate is informative.
