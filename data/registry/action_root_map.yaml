# The Rigvedic verbal roots mapped onto the closed action-predicate vocabulary.
#
# Source of the roots: the University of Zurich manual morphosyntactic annotation of Lubotsky's
# Rigveda text, as carried in data/knowledge/rigveda_lexical_v1/tokens.jsonl -- 32,029 tokens whose
# part_of_speech is 'root', over 702 distinct lemma labels. This file is keyed on lemma_label and
# lemma_id, NOT on root_folded, because the fold collapses 37 sets of homonymous roots. See
# recommendations.key_hazard.
#
# Every mapping was decided from what the root means as a verb in Rigvedic usage. 75 roots were
# checked against the Sanskrit and Griffith's English in real verses before being written down, and
# every such root carries its verse citations in its note. Where a root spans two predicates, one was
# chosen and the loss is recorded in the note; a secondary_predicate is given only where the split is
# systematic and a disambiguation signal could be stated.

version: vedagraph-action-root-map-v1
