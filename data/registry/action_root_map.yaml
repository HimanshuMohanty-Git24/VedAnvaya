recommendations:
  consult_secondary_conjugation: ["√vanⁱ-", "√naś- 2", "√sthā-", "√vr̥dh-", "√dhr̥-", "√budh-", "√śak-", "√śru- 1", "√mr̥ḍ-", "√vr̥t-", "√sad-", "√mad-", "√randh-", "√yu- 2", "√dhā- 2", "√svap-", "√han-"]
  consult_secondary_conjugation_note: >-
    2,237 root tokens carry a secondary conjugation (CAUS 793, DEN 680, INT 442, DES 322). It changes the
    PREDICATE for exactly one root of consequence: vanⁱ-, whose desiderative 'vivāsati' is the lexicalised
    'invites a god' (INVOKES) rather than the simplex 'wins' (SEEKS), affecting 55 of its 182 tokens. It
    changes the predicate for sthā- (CAUS 'sthāpaya-' = ESTABLISHES, not DWELLS) and inverts the argument
    frame without changing the predicate for vr̥dh-, dhr̥-, sad-, vr̥t-, naś-2, dhā-2 and randh-. It must
    NOT be read as 'wants to X' by rule: śak- is 64% DES and mr̥ḍ- is 45% CAUS, and in both the marked form
    is the ordinary lexical meaning. INT never changes a predicate in this map. The 680 DEN tokens are
    separate lemmas here, not markings on a base root.
  consult_local_particle: ["√vr̥- 1", "√sthā-", "√tr̥̄-", "√i- 1", "√gam-", "√idh- 1", "√sad-", "√ruh-", "√vr̥t-", "√dhā- 1", "√bhr̥-", "√hu-", "√sr̥j-", "√tan-", "√vī-", "√yam-", "√viś-", "√rāj-", "√bhūṣ-", "√muc-", "√cakṣ-", "√jñā-", "√dās-", "√jūrv-"]
  consult_local_particle_note: >-
    preverbs are not in the lemma: 2,177 root tokens carry the 'local particle' morphological flag and the
    particle is a separate token in the same pada, so 'ā-gam' (come) and 'gam' (go) share the root gam. THE
    ONE PLACE WHERE THE PREDICATE INVERTS is vr̥-1: bare vr̥- closes (BINDS) and apa-vr̥- opens (RELEASES),
    and 47 of its 179 tokens carry a particle. The mappings materially improved by the particle are sthā-
    (ā-sthā mount, ud-sthā rise, vi-sthā spread), tr̥̄- (pra-tira prolong vs ati-tar cross), idh-1 (sam-idh,
    94 of 185 tokens), i-1 (ā-i come vs i go, 132 tokens), sad- (ni-sad, ā-sad, 78 tokens) and vī- (apa-vī
    drive off). The mappings UNAFFECTED are the ones whose predicate is a property of the act itself and not
    of its direction: as-1, bhū, su- (press), pū- (purify), stu-, gr̥̄-1, r̥c-, hū-, juṣ-, mad-, īś-, vaś-,
    iṣ-2, mr̥ḍ-, śak-, arṣ-, kṣar-, sru-, takṣ-, mā-1 -- none of which carries a particle on more than a
    handful of tokens. Record the particle as a qualifier on the assertion; do not try to derive a new
    predicate from it except for vr̥-1.
  key_hazard: >-
    root_folded MUST NOT be used as the join key. 37 folded keys carry two or three distinct scholarly
    lemmas each, and 82 keys contain an invisible private-use sentinel in place of a vocalic r, a lateral or
    an anusvara -- √r̥- folds to a bare U+E000 with no letter at all. Join on lemma_id (the VedaWeb lemma
    identifier, unique across the annotation) or on lemma_label (also unique). root_folded is retained in
    each entry only so that a consumer of the older 662-root inventory can see which of its rows this entry
    belongs to.
  notes: >-
    READ THIS BEFORE WIRING THE EXTRACTOR. (1) KEY ON lemma_id OR lemma_label, NEVER ON root_folded.
    root_folded is the fold of the annotation's normalized_lemma and it destroys the scholarly sense number:
    37 sets of homonymous roots collapse onto one folded key, including every case the brief warned about.
    pā-1 'protect' (261 tokens) and pā-2 'drink' (405) both fold to 'pā'; vid-1 'find' (211) and vid-2
    'know' (391) both fold to 'vid'; as-1 'be' (1366) and as-2 'throw' (32) both fold to 'as'; yā-1 'go'
    (572) and yā-2 'implore' (150) both fold to 'yā'. The supplied 662-root inventory is built on that key,
    and its single 'pā' entry of 666 tokens is labelled '√pā- 2' with 'piba' and 'pāhi' side by side in its
    examples -- so consuming that inventory directly would file all Soma-drinking and all divine protection
    under one predicate. (2) root_folded is not even always legible. The fold replaces vocalic r̥/r̥̄, the
    lateral series and every spelling of the anusvara with private-use sentinels, so 82 of these 444 entries
    have a root_folded value containing an invisible U+E000-range character. √r̥- (146 tokens) folds to a
    BARE U+E000 with no letter at all, and √r̥c- folds to U+E000 followed by 'c'. Every root_folded value in
    this file is therefore emitted as a double-quoted YAML scalar with the sentinels written out as \uXXXX
    escapes, so that they survive a round trip and stay visible to a reader. A tool that prints these keys
    to a terminal will appear to show an empty or truncated key; that is a display artefact, not a missing
    value, and it is how the emptiness of √r̥- was initially misdiagnosed here. (3) THE BRIEF INVERTS vid-1
    AND vid-2. It states vid-1 = 'know' and vid-2 = 'find'; the Zurich annotation has vid-1 = find (vindati)
    and vid-2 = know (veda). Verified against RV 1.6.5 and RV 1.4.3. (4) VOICE MATTERS MORE THAN SECONDARY
    CONJUGATION for role assignment. idh-1, pū-, janⁱ- and vr̥dh- all keep one predicate while the voice or
    the stem decides whether the nominative is the actor or the undergoer. An extractor that assigns AGENT
    from any nominative will make the fire kindle the priest. (5) THE FRAME DOES NOT CARRY DESIDERATIVE
    INTENT. A DES form of han- ('jighāṃsati', seeks to slay) will surface as an ASSERTED slaying, because
    the vocabulary's two frames are ASSERTED and REQUESTED only. Roughly 322 DES tokens are affected
    corpus-wide. (6) THREE PREDICATES REST ON ALMOST NOTHING. HEALS exists only because two sub-floor roots
    (bhiṣaj-, bhiṣajy-, 4 tokens together) were rescued; without them it would be empty. CURSES has 5 roots
    and 32 tokens. HEALS and CURSES should be reported with their token counts attached, never as bare
    categories. (7) THREE CLASSES ARE MISSING FROM THE VOCABULARY and their absence is visible as unmapped
    mass: there is no EATS (ad-, aśⁱ-, ghas-, bhas-, gras-, gr̥̄-2, bhuj-2 = 132 tokens, and Agni is the
    eater of oblations); no ANOINTS or ADORNS (añj- alone is 112 tokens of a core ritual act); and no
    VOCALIZES, so ten roaring and thundering roots totalling 268 tokens are filed under SPEAKS with the
    articulacy invented. (8) DO NOT PRESENT A PREDICATE EDGE AS A PARSE. This map assigns a verb class to a
    lemma. It says nothing about which nominative in the pada is the subject of which verb, and the
    annotation it rests on is morphological, with no dependency parse and no clause boundary.
