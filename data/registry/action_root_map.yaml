    note: >-
      ONE OF THE THREE LOWEST-CONFIDENCE MAPPINGS, and the commonest content root in the corpus at 1,207
      tokens. kr̥- is a light verb. RV 1.1.6 'yad aṅga dāśuṣe tvam agne bhadraṁ kariṣyasi' is 'whatever good
      thou wilt do for the worshipper', which Griffith renders 'wilt grant'; RV 1.61.16 'akran' is 'have
