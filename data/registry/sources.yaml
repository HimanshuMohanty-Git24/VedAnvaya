  name: Internet Archive
  notes: 'Added by Agent E 2026-09-07. Registered as a HOST, not as a rights source, because it asserts no
    rights over uploader content: the per-item licenseurl field is the ONLY rights signal, and it is
    uploader-asserted. Concrete measure of how weak that signal is, from the audio survey: of 199 Veda
    audio items, only 75 carry any licenseurl at all - the other 124, or 62 percent, have no licence field
    and are therefore all-rights-reserved by default. Of the 75, 47 are NC-ND, which forbids the segmented
    derivatives our alignment work produces, and 21 carry CC Public Domain Mark applied by re-uploaders to
    2020 studio recordings. So the LICENSED minority is more dangerous than the silent majority. Items are
    adjudicated individually in data/registry/source_artifacts.yaml; a permissive classification here rests
    on the underlying work''s age (rule RIGHTS-8) or on a grant from a party with standing, never on the
    host. Also note IA''s own Terms assert access is "granted for scholarship and research purposes only".'
  organization: Internet Archive
  rights:
    notes: 'Source-level status is UNKNOWN by design and must stay that way: rights are per item and
      frequently absent, contradictory, or asserted by parties without standing. See rules RIGHTS-8,
      RIGHTS-10 and RIGHTS-11. Worked example in our own set: the same Veda Prasara Samithi recording
      appears twice with byte-identical file sets, once tagged CC Public Domain Mark and once with no
      licence at all - the same bytes cannot be both public domain and all rights reserved, which shows the
      tag is uploader noise rather than a rights position.'
