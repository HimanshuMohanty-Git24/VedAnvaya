  name: Digital Corpus of Sanskrit
  notes: 'Added by Agent E 2026-09-07 on Agent C evidence. Carries the MOST PERMISSIVE licence found for
    any Veda primary text in this registry - CC BY 4.0, with neither a non-commercial nor a share-alike
    restriction, which nothing else here achieves. It is nonetheless not selected for any role, and the
    reason is worth recording: rights are not the binding constraint here, COVERAGE is. Its Vajasaneyi
    Samhita (Madhyandina, text_id 523) covers only adhyayas 1-15 of 40 and carries ZERO accents, and
    Vedic accent is part of the text rather than decoration. Registered because it is the only artifact
    that could support a commercially licensable derivative, and because its morphological annotation is
    an independent cross-check on the selected Wikisource text. Correct host is
    http://www.sanskrit-linguistics.org/dcs/; dcs.uni-heidelberg.de no longer resolves.'
