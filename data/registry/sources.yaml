  name: Wikimedia Commons
  notes: 'Added by Agent E 2026-09-07 on Agent B evidence. HOLDS THE ONLY MIRRORABLE AUDIO FOUND IN THE
    ENTIRE FOUR-VEDA SURVEY - 474 Ogg files of Kauthuma saman/gana recitation, referenced from 444
    Sanskrit Wikisource pages. Every other audio asset examined across every other host is
    REFERENCE_ONLY, PERMISSION_REQUIRED or UNKNOWN, so this single source overturns an otherwise
    zero-mirrorable audio position. It is also the first and only CC0 material in the registry: 16 of the
    474 files are CC0 and 458 are CC BY-SA 4.0. CRITICAL HANDLING RULE - licences are PER FILE and are
    NOT uniform, so they must be carried per file and never flattened to a single collection licence.
    Authority caveat, which is the real trade-off: reciters are unnamed and files are credited "Own
    work", so recitation authority is LOWER than IGNCA''s. For Samaveda audio the choice is therefore
    explicitly between authority (VHP, unmirrorable) and usability (this, mirrorable) - a curation
    decision that should be made deliberately.'
  organization: Wikimedia Foundation
  rights:
    holder: Individual uploaders, per file
    license_url: https://creativecommons.org/licenses/by-sa/4.0/
    notes: 'Source-level status CC_BY_SA reflects the majority licence, but rights are genuinely PER FILE
      and were verified per file by Agent B through the Commons imageinfo/extmetadata API rather than
      inferred from Commons'' general terms: 458 files CC BY-SA 4.0, 16 files CC0, 0 files missing a
      licence. Example verbatim - UsageTerms "Creative Commons Attribution-Share Alike 4.0", LicenseUrl
      https://creativecommons.org/licenses/by-sa/4.0, Credit "Own work". Checking per file rather than
      trusting the platform is exactly what policy rule RIGHTS-1 requires, and here it paid off by
      surfacing a 16-file CC0 subset that a platform-level reading would have mislabelled.'
    status: CC_BY_SA
    verified_at: 2026-09-07
