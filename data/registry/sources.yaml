  name: Muenchener DigitalisierungsZentrum, Bayerische Staatsbibliothek
  notes: 'Registered by Agent A 2026-09-07 under Agent E''s rights adjudication in the
    FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE run. Registered because the Atharvaveda
    parallel_sanskrit row needed a real source_id and constructing one locally in the matrix
