  notes: 'Added by Agent E 2026-09-07 on Agent D evidence. ACL 2025, arXiv:2506.00145. Carries the ONLY
    PERMISSIVE audio licence found in the whole four-Veda survey - Apache-2.0, with neither a
    non-commercial nor a share-alike restriction - and is uniquely the only audio asset anywhere with
    PER-MANTRA granularity paired with Devanagari transcription. Every other audio asset surveyed has no
    timing or cue artifact at all. Two limits on that: the transcription is UNACCENTED and it carries no
    AVS kanda.sukta.mantra reference, so mapping it onto the VedaGraph spine must be a reviewable DERIVED
    layer produced by text-matching, never asserted as source data. Recension and recitation type are
    both UNVERIFIED - the dataset states neither. THE REASON THIS IS NOT SIMPLY GOOD NEWS: its
    Atharvaveda_Part_NNN filenames match the archive.org Veda Prasara Samithi upload exactly, so at least
    part of the source audio is almost certainly that recording, and an Apache-2.0 grant asserted by the
    DATASET AUTHORS over third-party recordings is not a verified chain of title. Agent E separately
    rejects the upstream CC Public Domain Mark as not credible for a 2020 studio recording still sold on
    CD. Residual risk, flagged for a human decision before publication rather than treated as settled.'
