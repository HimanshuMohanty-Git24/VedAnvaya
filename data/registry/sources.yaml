  name: Thesaurus Indogermanischer Text- und Sprachmaterialien
  notes: Added by Agent E 2026-09-07. TITUS is the actual upstream that GRETIL's Atharvaveda files point
    to when they say "COPYRIGHT AND TERMS OF USAGE AS FOR SOURCE FILE", so resolving TITUS was necessary
    to interpret GRETIL. It is also the only retrievable host of a Madhyandina Vajasaneyi Samhita, a Veda
    GRETIL does not carry at all. Confirmed to serve ACCENTED Devanagari for the Vajasaneyi Samhita by
    direct inspection of vs003.htm. Note that this is the one source in the registry where the SITE level
    is the only level at which terms exist; relying on it is safe only because those terms are
    RESTRICTIVE. Inferring a restriction from a site is conservative, whereas inferring a permission from
    a site is what policy rule RIGHTS-1 forbids. The direction of the inference is what matters.
  organization: Johann Wolfgang Goethe University Frankfurt
  rights:
    holder: TITUS project; individual editors named per text
    license_url: https://titus.uni-frankfurt.de/texte/texte2.htm
    notes: 'CORRECTED 2026-09-07. Initially recorded RESEARCH_ONLY from the project-wide page alone;
      that was an error of exactly the kind policy rule RIGHTS-1 exists to prevent. EVERY TITUS Veda
      text page carries its own stricter notice, verbatim, independently verified by fetching vs001.htm,
      svk001.htm and avs001.htm: "Copyright TITUS Project, Frankfurt a/M, 2.11.2013. No parts of this
      document may be republished in any form without prior permission by the copyright holder." The
      project-wide page at https://titus.uni-frankfurt.de/texte/texte2.htm says instead: "Those texts
      that can be downloaded via http can be used freely for scholarly purposes, provided that they are
      quoted as sources and the name(s) of the editor(s) and the date of last changes are indicated in
      publications. The texts must not be used for any kind of commercial usage." THE TWO LEVELS
      CONFLICT, and unusually the SITE level is the more PERMISSIVE one. Under rule RIGHTS-3 the more
      restrictive statement controls, so the status is PERMISSION_REQUIRED. This is the clearest
      demonstration in the registry that reading a licence page is not the same as reading THE artifact.
      Separately, svk001.htm also carries "Copyright (C) 1998, 1999 Anshuman Pandey", confirming at
      artifact level that the TITUS Samaveda shares the encumbered Pandey lineage.'
    status: PERMISSION_REQUIRED
    verified_at: 2026-09-07
