  name: Sanskrit Wikisource
  notes: Added by Agent E 2026-09-07 after auditing snapshots that Agents C and D had already taken.
    Supplies ACCENTED DEVANAGARI primary text, which no other rights-clear source in the registry does.
    Materially changes two verdicts. For Sukla Yajurveda it is now the strongest primary-Sanskrit
    candidate - complete, all 40 adhyayas with no gaps, accented, revision-pinned, and redistributable -
    which matters because GRETIL does not host that Veda at all, TITUS grants no redistribution, and The
    Sanskrit Library bytes are unreachable. It also carries sarvanukramani and rishisuci pages that fill
    the previously empty Sukla Yajurveda traditional-metadata role. For Samaveda it may break the Anshuman
    Pandey monopoly that blocks every other Kauthuma text. AUTHORITY CAVEAT, which is the real limitation
    here - this is a COMMUNITY transcription, not a scholarly edition. Page headers carry EMPTY year and
    notes fields, so the underlying printed edition is UNIDENTIFIED, exactly the edition-identity defect
    that independently disqualified the GRETIL Samaveda TEI. Rights are clear; edition provenance is not.
    Accuracy against a printed edition is unverified. Always pin per-page revision ids, which the
    MediaWiki API supplies and our snapshots already record.
  organization: Wikimedia Foundation
  rights:
    holder: Wikisource contributors, collectively
    license_url: https://creativecommons.org/licenses/by-sa/4.0/
    notes: 'Site-wide licence taken AUTHORITATIVELY from the MediaWiki API rather than a scraped footer:
      action=query&meta=siteinfo&siprop=rightsinfo returned url
      "https://creativecommons.org/licenses/by-sa/4.0/deed.sa" and text "Creative Commons
      Attribution-Share Alike 4.0" on 2026-09-07. Recording a SITE-level licence as operative is
      justified here, and the justification is specific rather than a relaxation of policy rule RIGHTS-1:
      the underlying Vedic mantra text is ancient and not copyrightable, so the community transcription is
      the ONLY copyrightable contribution, and a Wikimedia project licenses contributions site-wide by
      construction. Contrast the English Wikisource Griffith and Whitney pages, where the copyrightable
      work is a modern translation that is public domain by age and the site CC BY-SA covers only an
      incidental transcription layer - there the ARTIFACT-level PD banner is what we rely on, and the
      site licence is deliberately not depended upon. Same platform, two different operative levels,
      decided by what is actually copyrightable in each case. Share-alike is a live constraint: any
      VedaGraph output incorporating this text must itself be CC BY-SA compatible.'
    status: CC_BY_SA
    verified_at: 2026-09-07
