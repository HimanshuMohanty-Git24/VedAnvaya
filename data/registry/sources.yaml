  name: The Sanskrit Library
  notes: Added by Agent E 2026-09-07. Catalogues TEI XML editions of all four Vedas - Rigveda Books I-X,
    Samaveda Kauthuma (svk.html), Vajasaneyi Samhita Madhyandina (vs.html), Atharvaveda Shaunaka
    (avs.html). Rights are declared PER CATALOGUE RECORD and the declared licence text is IDENTICAL
    across all four, yet the correct verdict DIFFERS per Veda because each record names a different
    source chain and the verdict follows the chain rather than the licence label. Vajasaneyi is accepted
    as CC_BY_NC_SA because its root is Weber 1849, public domain by age. Samaveda is held UNKNOWN because
    its root is the Anshuman Pandey data entry whose own terms forbid modification. Atharvaveda is held
    UNKNOWN because its root includes Orlandi, Pisa 1991, a modern edition still in copyright. This
    source is the clearest demonstration in the registry that an identical licence string does not imply
    an identical rights outcome. ACQUISITION IS UNRESOLVED for every one of them - the catalogue pages are
    bibliographic records exposing no download link, and probing /TEI_MS/vs.xml returned HTTP 404.
  organization: The Sanskrit Library, Providence, Rhode Island
  rights:
    holder: The Sanskrit Library
    license_url: http://creativecommons.org/licenses/by-nc-sa/3.0/
    notes: 'Source-level status is UNKNOWN by design because it varies per artifact; see
      data/registry/source_artifacts.yaml for the per-Veda verdicts. Each catalogue record carries this
      verbatim declaration, retrieved 2026-09-07: "Copyright (C) 2010 The Sanskrit Library" and "All
      rights reserved other than those granted under the Creative Commons Attribution Non-Commercial
      Share Alike license available in full at http://creativecommons.org/licenses/by-nc-sa/3.0/legalcode
      , and summarized at http://creativecommons.org/licenses/by-nc-sa/3.0/ . Permission is granted to
      build upon this work non-commercially, as long as credit is explicitly acknowledged exactly as
      described herein and derivative work is distributed under the same license." NOTE THE INVERSE OF THE
      GRETIL PATTERN: there is NO site-level licence at all - sanskritlibrary.org/copyright.html and
      /terms.html both return HTTP 404, verified 2026-09-07 - so the artifact level is the only level at
      which a licence exists. A source can be rights-clear per artifact while having no site licence
      whatsoever.'
    status: UNKNOWN
    verified_at: 2026-09-07
