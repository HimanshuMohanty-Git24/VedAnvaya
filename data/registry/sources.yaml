  name: Digital Rig Vedic Index (Anukramani), WSC 2023
  notes: Digitization of the traditional Anukramani, cited as Akavarapu and Bhattacharya (2023), Proceedings
    of the Computational Sanskrit & Digital Humanities, 18th World Sanskrit Conference, pages 89-96, https://aclanthology.org/2023.wsc-csdh.6/.
    Only Anukramani/Mandala_*.txt is ingested. The repository's devata classifier models and dcs_w2v.vec
    word vectors are model artifacts, not traditional metadata, and are never ingested.
  organization: Dept. of Computer Science and Engineering, IIT Kanpur
  rights:
    holder: A V S D S Mahesh and Arnab Bhattacharya
    license_url: https://www.apache.org/licenses/LICENSE-2.0
    notes: Repository-level Apache-2.0. The Anukramani data files carry no separate artifact-level licence
      statement, so the repository licence is recorded at artifact level after inspecting the exact files.
      Per project policy the raw snapshots stay gitignored; derived registries and aggregate reports are
      committed.
    status: APACHE_2_0
  source_id: WSC2023
  url: https://github.com/mahesh-ak/WSC2023
