  name: Internet Sacred Text Archive
  notes: 'Added by Agent E 2026-09-07 on Agent B evidence, and registered primarily as a WARNING rather
    than as a usable source. It hosts the only COMPLETE Griffith Samaveda translation located, and that
    translation is of the RANAYANIYA recension, not the Kauthuma recension VG:WORK:SV:KAU is defined as.
    Griffith''s own preface says verbatim "I have followed Benfey''s text" and identifies Benfey''s
    edition as Ranayaniya; structurally, Griffith''s Part II has six Books where the Kauthuma Uttararcika
    has nine prapathakas. Aligning it to a Kauthuma Sanskrit text would produce a silently WRONG
    alignment, not an approximate one. The same preface also establishes that Satyavrata Samasrami''s
    Bibliotheca Indica edition is Ranayaniya, so the archive.org DLI Samasrami scans are not a Kauthuma
    witness either.
    CORRECTED 2026-09-07 by FULL_SV_YV_AV_CANONICAL_INGESTION, on three counts, all evidenced.
    (1) "Site returns HTTP 403 to automated agents" is FALSE for /hin/wyv/: 45 of 45 requests returned
    HTTP 200 with a declared User-Agent and a 1.5s delay. Whatever produced the 403 was not a site-wide
    block, and the sentence was doing real damage - it is the kind of claim that stops a later run from
    even trying.
    (2) bulk_ingestion_status was RECENSION_MISMATCH_DO_NOT_ALIGN, which is a SAMAVEDA-SPECIFIC verdict
    that had been applied SOURCE-WIDE. The Samaveda warning below is entirely correct and stands; it says
    nothing about the Yajurveda. GRIFFITH.YV.1899.SACREDTEXTS is on the correct Vajasaneyi Madhyandina
    spine and IS alignable - 1903 of 1975 canonical mantras, proven from printed verse numbers. The status
    is therefore per-artifact, and the recension warning belongs to the Samaveda artifact rather than to
    the host. This is the same defect class as RIGHTS-1: a property of one file recorded at the level of
    the site.
    (3) See rights.notes for the vanished meta element.
    THE SAMAVEDA WARNING IS UNAFFECTED AND STILL BINDING: the Griffith Samaveda here is RANAYANIYA and
    must never be aligned to the Kauthuma corpus.'
  organization: Internet Sacred Text Archive
  rights:
    license_url: https://sacred-texts.com/
    notes: 'SUPERSEDED OBSERVATION, kept because it is the historical record: this field previously said
      the only host signal was a site-wide meta element reading "Public Domain and Creative Commons",
      and correctly gave it no weight under RIGHTS-1. THAT ELEMENT NO LONGER EXISTS - the site has moved
      to a single-page-application layout and it is absent from all 45 pages snapshotted 2026-09-07.
      THE LIVE STATEMENT is https://sacred-texts.com/copyrights.htm, snapshotted at sha256
      008aec2f485ce55d22892def0bbdae5224af325806f023988974f375f4e61677, which grants derivative use of
      public-domain files without permission and states that books printed outside the US in or before
      1922 are public domain in the US. TWO CARVE-OUTS that do not touch translated body text: index
      files and descriptive material remain J.B. Hare''s, and some prepared files are commercially
      licensable and listed in a Bibliography which has NOT been checked against these files.
      PUBLIC_DOMAIN still rests on the underlying works rather than on the host: Griffith died 1906.'
    status: PUBLIC_DOMAIN
    verified_at: 2026-09-07
