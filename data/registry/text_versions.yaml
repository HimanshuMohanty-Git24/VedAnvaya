  language: sa
  script: Devanagari
  transliteration_scheme: null
  accent_support: 'ACCENTED AS PRINTED. The 1856 edition marks accent with a subscript line for anudatta and a
    superscript stroke for svarita. The transcription reproduces accent where the mark is legible on the leaf.
    Where an accent is visibly present but its identity is not legible, the aksara is transcribed and the
    uncertainty is recorded, rather than the accent being guessed - accent reproduction is the single hardest
    part of this source and is the main driver of the estimated transcription effort.'
  metrical_restoration: false
  orthographic_normalization: 'NONE beyond Unicode NFC. The transcription records what the page prints,
    INCLUDING readings that look wrong. Under RIGHTS-13 a reading corrected from a parallel or from memory
    has no traceable source, so an apparent error is preserved and noted rather than repaired. Unclear
    characters are written [?] and never silently completed.'
  normalized_rights: CC0
  license_uri: https://creativecommons.org/publicdomain/zero/1.0/
  verbatim_license: CC0 1.0 Universal public-domain dedication, applied by VedaGraph to the transcribed text.
  upstream_rights_notes:
  - 'The 1856 work is public domain by age under RIGHTS-7: published 1856, Whitney died 1894, Roth died 1895.'
  - 'BSB/MDZ declares Kein Urheberrechtsschutz over its own digitisation. Under RIGHTS-10 a digitiser has no
    standing to establish the copyright status of what it scans, so that declaration is relied on ONLY as a
    waiver of the thin German neighbouring right in a reproduction photograph (UrhG s.72), which BSB does have
    standing to waive. The public-domain status of the TEXT rests on age, not on the library.'
  source_specific_restrictions: 'THE OUTPUT LICENCE IS SPLIT, and this is a requirement rather than a
    preference. The TRANSCRIBED TEXT is CC0/public domain: there is no copyright in a faithful transcription of
    a public-domain work, and asserting one would be the same copyfraud RIGHTS-10 condemns in other parties.
    Only VedaGraph structural apparatus - keying, JSONL schema, alignment, SourceAssertions - carries a
    VedaGraph licence. CC0 text composes upward into a CC BY-SA artifact, so this does not conflict with the
    live share-alike obligations on the Samaveda and Yajurveda layers; the reverse would not hold, which is why
    the Samaveda CC BY-SA layer and this CC0 layer must not be merged into one licensed blob.'
  transformation_provenance: 'Produced under transcription policy bsb-1856-devanagari-v1. Every unit records
    the mdz_image_id of the leaf it was read from, which resolves in the committed leaf manifest to a sha256, a
    byte size and a IIIF canvas, so any reading can be re-verified against the exact image it came from.
    TWO INDEPENDENT READINGS PER LEAF. Neither reader may certify itself: VERIFIED_EXACT is assigned only by
    scripts/reconcile_atharvaveda_transcription.py, and only where two readings that never saw each other agree
    after NFC. Where they agree on the accent-stripped surface but differ in accent marking the unit is
    VERIFIED_WITH_ORTHOGRAPHIC_NOTE - the reading is agreed, its accentuation is not. Disagreements beyond
    accentuation, and units carrying an unclear mark, stay TRANSCRIPTION_UNCERTAIN and go to adjudication. A
    structural disagreement, where one reader saw a unit the other did not, is PHILOLOGICAL_REVIEW_REQUIRED. NO
    READING IS EVER SYNTHESISED FROM TWO DISAGREEING ONES: a merged reading has no traceable source, which is
    exactly what the firewall exists to prevent.'
  notes: 'REGISTERED 2026-09-07 by the FULL_SV_YV_AV_CANONICAL_INGESTION run, as the first and only
    rights-clear canonical Sanskrit layer for the Atharvaveda. It supersedes GRETIL.AVS.SAUNAKA.ACCENTED for
    SELECTION purposes; that record stays registered at REFERENCE_ONLY so existing pilot rows keep resolvable
    rights, and it must never be selected as primary.
    THE RESIDUAL RIGHTS-13 RISK IS RECORDED HERE RATHER THAN DECLARED DISCHARGED, because declaring it
    discharged would be the overclaim this registry exists to prevent. RIGHTS-13 names an LLM assistant as the
    MOST LIKELY breach path for this project, since the agents operating it hold GRETIL and TITUS text in
    training and will complete an unclear aksara helpfully and silently. A model transcribing Devanagari from an
    image is not performing pure optical recognition: its output is shaped by language priors learned from a
    corpus that includes the encumbered digital Atharvaveda. The controls are real - read the page not the
    memory, mark unclear rather than guess, two independent readings against the same image, no synthesised
    readings - and they are the same controls RIGHTS-13 specifies for a human transcriber whose memory is also
    a channel. They reduce the risk; they do NOT reduce it to a provable zero, and no available control does.
    This is a NAMED RESIDUAL LIMITATION of this layer, tracked as blocker dimension
    transcription_channel_independence, and it is the reason units are not promoted past
    VERIFIED_WITH_ORTHOGRAPHIC_NOTE on model evidence where the two stages disagreed.
    KANDA 20 NEEDS PARTICULAR CARE and is called out separately: it is largely Rigvedic, so recognising a
    mantra as an RV parallel will recur constantly, and that recognition is itself a non-independent source
    which must not influence a single aksara.
    COVERAGE IS PARTIAL AND IS REPORTED EXACTLY. Transcription is bounded labour against a cleared source -
    previously estimated at 60-120 person-hours for a Vedic Sanskrit scholar - and the release states how many
    units are transcribed, how many are verified, and how many leaves remain. A bounded, enumerated backlog is
    the honest outcome; a claim of full coverage would not be.'
