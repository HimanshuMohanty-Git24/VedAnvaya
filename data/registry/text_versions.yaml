- text_version_id: VEDAWEB.VNH
  artifact_id: VEDAWEB.RV.BOOK01.TEI.D3EB8AF
  source_version_key: vnh
  human_title: The Rigveda - Metrically Restored Text (van Nooten and Holland)
  text_type: Metrically restored editorial reconstruction
