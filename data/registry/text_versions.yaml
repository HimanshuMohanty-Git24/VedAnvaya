    NOT reach PRIMARY_TEXT - see notes.
    WHAT THE SOURCE DECLARES: the 1929 edition uses the standard layout - ordinal header, then the full accented
    mula closed by its own number, then the bhasya.
    WHAT THE ADAPTER NOW DOES (parser wikisource-sa-vsm-v2, superseding v1): it READS those declared ordinal
    headers as the primary mula-start signal, with accent-presence retained only as a confirming fallback.
    Coverage moved from 1958/1975 to 1975/1975 - VERIFIED INDEPENDENTLY by re-parsing all 40 pinned snapshots:
    accented 1975, unaccented 1836, union 1975, zero addresses missing from the accented layer.
    BOUNDARY PROVENANCE, WHICH IS THE FIGURE THAT GOVERNS THE ROLE: 1942 of 1975 RELEASED UNITS are read from a
    declared ordinal header and 33 fall back to accent-presence inference, every fallback REPORTED as ParseFailure
    ORDINAL_HEADER_ABSENT rather than passing silently.
    CORRECTED 2026-09-07 by FULL_SV_YV_AV_CANONICAL_INGESTION: this sentence previously read "1939 of 1975 units
    ... 36 fall back", which conflated two different populations. There ARE exactly 36 ORDINAL_HEADER_ABSENT
    EVENTS, so 36 is right about events - but 3 of them fire on accented COMMENTARY PROSE runs that never become a
    record at all (adhyaya 1 lines 243 and 270, adhyaya 40 line 201). Subtracting events from units gave 1939,
    which undercounts the header-declared units by 3. The unit split is 1942/33 and the event count is 36; both
    are true of different things and neither is a correction of the other.
    PER-RECORD BOUNDARY PROVENANCE IS NOW IMPLEMENTED, superseding the "specified for the next run" note below:
    each of the 1975 accented units carries its own ACCENTED_BOUNDARY_PROVENANCE SourceAssertion, attributed by
    walking the failure list and the record list in lockstep rather than by prefix matching - which also
    disambiguates VSM 11.9 from 11.28, whose first 120 characters are identical. Agent F root-caused all 36: 9 are PARSER-attributable
    (8 where a correct ordinal header is present but the source omits its trailing danda so the regex rejects it -
    proved by the ordinal word naming exactly the resolved mantra number in 8 of 8 cases; 1 where an intervening
    Bhavisya Purana rsi/chandas citation resets the state machine) and 27 are SOURCE properties (22 where the
    header was consumed by the preceding mula, 3 with no header within six preceding lines).
    A DEFECT IN v1 WAS FOUND AND FIXED, and it inverts an earlier claim in this record: U+0966 falls inside the
