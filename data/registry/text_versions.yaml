  electronic_lineage: &id001
  - 'Printed editions: Orlandi, Pisa 1991 (in copyright); Roth and Whitney, Berlin 1856 (public domain)'
  - 'Data entry: Vladimir Petr and Petr Vavrousek'
  - 'TITUS redaction: Jost Gippert, 31 January 1997'
  - 'Books 11-20 improved: Arlo Griffiths, Leiden 18 May 2000; Philipp Kubisch, Bonn 13 March 2007'
  - 'Revision: Arlo Griffiths, August 2009'
  - 'Re-host: GRETIL, legacy HTML, no site licence'
  language: sa
  script: Latin
  transliteration_scheme: TITUS conventions
  accent_support: Accented. The file self-titles as ACCENTED TEXT; accent marks follow the TITUS conventions
  metrical_restoration: false
  orthographic_normalization: null
  normalized_rights: REFERENCE_ONLY
  license_uri: null
  verbatim_license: THIS GRETIL TEXT FILE IS FOR REFERENCE PURPOSES ONLY! COPYRIGHT AND TERMS OF USAGE AS FOR SOURCE
    FILE.
  upstream_rights_notes: &id002
  - 'Artifact-level, self-declared, extracted programmatically from the snapshot preamble: "THIS GRETIL TEXT FILE
    IS FOR REFERENCE PURPOSES ONLY! COPYRIGHT AND TERMS OF USAGE AS FOR SOURCE FILE." That is NOT a licence - it
    is a disclaimer DEFERRING to the upstream source file.'
  - 'Following that pointer as policy rule RIGHTS-9 requires, the upstream is the TITUS edition, which states verbatim:
    "This text is part of the TITUS edition of Atharva-Veda-Samhita (Saunaka). Copyright TITUS Project, Frankfurt
    a/M, 4.3.2015. No parts of this document may be republished in any form without prior permission by the copyright
    holder." So the deferral resolves to an EXPRESS PROHIBITION on republication, not to the milder scholarly-use
    terms on the TITUS site page.'
  - 'Behind TITUS sits Gli inni dell'' Atharvaveda (Saunaka), transliteration by Chatia Orlandi, Pisa: Giardini,
    1991 - a modern scholarly transliteration STILL IN COPYRIGHT - collated with the public-domain Roth and Whitney,
    Berlin 1856. So the root of the chain is encumbered and one TITUS permission would NOT be sufficient on its
    own.'
  - 'GRETIL has NO site-level licence at all: the full 1033721-byte gretil.html contains zero occurrences of licence,
    license, copyright, terms of use, Creative Commons or public domain. There is therefore no site statement to
    weigh against the artifact statement; the artifact statement is the only one.'
  source_specific_restrictions: NO REDISTRIBUTION AND NO DERIVED REDISTRIBUTION. The VedaGraph pipeline parses,
    NFC-normalizes, re-keys and republishes as JSONL, which in copyright terms is BOTH modification and publication
    - so the TITUS no-republication clause blocks the normal pipeline, not merely the raw redistribution step. Local
    snapshots are permitted only as bounded private verification artifacts. The blocker is a written permission
    request to the TITUS Project AND to the Orlandi/Giardini rights holders, or a Saunaka text derived solely from
    Roth/Whitney 1856 with no Orlandi collation.
  transformation_provenance: 'GRETIL legacy HTML re-host of the TITUS redaction. Coverage computed from the snapshot
    by Agent D, not quoted from a reference work: 20 kandas, 731 suktas, 5839 distinct mantras, 11395 padas.'
  notes: 'Registered by Agent E 2026-09-07 under the ownership assignment from Agent A, endorsed by the coordinator.
    Id read from data/canonical/atharvaveda_pilot_v1/text_versions.jsonl, not invented. NOTE THE DELIBERATE MISMATCH
    BETWEEN ROLE AND RIGHTS, because it is the whole reason this record matters: text_role is PRIMARY_TEXT while
    normalized_rights is REFERENCE_ONLY. Those are not in conflict - they answer different questions. The role says
    WHAT THIS LAYER IS structurally; the rights say WHAT MAY BE DONE WITH IT. This is the best Saunaka text available
    and it is still not redistributable. A build may legitimately read it, key it and compare against it; it may
    NOT publish it or anything derived from it. Any pipeline treating role as a proxy for permission would ship
    an infringement here.'
