    University Press, 1994'
  electronic_lineage:
  - 1970 University of Texas Linguistics Research Center electronic text
  - van Nooten and Holland diskette issued with the 1994 printed book
  - Online edition by Karen Thomson and Jonathan Slocum, UT Austin LRC
  - Modified for VedaWeb by Dieter Gunkel and Kevin M. Ryan
  language: sa
  script: Latin
  transliteration_scheme: ISO 15919
  accent_support: Accented; udatta marked with U+0301
  metrical_restoration: true
  orthographic_normalization: Pada-segmented; vowel restorations depart from the transmitted samhita
    text
  normalized_rights: CC_BY_NC_SA
  license_uri: https://creativecommons.org/licenses/by-nc-sa/4.0/
  verbatim_license: Distributed under a Creative Commons Attribution-NonCommercial-ShareAlike 4.0
    International License.
  upstream_rights_notes:
  - 'This online text of the Rigveda derives from the highly important Rig Veda: a Metrically Restored
    Text, by Barend A. van Nooten and Gary B. Holland, published in 1994 by Harvard University Press;
    van Nooten and Holland''s edition, as the first attempt to present the poems in their entirety
    in the poetic form in which they were composed, constituted a watershed in Rigvedic scholarship,
    but it has been out of print for several years. The preface of the printed book states (p. i)
    that the content was "in part derived from an incomplete electronic version of the Rig Veda produced
    at the University of Texas in 1970." (N.B. The Linguistics Research Center produced a complete
    electronic version of the text; decades ago, a copy was donated to the Oxford Text Archive.) Re:
    editing in this new online electronic version, outlined below, or Rigvedic language issues in
    general, contact Karen Thomson.'
  - 'Our text here is based on the van Nooten and Holland electronic version (itself derived from
    the much earlier UT Linguistics Research Center electronic text), which was issued on a 3.5" diskette
    together with the printed book. A file on the diskette bore the notice:'
  - Copyright with the authors and Harvard Oriental Series. The electronic text may be used for research
    but not for commercial purposes.
  - Our non-commercial use here is for research by ourselves, other scholars, and the public at large,
    who may lack access to the out-of-print Harvard edition and be unaware of the deficiencies of
    the ancient saṃhitā text which formed the basis for Theodor Aufrecht's nineteenth-century transliterated
    edition. Aufrecht's unrestored text has continued to be generally used, as, for example, by Alexander
    Lubotsky in his 1997 concordance.
  source_specific_restrictions: The TEI preserves the diskette notice restricting the electronic text
    to research and not commercial purposes; VedaWeb additionally applies CC BY-NC-SA 4.0.
  transformation_provenance: Editorial restoration of the poetic form; explicitly not the transmitted
    samhita text
  notes: Scholarly parallel only. Its editors state that the transmitted samhita text underlying Aufrecht
    is deficient, a philological position VedaGraph does not adjudicate.
