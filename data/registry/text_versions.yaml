  notes: 'Registered by Agent E 2026-09-07 with text_role EXTRACTED_FROM_CONTAINER, NOT PRIMARY_TEXT. Agent A landed
    that enum member for this case at Agent E''s request and the coordinator directed its use here. AGENT C''s EVIDENCE
    IS ACCEPTED AND IT CORRECTED MY PREMISE. I flagged this layer on Agent C''s earlier description of it as "mantra
    quotations inside the commentary block", which implied fragments lifted out of running prose. Agent C tested
    rather than defended and showed the mula is printed in its own right with its own number under an ordinal header
    - a DECLARED structural level. That is a real correction and it is recorded in transformation_provenance above.
    THE ROLE NEVERTHELESS STANDS AS EXTRACTED_FROM_CONTAINER, because the role must describe the layer AS PRODUCED,
    not the structure the source could have supported. As produced, boundaries are inferred from accent presence
    and are wrong in 3 of 40 adhyayas, and the layer additionally embeds two acknowledged editorial judgements including
    a variant selection between two printed readings. A layer that silently picks one of two attested readings is
    not a transcription of a declared boundary. EXPLICIT UPGRADE PATH, so this is a reviewable decision and not
    a permanent verdict: if the adapter is reimplemented to read the ordinal headers that Agent C demonstrated exist,
    and the two NEEDS_REVIEW assertions are resolved, then PRIMARY_TEXT becomes correct and Agent E will amend this
    record on request.
    THAT UPGRADE PATH WAS EXERCISED ON 2026-09-07 AND THE ROLE STILL DOES NOT CHANGE. The adapter WAS reimplemented
    to read the ordinal headers (parser v2, coverage 1975/1975, independently verified), and the role REMAINS
    EXTRACTED_FROM_CONTAINER. Agent E gave rights clearance in advance and correctly noted the upgrade has zero
    rights consequence, then deferred the decision to the fidelity gate; Agent F ruled against the upgrade on three
    independent grounds and the coordinator accepted the ruling.
    Ground 1: condition (a) is literally unmet. Of the 36 inference-derived boundaries, 8 have a correct declared
    ordinal header present in the source that the regex rejects only because the trailing danda is omitted. Headers
    that demonstrably exist are still not read.
    Ground 2: condition (b) is unmet and unmeetable in an automated run. Neither NEEDS_REVIEW assertion is resolved,
    and VSM 16.37 is a genuine choice between two attested printed readings that requires recorded HUMAN
    philological review - no agent may make it.
    Ground 3, AND THIS IS THE ONE THAT SURVIVES EVERY AVAILABLE FIX, so it decides the question permanently rather
    than deferring it again: this enum member''s own definition makes BOUNDARY PROVENANCE the discriminator - a
    layer is EXTRACTED_FROM_CONTAINER where "each unit begins and ends is an editorial judgement rather than a
    boundary the source declared", and such a layer "must never be selected as primary_sanskrit: doing so would
    make an interpretive segmentation canonical". Even after fixing all 9 parser-attributable cases, 27 units would
    STILL have no source-declared header, because the source does not declare one at those points. A blanket
    layer-level PRIMARY_TEXT would make interpretive segmentation canonical for those 27. So the honest answer to
    "will this become PRIMARY_TEXT once the regex is fixed?" is NO, not "not yet".
    THE RECOMMENDED RESOLUTION IS PER-RECORD, NOT PER-LAYER, and it preserves the real gains instead of flattening
    them into one optimistic label: carry boundary provenance on each accented record (header-declared vs
    inference-derived), leaving the LAYER role permanently and accurately EXTRACTED_FROM_CONTAINER - the mula
    genuinely is quoted inside the Uvata-Mahidhara bhasya - while letting a consumer select the ~1939 (post-fix
    ~1948) header-declared units with full confidence. Not implemented in this run; specified for the next.
    A VALIDATED FIX FOR 8 OF THE 9 PARSER CASES EXISTS and was tested end-to-end by Agent F, recorded so it is not
    re-derived: a naive "make the danda optional" is unsafe in both obvious forms (with the v2 lookbehind it breaks
    280 working headers; without it, it admits 339 false lines including "adhyayah 3" and mantra fragments). The
    safe form is two-pass and self-calibrating - harvest the ordinal vocabulary from lines that already match WITH
    a danda (490 strings), then accept a danda-less line only if its exact text is in that harvested vocabulary.
    Measured: 8 lines accepted, all 8 targets covered, ZERO false positives.
    THE GENERAL RULE THIS PAIR OF RECORDS DEMONSTRATES: a layer''s LICENCE and its permitted
    ROLE are INDEPENDENT. These are the SAME bytes, from the SAME artifact, under the SAME CC BY-SA licence as WIKISOURCE_SA.YV.VSM.UNACCENTED
    - identical rights, different role - because the difference between them is not legal but epistemic: one is
    transcribed, the other is inferred. Getting the rights right does not make a layer primary. This is the text-layer
    analogue of the per-Veda-per-ROLE finding in docs/FOUR_VEDA_RIGHTS_MATRIX.md: clarity is never one verdict per
    object.'
