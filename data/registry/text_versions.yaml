  text_role: PRIMARY_TEXT
  recension: 'Shaunaka, PROVED FROM THE ARTIFACT by two independent witnesses rather than the filename: the document
    title states "Atharvaveda-Samhita, Saunaka recension", and all 11395 body locators are prefixed AVS_ with the
    palatal sibilant, e.g. (AVS_1,1.1a), so the recension marker is per-verse in the data and not only in a header
