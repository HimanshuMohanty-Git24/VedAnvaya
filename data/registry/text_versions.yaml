  electronic_lineage: &id001
  - 'Printed editions: Orlandi, Pisa 1991 (in copyright); Roth and Whitney, Berlin 1856 (public domain)'
  - 'Data entry: Vladimir Petr and Petr Vavrousek'
  - 'TITUS redaction: Jost Gippert, 31 January 1997'
  - 'Books 11-20 improved: Arlo Griffiths, Leiden 18 May 2000; Philipp Kubisch, Bonn 13 March 2007'
  - 'Revision: Arlo Griffiths, August 2009'
  - 'Re-host: GRETIL, legacy HTML, no site licence'
  language: sa
  script: Latin
  transliteration_scheme: TITUS conventions
  accent_support: Accented. The file self-titles as ACCENTED TEXT; accent marks follow the TITUS conventions
  metrical_restoration: false
  orthographic_normalization: null
  normalized_rights: REFERENCE_ONLY
  license_uri: null
  verbatim_license: THIS GRETIL TEXT FILE IS FOR REFERENCE PURPOSES ONLY! COPYRIGHT AND TERMS OF USAGE AS FOR SOURCE
