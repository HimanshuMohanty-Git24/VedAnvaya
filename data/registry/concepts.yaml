    preferred_label_sa: vrata
    preferred_label_en: ordinance
    node_type: CONCEPT
    definition: >-
      A fixed observance or commandment, the particular rule as against the general
      order.
    aliases_sa: [vratam, vrataṃ, vratā, vratāni, vratena, vratāya, vrateṣu, dharmaṇā, dharmāṇi]
    aliases_en: [ordinance, ordinances, statute, vow]
    broader: [VG:CONCEPT:RTA-ORDER]
    related_devatas: []

