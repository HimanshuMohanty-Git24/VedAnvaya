  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:YAJNA-SACRIFICE
    preferred_label_sa: yajña
    preferred_label_en: sacrifice
    node_type: RITUAL
    definition: >-
      The sacrificial rite itself, the act of worship offered to the gods with fire,
      speech and oblation.
    aliases_sa: [yajña, yajñaṃ, yajñam, yajñasya, yajño, yajñena, yajñe, yajñeṣu, yajñaiḥ, yajñāya,
                 adhvaram, adhvarasya, adhvare, adhvarāṇām]
    aliases_en: [sacrifice, sacrifices, worship, rite, rites]
    broader: []
    related_devatas: [VG:DEVATA:YAJAMANAH, VG:DEVATA:YAJNAYAJAMANAU]

  - concept_id: VG:CONCEPT:HAVIS-OBLATION
    preferred_label_sa: havis
    preferred_label_en: oblation
    node_type: OFFERING
    definition: >-
      What is poured or placed in the fire for the gods, considered as the offered
      material rather than as the rite.
    aliases_sa: [haviḥ, havir, haviṣā, haviṣaḥ, haviṣmān, havyam, havyaṃ, havyā, havyāni]
    aliases_en: [oblation, oblations, offering, offerings]
    broader: []
    related_devatas: []

