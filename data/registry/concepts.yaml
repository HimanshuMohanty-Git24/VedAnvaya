  - concept_id: VG:CONCEPT:KAMA-DESIRE
    preferred_label_sa: kāma
    preferred_label_en: desire
    node_type: CONCEPT
    definition: >-
      Wanting: the wish a rite is performed to fulfil, and in a few late hymns a cosmic
      first principle.
    # `kāmas` is the sandhi form of the nominative before a following consonant, and its
    # absence was load-bearing: RV 10.129.4 -- `kāmas tad agre sam avartata`, "desire
    # arose first of all", the Rigveda's desire-cosmogony -- spells it this way, so
    # without the alias the single most important kāma verse in the corpus reached this
    # concept only through Griffith's English. Probed before adding: exactly 2
    # whole-token hits in 20,210 mantras, RV 10.129.4 and its Atharvavedic parallel
    # AVS 19.52.1, both genuine. It cannot leak into `kāmasya` (genitive) or
    # `apakāmasya` (a different word) because alias matching is over whitespace tokens
    # and the folded form is 5 characters, below MIN_SANDHI_ALIAS_CHARS.
    aliases_sa: [kāmaḥ, kāmas, kāmam, kāmaṃ, kāmena, kāmāya, kāmasya, kāmān, kāmāḥ]
    aliases_en: [desire, wish]
    broader: []
    related_devatas: []

