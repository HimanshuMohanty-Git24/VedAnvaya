# Reviewed CONCEPT registry for the graph enrichment layer.
#
# A concept answers one question only: "is this passage ABOUT this idea?" It is a
# reusable knowledge node -- fire, sacrifice, cosmic order, cattle -- and it is not a
# lexicon entry, not a deity, and not a translation gloss.
#
# ---------------------------------------------------------------------------
# THE RULE THAT MATTERS MOST: a Devata is not a Concept.
# ---------------------------------------------------------------------------
# VG:CONCEPT:AGNI-FIRE is the ritual and natural fire. VG:DEVATA:AGNIH is the god. They
# are related and they are NOT the same node, they are never merged, and no process in
# this repository may collapse one into the other. The only edge between the two
# ontologies is DEVATA_ASSOCIATED_WITH, generated from `related_devatas` below, which
# records the association without asserting the identity. The frozen semantic ontology
# already refuses REPRESENTS and IS_GOD_OF by name for the same reason: "Agni is fire" is
# a commentarial reading, not a fact the corpus states.
#
# One consequence is visible in the alias lists. Vedic Sanskrit does not separate the
# appellative from the theonym -- `agním` is fire and the fire-god in the same breath --
# so `aliases_sa` keeps the stem. English does separate them: Griffith writes the proper
# name "Agni" with a capital and the substance "fire" without one, so `aliases_en`
# excludes every deity proper name. Including "Agni", "Soma" or "Indra" as an English
# alias would make the concept node a duplicate of the devata node with worse evidence.
#
# ---------------------------------------------------------------------------
# V3 REFINEMENT: the vocative is the one case where Sanskrit DOES separate them.
# ---------------------------------------------------------------------------
# The rule above is right about `agním` and wrong about `agne`, and the difference is not
# a matter of degree. You cannot address a thing that is not a being. A vocative is an
# address, so a vocative of a name that is also a common noun is the god and not the
# noun -- which makes it the one form an appellative entity must never claim.
#
# This was measured, not reasoned. Against the University of Zurich morphological
# annotation of the Rigveda:
#
#   agne     852 of 852 annotated tokens are agni- VOCATIVE SINGULAR   (100.0%)
#   soma     247 of 247 annotated tokens are soma- VOCATIVE SINGULAR   (100.0%)
#   surya     21 of  26 are surya- VOCATIVE SINGULAR, 5 are surya- the bride  (80.8%)
#   uso            the pre-vocalic vocative of usas-
#   prthivi   the short-i form is the vocative; long-i prthivi is 71% NOMINATIVE
#   agna      the pre-vocalic vocative of agni-, by abhinihita sandhi
#
# `agne` alone matched 915 mantras across all four Vedas on VG:CONCEPT:AGNI-FIRE, an
# entity whose own definition reads "NOT the deity Agni". Every one of those 915 was an
# address to the god, asserted onto the impersonal element. The V2 pass found this,
# reported it as its worst finding, and fixed the *flag* that failed to detect it while
# leaving the alias in place -- so the edges it describes were still being created.
#
# The forms are not lost. They are the strongest evidence in the four-Veda theonym layer
# (`data/registry/theonym_forms.yaml`), where a vocative is exactly what earns TIER_A.
#
# Deity EPITHETS are removed on the same principle: `jatavedah` and its cases are an
# epithet of Agni-the-god, and an epithet is a name.
#
# ---------------------------------------------------------------------------
# Fields
# ---------------------------------------------------------------------------
#   concept_id          pinned identity, VG:CONCEPT:<UPPER-KEBAB>. Never renumbered.
#   preferred_label_sa  IAST, unaccented stem or nominative singular.
#   preferred_label_en  the plain English label, lower case.
#   node_type           a member of vedagraph.semantic.ontology.SemanticNodeType. Load
#                       fails on any other value; this file may not invent a type.
#   definition          one honest sentence. Not a dictionary entry and not a claim
#                       about what the concept "really means".
#   aliases_sa          IAST surface forms that ACTUALLY OCCUR in the four corpora.
#                       Every entry here was checked against the corpus token index
#                       before it was written down; unattested forms were deleted rather
#                       than kept "for completeness". Matching folds these through
#                       ComparisonForm.SEARCH_NORMALIZED, the same pipeline that built
#                       the search surface, so what is written here is IAST and what is
#                       compared is the folded form.
#   aliases_en          single English tokens that Griffith (RV, YV) or Whitney (AV)
#                       actually uses. Hyphenated compounds count as one token, so
#                       "life-time" is listed separately from "life".
#   broader             parent concept ids, ONLY where the narrower term is genuinely a
#                       kind of the broader one. Not "related to", not "part of": the
#                       heart is part of the body and is therefore NOT filed under it.
#   related_devatas     entity keys from data/registry/devatas.yaml. Validated on load;
#                       a typo'd key raises rather than creating an orphan edge.
#
# ---------------------------------------------------------------------------
# Aliases deliberately NOT listed, with the reason
# ---------------------------------------------------------------------------
# These were measured against the corpus and rejected. They are recorded because the
# absence is a decision, and an absence with no recorded reason gets "fixed" later by
# someone who did not measure it.
#
#   "order"    268 English hits, and in Whitney's Atharvaveda the overwhelming majority
#              are the preposition "in order to". Adding it to RTA-ORDER would have made
#              the corpus's single most philosophically loaded concept the noisiest.
#   "self"     Whitney hyphenates constantly ("self-giving", "self-yoked"). Hyphen-aware
#              tokenisation removes most of it, but the residue is still an adjective
#              prefix rather than atman.
#   "song"     460 passages, and Griffith uses it for saman, stoma, uktha and rc without
#              distinction. Assigning it to any one of them would be a labelling choice
#              dressed as evidence, so no concept claims it.
#   "power"    638 passages, spread across maya, kratu, savas, ojas, bala and sahas.
#              Same problem as "song"; OJAS-MIGHT keeps only "strength" and "might".
#   "mighty"   1,055 passages and almost always an epithet of a god, not a claim that the
#              passage is about might.
#   "men"      1,170 passages. Griffith's default rendering of nara, jana, manusya,
#              martya and vira alike; useless as a discriminator.
#   "son"      445 passages, and Griffith's "Son of Strength" / "Son of Vigour" are Agni
#              epithets, not statements about offspring.
#   "hero"     Removed after measurement, not before it: of 509 occurrences, 215 (42%) are
#              the vocative epithet "O Hero" / "the Hero" addressed to Indra. "heroes" is
#              26% the same. That is the devata/concept confusion this file exists to
#              prevent, arriving through the translation instead of through the lexicon.
#              VIRA-HERO keeps its Sanskrit forms and the single English token "heroism".
#   "day"      636 occurrences, 209 (33%) adverbial -- "this day" meaning today, and "day
#              by day". AHAN-DAY keeps "days" and its Sanskrit forms.
#   "vasavah"  Sanskrit. Vocative plural of the Vasus, a class of gods, not vasu 'goods'.
#              Found in the precision sample: RV 3.57.2 "O Vasus" had been filed under
#              VASU-WEALTH.
#   "jatavedah" Sanskrit, in JANMAN-BIRTH. Jatavedas is Agni's epithet and belongs to
#              AGNI-FIRE, where it is listed; the birth concept was matching the name.
#   "krstayah" Sanskrit. Means 'peoples', not 'fields', despite the root krs- 'to till'.
#              It had been filed under KSETRA-FIELD.
#   "dasuse"   Sanskrit. 'to the one who offers' -- an epithet of the sacrificer, not an
#              instance of liberality. Removed from DANA-LIBERALITY.
#   "ketuh"    Sanskrit. Found in the precision sample: RV 3.8.8 "adhvarasya ketum" is the
#              sacrifice's *banner*, which Griffith renders "ensign". ketu- is beacon,
#              banner and brightness at once; JYOTIS-LIGHT keeps jyotis, rocana and bhanu.
#
# Known residual, measured and left in place: Griffith renders manas as "heart" often
# enough that HRD-HEART takes a share of what MANAS-MIND should have (RV 10.37.12,
# "thoughtlessness of heart", is manasah prayuti). Splitting them would need the Sanskrit,
# which the English path by definition does not have. It is one of the two errors in the
# 40-assertion audit sample and is recorded rather than hidden.
#   "apas"     Sanskrit. The folded surface drops the accent that separates apas 'work'
#              from apas 'waters', so the two words become one string. AP-WATERS keeps
#              apah / apo / apam / apsu, which are unambiguous.
#   "rte"      Sanskrit. rte 'without, except' is spelled identically to the locative of
#              rta once accents are folded away.
#   "pahi"     Sanskrit. Imperative of both pa- 'protect' and pa- 'drink'; "somam pahi"
#              is drinking, "agne pahi" is protecting, and nothing on the folded surface
#              separates them. SARMAN-PROTECTION uses sarman / trata / varutha instead.
#   "raksa"    Sanskrit. Imperative "protect" vs. the neuter noun "demon". RAKSAS-DEMON
#              keeps only raksamsi / raksasah / rakso, which cannot be the verb.
#   "sahasra"  Sanskrit. 'thousand', not sahas 'strength'; excluded from OJAS-MIGHT by
#              listing sahasa / sahasah explicitly rather than a sahas- stem.
#   "asvin"    Sanskrit. Every asvin- form is the Asvin twins, a deity, not a horse.
#   "visva"    Sanskrit. 'all', not vis 'clan'. JANA-PEOPLE lists visah / visam / viso.
#   "vayah"    Sanskrit. 'vigour' and 'birds' are the same folded string.
#
#   Removed after adversarial QA measured them against the passages they matched. Each
#   number is the share of that alias's assertions whose evidence span does not support the
#   concept, counted by hand or by an explicit pattern over the evidence:
#   "realm"    English. 82.9% wrong for RAJAN-KINGSHIP. "the realm of the gods" and "Yama's
#              realm" are domains, not kingship. Sole evidence on 30 of 35, so most of the
#              damage was unrecoverable from the row.
#   "stone"    English. ~62% wrong for ASMAN-PRESSING-STONE. "make thyself a stone" and
#              "stand on the stone" are hardness images and ritual furniture, not the soma
#              press.
#   "way"      English. 23% adverbial or idiomatic -- "turners this way", "the way of
#              righteousness" -- rather than ADHVAN-PATH the road.
#   "bow"      English. 21% is the verb: "let the four directions bow to me", "bow down the
#              pride of every foe", not AYUDHA-WEAPON the bow.
#   The Sanskrit aliases for all four concepts are kept, so each concept survives with
#   better precision rather than being dropped.
#
# ---------------------------------------------------------------------------
# ambiguous_aliases
# ---------------------------------------------------------------------------
# An alias string may not be claimed by two concepts: an ambiguous alias is a silent
# precision killer, because whichever concept happens to be listed first wins and the
# reader cannot see that a choice was made. Load fails if two concepts share one. Where a
# string is genuinely wanted by more than one concept it goes here instead and is
# excluded from matching everywhere, so the ambiguity is visible rather than resolved by
# accident.
policy_version: vedagraph-concept-lexicon-v1

ambiguous_aliases:
  - alias: madhu
    kind: sa
    reason: >-
      Claimed by MADHU-HONEY as the substance and by SOMA-DRINK, whose juice is called
      madhu throughout Mandala 9. 178 passages, and no deterministic rule separates the
      readings. Both concepts keep their unambiguous forms; neither gets this one.
  - alias: sweet
    kind: en
    reason: >-
      Griffith's rendering of madhu, madhumat and svadu alike, used for soma, milk,
      speech and rain. Wanted by MADHU-HONEY and SOMA-DRINK; given to neither.
  - alias: strength
    kind: en
    reason: >-
      955 passages. Griffith uses it for ojas, savas, sahas, bala, tavas AND vaja, which
      is exactly the boundary between OJAS-MIGHT and VAJA-PRIZE. Retained here rather
      than assigned, because assigning it would put ~750 Rigvedic passages on one side of
      a distinction the translation does not make.

concepts:

  # -------------------------------------------------------------------------
  # Sacrifice and its apparatus
  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:YAJNA-SACRIFICE
    preferred_label_sa: yajña
    preferred_label_en: sacrifice
    node_type: RITUAL
    definition: >-
      The sacrificial rite itself, the act of worship offered to the gods with fire,
      speech and oblation.
    aliases_sa: [yajña, yajñaṃ, yajñam, yajñasya, yajño, yajñena, yajñe, yajñeṣu, yajñaiḥ, yajñāya,
                 adhvaram, adhvarasya, adhvare, adhvarāṇām]
    aliases_en: [sacrifice, sacrifices, worship, rite, rites]
    broader: []
    related_devatas: [VG:DEVATA:YAJAMANAH, VG:DEVATA:YAJNAYAJAMANAU]

  - concept_id: VG:CONCEPT:HAVIS-OBLATION
    preferred_label_sa: havis
    preferred_label_en: oblation
    node_type: OFFERING
    definition: >-
      What is poured or placed in the fire for the gods, considered as the offered
      material rather than as the rite.
    aliases_sa: [haviḥ, havir, haviṣā, haviṣaḥ, haviṣmān, havyam, havyaṃ, havyā, havyāni]
    aliases_en: [oblation, oblations, offering, offerings]
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:GHRTA-CLARIFIED-BUTTER
    preferred_label_sa: ghṛta
    preferred_label_en: clarified butter
    node_type: SUBSTANCE
    definition: >-
      Melted butter, the commonest liquid oblation and a standing image for anything
      rich, streaming or nourishing.
    aliases_sa: [ghṛtam, ghṛtaṃ, ghṛta, ghṛtena, ghṛtasya, ghṛte, ghṛtāt, ghṛtavat, ghṛtācī, ājyam,
                 ājyena]
    aliases_en: [butter, ghee]
    broader: [VG:CONCEPT:HAVIS-OBLATION]
    related_devatas: []

  - concept_id: VG:CONCEPT:SOMA-DRINK
    preferred_label_sa: soma
    preferred_label_en: soma juice
    node_type: SUBSTANCE
    definition: >-
      The pressed plant and the juice made from it, drunk by the gods and by the
      sacrificer; the substance, not the deity of the same name.
    aliases_sa: [somaṃ, somam, somasya, somaḥ, somo, some, somāya, somāsaḥ, somaiḥ, somebhiḥ,
                 somapītaye, induḥ, indur, indavaḥ, indavo, indum, andhasaḥ, andhaso, andhasā,
                 aṃśuḥ, aṃśum]
    aliases_en: [juice, juices, sap, stalk]
    broader: [VG:CONCEPT:HAVIS-OBLATION]
    related_devatas: [VG:DEVATA:SOMAH, VG:DEVATA:PAVAMANAH-SOMAH, VG:DEVATA:PAVAMANAH]

  - concept_id: VG:CONCEPT:SOMA-PRESSING
    preferred_label_sa: savana
    preferred_label_en: soma pressing
    node_type: RITUAL
    definition: >-
      The act and occasion of pressing out the soma, the rite around which most of the
      Rigvedic liturgy is organised.
    aliases_sa: [sutaḥ, sutasya, sute, sutam, sutaṃ, suto, sutā, sutāsaḥ, suteṣu, sunvataḥ,
                 sunvanti, sunvate, savanam, savane, savanā, savaneṣu, savanasya]
    aliases_en: [pressed]
    broader: [VG:CONCEPT:YAJNA-SACRIFICE]
    related_devatas: []

  - concept_id: VG:CONCEPT:ASMAN-PRESSING-STONE
    preferred_label_sa: grāvan
    # Labelled "stone", not "pressing stone", because the definition deliberately covers
    # stone generally and the aliases (asmana, adri-) reach passages like AVS 12.1.26
    # "rock is earth, stone, dust" that are nothing to do with the soma press. Adversarial
    # QA measured roughly 60% of the assertions under the narrower label as not about
    # pressing, which made the label the defect rather than the matches. The concept_id is
    # pinned identity and is not renamed.
    preferred_label_en: stone
    node_type: OBJECT
    definition: >-
      Stone as a substance and as ritual equipment: the pressing stones that crush the soma
      stalks, and stone generally as the hard thing a god splits or a press works with.
    aliases_sa: [grāvāṇaḥ, grāvāṇo, grāvā, grāvṇā, aśmanā, adriḥ, adrim, adreḥ, adribhiḥ, adrivaḥ]
    aliases_en: [stones, press-stones]
    broader: []
    related_devatas: [VG:DEVATA:GRAVANAH]

  - concept_id: VG:CONCEPT:BARHIS-SACRED-GRASS
    preferred_label_sa: barhis
    preferred_label_en: sacred grass
    node_type: OBJECT
    definition: >-
      The strewn grass on which the gods are invited to sit at the sacrifice.
    aliases_sa: [barhiḥ, barhir, barhiṣi, barhiṣaḥ, barhiṣā, barhiṣe]
    aliases_en: [grass]
    broader: []
    related_devatas: [VG:DEVATA:BARHIH]

  - concept_id: VG:CONCEPT:SAMIDH-FUEL
    preferred_label_sa: samidh
    preferred_label_en: kindling
    node_type: OBJECT
    definition: >-
      The wood with which the sacrificial fire is kindled, and the state of being
      kindled.
    aliases_sa: [samidhā, samidhaḥ, samidham, samiddhaḥ, samiddho, idhmam]
    aliases_en: [fuel]
    broader: []
    related_devatas: []

  # node_type stays CONCEPT and that is a BLOCKER, not a decision. Measured: 321 mentions
  # across all four Vedas and no RitualRole label, so REL_PERFORMED_BY (Ritual ->
  # RitualRole) cannot reach the Rigveda's principal officiant and the priestly-role query
  # enumerates nine lesser offices without him. The V3 close-out filed this as "one field
  # on one existing line"; it is not. Setting RITUAL_ROLE here raises
  # ConceptRegistryError, because load_concepts() validates this file against the frozen
  # SemanticNodeType whitelist on every caller that does not pass allowed_node_types --
  # enrich/build.py, probe_domain_aliases.py, run_semantic_extraction.py and two test
  # modules -- and that enum has no RITUAL_ROLE and is sealed. See
  # docs/reports/V3_1_RISHI_FAMILY_AND_MATERIAL.md for the two candidate fixes.
  - concept_id: VG:CONCEPT:HOTR-PRIEST
    preferred_label_sa: hotṛ
    preferred_label_en: priest
    node_type: CONCEPT
    definition: >-
      The officiant who invokes and offers, named by office rather than as an individual.
    # The alias list was a portmanteau of three different offices, and splitting it is not
    # tidying -- rituals_v3.yaml's PERFORMED_BY note warned that "retyping the node without
    # splitting it produces a RitualRole that answers 'which rites does the adhvaryu
    # officiate at' twice, differently". Measured per alias against the live mention layer
    # before the split, because a row-level sample here once read 97% while one alias was
    # 82.9% wrong:
    #
    #   the hotar   hotā 213 · hotāraṃ 45 · hotāram 37 · hotur 3 · hotre 3 · hotrāt 1
    #               = 302 of 321 edges
    #   MOVED to VG:CONCEPT:ADHVARYU-PRIEST (a RITUAL_ROLE already, and holding neither
    #               form, so no folded surface collides):
    #               adhvaryo 9 · adhvaryavaḥ 4 · adhvaryuḥ 1 = 14 edges
    #   WITHDRAWN, no replacement node: ṛtvijam 7 · ṛtvijaḥ 4 = 11 edges. ṛtvij- is any
    #               officiant "who sacrifices in season", not the hotar. No generic-office
    #               node is minted: Q90 is a priestly-role census and a generic office
    #               would enter that census as a competing role and re-inflate the very
    #               table this change corrects -- the reasoning the diagnosis applies to
    #               `sindhu`, the generic word for "river", in a hydronym table.
    #
    # So 25 of 321 edges (7.8%) were the wrong office. QUESTION_UNLOCKED: 90
    aliases_sa: [hotā, hotāraṃ, hotāram, hotur, hotre, hotrāt]
    aliases_en: [priest, priests, hotar]
    broader: []
    related_devatas: [VG:DEVATA:DAIVYAU-HOTARAU, VG:DEVATA:DEVYAU-HOTARAU]

  - concept_id: VG:CONCEPT:DAKSINA-PRIESTLY-GIFT
    preferred_label_sa: dakṣiṇā
    preferred_label_en: priestly fee
    node_type: OFFERING
    definition: >-
      The fee paid to the officiants, treated in the hymns as itself a meritorious act.
    aliases_sa: [dakṣiṇā, dakṣiṇām, dakṣiṇāṃ, dakṣiṇābhiḥ, dakṣiṇāvān, dakṣiṇāvantaḥ]
    aliases_en: [guerdon]
    broader: []
    related_devatas: [VG:DEVATA:DAKSINA]

  - concept_id: VG:CONCEPT:STOMA-PRAISE
    preferred_label_sa: stoma
    preferred_label_en: praise
    node_type: ACTION
    definition: >-
      The act of praising a god, and the composed praise-song as an offering in its own
      right.
    aliases_sa: [stoma, stomaṃ, stomam, stomo, stomebhiḥ, stomebhir, stomāsaḥ, stomaiḥ, stotram,
                 stotāraḥ, stotṛbhyaḥ, stotṛbhyo, stuvate, stuṣe, stuhi, stavāma, uktham, ukthaṃ,
                 ukthā, ukthaiḥ, ukthebhiḥ]
    aliases_en: [praise, praises, laud, lauds, extol, hymn, hymns]
    broader: []
    related_devatas: [VG:DEVATA:DANASTUTIH, VG:DEVATA:RAJASTUTIH]

  - concept_id: VG:CONCEPT:SAMAN-CHANT
    preferred_label_sa: sāman
    preferred_label_en: chant
    node_type: CONCEPT
    definition: >-
      The sung melody to which a verse is set, as distinct from the words of the verse.
    aliases_sa: [sāma, sāman, sāmnā, sāmabhiḥ, arkaḥ, arkam, arkaiḥ, arkeṇa, arkasya, gāyatram,
                 gāyatreṇa]
    aliases_en: [chant, chants, melody]
    broader: [VG:CONCEPT:STOMA-PRAISE]
    related_devatas: []

  - concept_id: VG:CONCEPT:BRAHMAN-FORMULATION
    preferred_label_sa: brahman
    preferred_label_en: sacred formulation
    node_type: PHILOSOPHICAL_CONCEPT
    definition: >-
      The formulated sacred utterance and the power in it, before the word acquired its
      later Upanishadic sense.
    aliases_sa: [brahma, brahmaṇā, brahmaṇaḥ, brahmaṇas, brahmaṇe, brahmāṇi, brahmabhiḥ]
    aliases_en: [prayer, prayers, devotion]
    broader: []
    related_devatas: [VG:DEVATA:BRAHMANASPATIH, VG:DEVATA:BRAHMA]

  - concept_id: VG:CONCEPT:NAMAS-HOMAGE
    preferred_label_sa: namas
    preferred_label_en: homage
    node_type: ACTION
    definition: >-
      Reverence offered in words and posture, the verbal accompaniment of an offering.
    aliases_sa: [namaḥ, namas, namasā, namobhiḥ, namasvinaḥ, namasyanta]
    aliases_en: [homage, reverence, adoration]
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:VAC-SPEECH
    preferred_label_sa: vāc
    preferred_label_en: speech
    node_type: PHILOSOPHICAL_CONCEPT
    definition: >-
      Speech as a power: the voice that carries the hymn and, in some hymns, a cosmic
      agent in her own right.
    aliases_sa: [vāk, vācam, vācaṃ, vācā, vāco, vācaḥ, vācas, vāci, giraḥ, girā, giro, gīrbhiḥ,
                 gīrbhir, gira]
    aliases_en: [speech, voice, word, words]
    broader: []
    related_devatas: [VG:DEVATA:VAK, VG:DEVATA:SASARPARI-VAK, VG:DEVATA:VAK-APAH]

  # -------------------------------------------------------------------------
  # Order, truth, obligation
  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:RTA-ORDER
    preferred_label_sa: ṛta
    preferred_label_en: cosmic order
    node_type: PHILOSOPHICAL_CONCEPT
    definition: >-
      The right ordering of the world, of the seasons and of the rite, which gods and
      men are said to follow rather than to legislate.
    aliases_sa: [ṛtam, ṛtaṃ, ṛtasya, ṛtena, ṛtāya, ṛtāvā, ṛtāvarī, ṛtāvānam]
    aliases_en: [law]
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:SATYA-TRUTH
    preferred_label_sa: satya
    preferred_label_en: truth
    node_type: PHILOSOPHICAL_CONCEPT
    definition: >-
      What is real and holds good, said of gods, of speech and of a promise.
    aliases_sa: [satyam, satyaṃ, satyā, satyaḥ, satyo, satyena, satyasya, satyāni]
    aliases_en: [truth]
    broader: []
    related_devatas: []

  # -------------------------------------------------------------------------
  # Being and non-being
  # -------------------------------------------------------------------------
  # These two entities exist because the Nasadiya -- RV 10.129, the corpus's most cited
  # cosmogony, whose first line is `na asad asin no sad asit` -- carried no conceptual
  # edge of any kind. They are also the hardest aliasing problem in this file, because
  # `sat-` is the present participle of as- 'to be' and its inflections mean "being,
  # existing, good, real, faithful" far more often than they mean "the Existent".
  #
  # Every candidate form was resolved against the University of Zurich manual
  # morphological annotation of the Rigveda (data/knowledge/rigveda_lexical_v1/
  # tokens.jsonl), which states the lemma, gender and non-finite status of every Rigvedic
  # token, and then READ in all four Vedas -- 107 verses read across 15 candidate Sanskrit
  # surfaces and 4 candidate English tokens. Six aliases stand; nine were rejected.
  #
  # THE FACT THAT DECIDES THE PAIR. The annotation gives `asat` its own nominal lemma,
  # `asant-` (7 Rigvedic tokens in 7 passages, every one of them the philosophical word),
  # while `sat` is annotated as a participle of `as- 1` (156 tokens in 149 passages, only
  # 42 of them neuter). The two words are therefore NOT symmetrical in this corpus:
  # non-existence is already a noun and existence is still a substantivised participle,
  # and the alias sets have to reflect that rather than mirror each other.
  #
  # NO ALIAS HERE CLEARS THE SANDHI FLOOR. All six folded aliases are 3-5 characters,
  # under MIN_SANDHI_ALIAS_CHARS (6), so none of them ever reaches the Samavedic substring
  # path. Every match below is a whole folded token. That is deliberate: `asatah` was the
  # one candidate that cleared the floor, and it was dropped for exactly that reason (see
  # the rejections).
  #
  # ACCEPTED, with hits / read / true / rejected hosts:
  #   sad          8 / 8 / 5   RV 10.129.1, RV 10.72.2, RV 10.72.3, RV 1.164.46 (`ekam
  #                            sad vipra bahudha vadanti`), AVS 9.10.28. Hosts: RV 6.18.4
  #                            `sad id dhi te sahah` and RV 6.27.2 `sad asya made` (x4),
  #                            where the neuter participle is predicative "real, faithful"
  #                            and Griffith renders it "true"; AVS 5.19.9 `brahmanasya sad
  #                            dhanam`, an ordinary relative-clause participle. The
  #                            retroflex sandhi does most of the work for free: `sad` folds
  #                            distinctly from `sad` after `anti`/`abhi`, so the 18 verses
  #                            of RV 8.73 whose refrain is `anti sad bhutu vam avah` ("let
  #                            your help be NEAR") and RV 2.41.10, 4.5.10, 9.61.10 are all
  #                            outside this alias without needing a suppression.
  #   sac          6 / 6 / 4   AVS 8.4.12, AVS 10.7.10, RV 7.104.12, RV 10.5.7 -- all four
  #                            the `sac ca asac ca` paired formula. Hosts: RV 5.44.3 `sacate
  #                            sac ca dhatu`, the participle "present (and to come)", in a
  #                            line that also contains the unrelated root sac- 'accompany';
  #                            RV 6.24.5, where the annotation shows the `sac` token is the
  #                            ELIDED `'sac` = asat, not sat (that verse does also contain a
  #                            genuine `sat`, so it is a mis-attributed alias rather than a
  #                            mis-topiced edge).
  #   nasad        1 / 1 / 1   RV 10.129.1 and nowhere else in 20,210 mantras. The glue of
  #                            `na` + `asat`. This is the alias that closes the measured gap.
  #   asac         3 / 3 / 2   AVS 10.7.10, RV 10.5.7. Host: AVS 3.23.5 `yas tubhyam sam
  #                            asac`, the 3sg subjunctive.
  #   asati        4 / 4 / 2   AVS 17.1.19 (`asati sat pratisthitam`) and RV 10.129.4
  #                            (`sato bandhum asati`) -- the two clearest asat/sat
  #                            statements in the corpus. NAMED RESIDUAL: the other two hits,
  #                            RV 1.124.11 and RV 6.23.9, are both the 3sg present
  #                            subjunctive of as-. Kept at a measured 0.50 because the hit
  #                            set is closed at four verses, all four are read, and both
  #                            wrong ones are named here; delete this one alias if that
  #                            trade is not wanted, and RV 10.129.4 loses its asat edge.
  #   non-existent 12 / 12 / 11  English. AVS 4.1.1, 4.19.6, 5.6.1, 8.4.8, 10.7.10, 10.7.21,
  #                            10.7.25, 17.1.19, RV 10.129.1, RV 10.129.4, VSM 13.3. Host:
  #                            AVS 7.76.1 "more non-existent than the non-existent ones",
  #                            which is the word asat used as a comparative of worthlessness
  #                            in a wart charm, not the cosmological pole.
  #   non-existence 2 / 2 / 2  English, RV 10.72.2 and RV 10.72.3 only. This alias earns its
  #                            place by reaching the two verses the SANSKRIT cannot: see the
  #                            `satah` rejection below.
  #   existent    14 / 14 / 10  English. AVS 4.1.1, 5.6.1, 10.7.9, 10.7.10, 10.7.21, 17.1.19,
  #                            RV 6.24.5, RV 10.129.1, RV 10.129.4, VSM 13.3 -- and it is the
  #                            only reach this entity has into the Vena and Skambha
  #                            cosmogonies, which have no morphological annotation. Hosts:
  #                            AVS 8.9.18 "the existent thing (bhuta)" and VSM 17.17 "all
  #                            things existent", which are bhuta-; AVS 10.7.31 "nothing else
  #                            existent" and RV 10.183.3 "in all existent beings", generic.
  #
  # REJECTED. Every one of these was probed and read; they are recorded because the
  # absence is a decision.
  #   sat        7 hits, 1 true (AVS 17.1.19). VSM 2.33 `yatheha puruso sat` and VSM 17.24
  #              `yatha sat` are the subjunctive "so that there may be"; VSM 32.9 `guha sat`
  #              (x2) is "hidden"; RV 6.27.2 is the predicative "faithful". The bare word is
  #              not usable, and this is the single most important refusal here.
  #   satah      9 hits, 0 true for existence, and it fails in the WORST possible direction.
  #              Five hits (RV 3.31.8, 9.21.7, 9.86.5, 9.86.6, SV UTTARA 3.1.1.2/3.1.1.3) are
  #              the masculine participle "of him who is / the good man". The other three --
  #              RV 10.72.2, RV 10.72.3, AVS 10.7.25 -- are `asatah` with its initial a-
  #              elided after a preceding -e/-o, so on the surface `satah` there MEANS
  #              NON-EXISTENCE. A surface probe would have filed the two verses that say
  #              "existence sprang from non-existence" under existence, on the evidence of
  #              the word for non-existence. Only the annotation shows this; it is why those
  #              two verses are reached through the English `non-existence` instead.
  #   sato       15 hits, 2 true (RV 10.129.4, RV 7.87.6). Thirteen are the masculine
  #              genitive participle: `mahas te sato` "thee who art great" (RV 1.36.3,
  #              8.101.11, and its SV and YV parallels), `ghorasya sato`, `svayudhasya te
  #              sato`. 13% is not an alias.
  #   asat       25 hits, 1 true (AVS 8.4.12). The annotation is unanimous on the other 24:
  #              all 13 Rigvedic hits are the 3sg present SUBJUNCTIVE of as- ("may it be"),
  #              and the AV and YV hits read the same way -- "that this man may be free from
  #              complaints" (AVS 4.13.4), "may she be in the favor of Bhaga" (AVS 14.2.15).
  #              4% precision. This is the trap the whole probe existed to find.
  #   asan       12 hits, 0 true. Subjunctive or the aorist injunctive of as- 2.
  #   asann      7 hits, 2 true (AVS 8.4.8, RV 7.104.8). The other five are the subjunctive.
  #   asatah     REJECTED FOR A DIFFERENT REASON, and the only one: 1 hit, 1 true
  #              (AVS 8.4.8, "let the speaker of what is not be himself non-existent").
  #              At 6 folded characters it is the sole candidate that clears
  #              MIN_SANDHI_ALIAS_CHARS, and on the Samavedic substring path it matches
  #              SV UTTARA 3.1.1.2 inside the glue of `dhruvasya satah` -- the masculine
  #              participle again. Keeping it would require an entry in
  #              vedagraph.enrich.concepts.SANDHI_SUPPRESSED_ALIASES, and one true positive
  #              is not worth making this file depend on a code change. AVS 8.4.8 is still
  #              reached through the English `non-existent`.
  #   satam, sate, sata   0 true between them; all masculine/plural participles ("of the
  #              existing ones", "to him who is"). RV 2.1.3 `vrsabhah satam asi` is
  #              Griffith's "Hero of Heroes".
  #   existence  English, 68 hits, 2 true (RV 10.72.2, 10.72.3, already reached by
  #              `non-existence`). It is Whitney's word for bhuta-/bhuvana- ("lord of
  #              existence", "shepherd of all existence") and Griffith's for ayus- ("prolong
  #              our existence"), so it would take passages from BHUTA and AYUS-LIFE. 3%.
  #
  # WHAT WAS NOT MODELLED, deliberately: no entity for the pair-as-a-pair. `sac ca asac ca`
  # is a real formula and it is answerable as the intersection of these two entities, which
  # is a query rather than a node.

  - concept_id: VG:CONCEPT:SAT-EXISTENCE
    preferred_label_sa: sat
    preferred_label_en: existence
    node_type: PHILOSOPHICAL_CONCEPT
    definition: >-
      The existent, what is, as against what is not. In this corpus still a substantivised
      neuter participle of as- 'to be' and not yet a settled noun: it is predicated of
      things and asked after, as in the one Being the sages call by many names (RV
      1.164.46), and it is not the Upanishadic Being. Distinct from satya 'truth', which is
      a different stem with its own entity, VG:CONCEPT:SATYA-TRUTH; the two alias sets are
      disjoint and neither leaks into the other.
    aliases_sa: [sad, sac]
    aliases_en: [existent]
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:ASAT-NONEXISTENCE
    preferred_label_sa: asat
    preferred_label_en: non-existence
    node_type: PHILOSOPHICAL_CONCEPT
    definition: >-
      Non-existence: the asat of "there was neither non-existence nor existence then" (RV
      10.129.1). Unlike sat it is already a noun in its own right -- the Rigvedic
      annotation lemmatises it asant-, separately from the root -- and existence is twice
      said to have sprung from it (RV 10.72.2-3). In the Atharvaveda it is one pole of a
      paired cosmological formula (AVS 4.1.1, 10.7.10, 17.1.19). Not filed under
      VG:CONCEPT:SAT-EXISTENCE: non-existence is not a kind of existence.
    aliases_sa: [nāsad, asac, asati]
    aliases_en: [non-existent, non-existence]
    broader: []
    related_devatas: []

