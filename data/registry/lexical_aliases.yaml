# Reviewed LEXICAL alias registry.
#
# A lexical alias answers one question only: "does this word, occurring in the
# Sanskrit text, count as evidence that the mantra MENTIONS this entity?"
#
# It is NOT the same thing as an entity alias in anukramani_aliases.yaml. That
# file says "this Anukramaṇī spelling names this entity"; being listed there
# does not make a string a lexical alias, and nothing promotes one to the other.
#
# Matching is by the annotation layer's own stable lemma identifier
# (VEDAWEB.ZURICH, Grassmann-linked, e.g. lemma_agni_79). No substring search
# over mantra text is performed anywhere in the pipeline, and no fuzzy match may
# ever create an edge.
#
# Fields:
#   entity_key    pinned canonical entity, must exist in devatas.yaml
#   lemma         the annotation layer's lemma, verbatim, for human review
#   lemma_ids     the stable lemma identifiers actually matched on
#   alias_type    see LexicalAliasType; DO_NOT_MATCH is a suppression rule
#   review_status only ACCEPTED may produce MENTIONS_ENTITY
#   evidence      why this decision was made
#
# Optional deterministic morphology constraints (policy v2). Declared only where one
# lemma really is shared between a deity and something else and the annotation's own
# features separate them; most aliases declare none. A token carrying no value for a
# constrained feature fails closed.
#   allowed_pos          part-of-speech readings that may establish a mention
#   allowed_gender       gender values that may establish a mention
#   allowed_number       number values that may establish a mention
#   allowed_case         case values that may establish a mention
#   forbidden_features   feature=VALUE pairs that disqualify a token outright
#
# Policy v2 also requires, for every alias and without configuration, that the token's
# lemma *string* be the alias's lemma. A shared lemma id is necessary but not
# sufficient: the annotators file a derived stem under the base entry's id.
#
# Scope of v1: DEVATA only. See ADR-013 for why RISHI lexical mentions are
# deferred, and RIGVEDA_LEXICAL_MENTION_POLICY.md for the full policy.
policy_version: rigveda-lexical-mention-policy-v2
annotation_layer_id: VEDAWEB.ZURICH

aliases:

# ---------------------------------------------------------------------------
# ACCEPTED - the lemma is the proper name of the deity and the annotation layer
# assigns it a single dedicated lexical entry.
