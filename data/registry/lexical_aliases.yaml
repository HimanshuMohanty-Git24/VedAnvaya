# ---------------------------------------------------------------------------
# DO_NOT_MATCH - the registry holds a Devatā entity under this label because the
# Anukramaṇī assigns it, but the corresponding lemma is an ordinary Vedic noun
# whose occurrences overwhelmingly do not name the deity. Matching them would
# manufacture thousands of false mentions. These rules suppress that, and are
# the main reason mention precision is high.
# ---------------------------------------------------------------------------

