  - work_id: VG:WORK:YV:VSM
    abbreviation: VSM
    veda: Shukla Yajurveda
    work_name: Vajasaneyi Samhita
    recension: Madhyandina
    hierarchy: [Adhyaya, Mantra]
    citation_pattern: "VSM {adhyaya}.{mantra}"
    key_pattern: "VG:YV:VSM:A{adhyaya:02d}:V{mantra:03d}"
    identity_status: FINAL
    scope: >-
      SAMHITA ONLY, and only the SHUKLA (White) Yajurveda in the Vajasaneyi Madhyandina
      recension: 1,975 mantras. The KRISHNA (Black) Yajurveda is NOT HELD AT ALL -- no
      Taittiriya, no Kathaka, no Maitrayani, no Kapisthala samhita is present. This is the
      exclusion most likely to mislead, because "the Yajurveda" in ordinary use covers
      both and the Krishna recensions carry prose brahmana passages interleaved with the
      mantras that have no counterpart here. The Kanva recension of the Shukla Yajurveda
      is also absent, as is the Satapatha Brahmana.
    completeness: >-
      1,975 of 1,975 attested mantras carry a canonical key and a canonical citation
      (100.0%). 1,939 of 1,975 carry a translation (98.2%), 36 of which were recovered by
      forced address independently verified against Griffith's printed labels; three more
      such addresses are withheld by owner decision. 36 verses are reached by no
      rendering. No shortfall in addressing.
      Every one of this work's 2,240 seer attributions is source-stated rather than
      container-inherited, which is the opposite of the Atharvavedic pattern.
    excluded_corpora:
      - KRISHNA_YAJURVEDA_TAITTIRIYA
      - KRISHNA_YAJURVEDA_KATHAKA
      - KRISHNA_YAJURVEDA_MAITRAYANI
      - KRISHNA_YAJURVEDA_KAPISTHALA
      - SHUKLA_YAJURVEDA_KANVA_RECENSION
      - SATAPATHA_BRAHMANA
      - UPANISAD
    rights: >-
      Per data/canonical/yajurveda_vsm_v1/manifest.json rights_summary:
      WIKISOURCE_SA.YV.VSM.ACCENTED CC_BY_SA; WIKISOURCE_SA.YV.VSM.UNACCENTED CC_BY_SA.
      Recorded verbatim from the manifest, not adjudicated here.
    display_label_override: "Vajasaneyi Samhita - Shukla Yajurveda, Madhyandina recension (Krishna Yajurveda NOT included)"
    scope_evidence: >-
      Coverage measured in docs/reports/KNOWLEDGE_MODEL_V3_WORLD_CLASS_SCORECARD.md
      section A. The Kanva, Taittiriya, Kathaka, Maitrayani and Satapatha bodies are named
      as known-and-not-held in data/source_registry/yajurveda_sources.yaml and in the same
      scorecard section's "why not 4" paragraph.

  - work_id: VG:WORK:AV:SAU
    abbreviation: AVS
    veda: Atharvaveda
    work_name: Atharvaveda Samhita
    recension: Shaunaka
    hierarchy: [Kanda, Sukta, Mantra]
    citation_pattern: "AVS {kanda}.{sukta}.{mantra}"
    key_pattern: "VG:AV:SAU:K{kanda:02d}:S{sukta:03d}:V{mantra:03d}"
    identity_status: FINAL
    scope: >-
      SAMHITA ONLY, Saunaka recension, held as a WORKING_PRIVATE digital corpus: 5,839
      mantras. The PAIPPALADA recension is NOT HELD, and it is not a minor variant -- it
      is a substantially different collection with its own hymn order, so an
      Atharvavedic absence measured here is an absence from the Saunaka recension only.
      The Gopatha Brahmana is not held. Every one of this work's 5,084 seer attributions
      is a sukta label projected downward onto its mantras rather than a per-verse
      statement, so a per-verse Atharvavedic seer claim cannot be made from this corpus.
    completeness: >-
      5,839 mantras carry a canonical key and a canonical citation against an attested
      total of approximately 5,977 (97.7%). Translation coverage is four populations and
      not one percentage: 5,715 verses carry an English rendering of their own (97.9%),
      the Whitney/Lanman text extended over kanda 20 from Griffith's Atharvaveda, which
      Whitney excluded; 68 more are covered by a multi-verse print unit; 21 show
      Griffith's Rigvedic rendering of verified-identical text, disclosed as reuse; 18
      carry his Latin rather than English; and 17 are reached by no rendering at all.
      The divergence from the attested total is OPEN_RESEARCH, attributed to
      edition-relative verse totals, with one candidate mechanism raised and falsified.
