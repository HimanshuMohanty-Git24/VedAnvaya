schema_version: 1.0.0
works:
  - work_id: VG:WORK:RV:SAK
    abbreviation: RV
    veda: Rigveda
    work_name: Rigveda Samhita
    recension: Shakala
    hierarchy: [Mandala, Sukta, Mantra]
    citation_pattern: "RV {mandala}.{sukta}.{mantra}"
    key_pattern: "VG:RV:SAK:M{mandala:02d}:S{sukta:03d}:V{mantra:03d}"
    identity_status: FINAL
    scope: >-
      SAMHITA ONLY, Sakala recension. This work_id addresses the 10,552 mantras of the
      Rigveda Samhita in the Sakala recension and nothing else. It does not address a
      second Rigvedic recension, nor any post-samhita layer: no Brahmana, no Aranyaka and
      no Upanisad are held. The accented samhitapatha is carried as two text versions of
      these same mantras -- a primary and a parallel reading, 10,552 each -- not as
      separate works. NO PADAPATHA IS CARRIED: text_versions.yaml declares one
      (VEDAWEB.PADAPATHA) and it was never ingested, so the graph holds 0 padapatha text
      versions and every text_form in it is SAMHITA. The declared artifact covers Mandala 1
      alone, so even acquiring it would not make the word-analysed text available for the
      corpus.
    completeness: >-
      10,552 of 10,552 attested mantras carry a canonical key and a canonical citation
      (100.0%). No shortfall in addressing. Translation coverage is four populations and
      not one percentage: 10,479 verses carry an English rendering of their own (99.3%);
      60 more are covered by a multi-verse print unit anchored on a neighbour, because
      Griffith renders each pair of dvipada verses in RV 1.65-1.70 as one unit; 6 carry
      his Latin rather than English, the passages he judged too explicit for an English
      readership; and 7 are reached by no rendering at all.
    excluded_corpora:
      - SECOND_RIGVEDIC_RECENSION
      - RIGVEDIC_BRAHMANA
      - RIGVEDIC_ARANYAKA
      - UPANISAD
    rights: >-
      Per data/canonical/rigveda_full_v1/manifest.json rights_summary:
      GRETIL.RV.AUFRECHT CC_BY_NC_SA; VEDAWEB.AUFRECHT CC_BY_NC_SA;
      GRIFFITH.RV.1896 PUBLIC_DOMAIN; VHP PERMISSION_REQUIRED_REFERENCE_ONLY.
      Recorded verbatim from the manifest, not adjudicated here.
    scope_evidence: >-
      Coverage figures measured in docs/reports/KNOWLEDGE_MODEL_V3_WORLD_CLASS_SCORECARD.md
      section A. The absence of a second recension and of every post-samhita layer is
      recorded in the same section's "why not 4" paragraph.

  - work_id: VG:WORK:SV:KAU
    abbreviation: SV
    veda: Samaveda
    work_name: Samaveda Samhita
    recension: Kauthuma
    hierarchy: [Collection, Prapathaka, Ardha, Dasati, Verse]
    citation_pattern: "SV {collection} {prapathaka}.{ardha}.{dasati}.{verse}, levels omitted where the collection declares none"
    key_pattern: "VG:SV:KAU:{collection}[:P{prapathaka:02d}][:R{ardha:02d}][:D{dasati:02d}]:V{verse:02d}"
    urn_pattern: "urn:vedagraph:mantra:samaveda:kauthuma:{collection_lower}[:prapathaka:{prapathaka}][:ardha:{ardha}][:dasati:{dasati}]:verse:{verse}"
    identity_status: FINAL
    coverage_status: INCOMPLETE_BOUNDED
    scope: >-
      ARCIKA ONLY. THIS IS NOT THE COMPLETE SAMAVEDA. This work_id addresses the Kauthuma
      arcika verse corpus and cannot address the gana collections: the gramageya,
      aranyakageya, uhagana and uhyagana books are a PARALLEL AND LARGER body (roughly
      2,639 ganas against 1,875 arcika verses) which requires its own work_id. The sung
      dimension is not a decoration on the verse skeleton; it is the reason the Samaveda
      is a distinct Veda rather than a Rigveda excerpt. Any claim that VedaGraph "has the
      Samaveda" while holding only the arcika is FALSE. No second recension and no
      post-samhita layer are held.
    completeness: >-
      1,844 of the traditional 1,875 verses carry a canonical key (98.3%). The 31 without
      one are enumerated with causes: 2 running numbers the selected witness does not
      print, 9 verses in one Uttararcika dasati whose printed run is non-contiguous, and
      21 verses in four Uttararcika dasati groups where two witnesses disagree about the
      partition. ZERO Samavedic translations are released (0.0%), and that is unchanged:
      173 verses now show Griffith's Rigvedic English on text verified
      character-identical, disclosed as a reused rendering and counted in no Samavedic
      translation figure, and the remaining 1,671 are reached by nothing. An SV zero in
      any translation-derived layer is an absent layer, not an absent text.
    excluded_corpora:
      - SAMAVEDA_GRAMAGEYA_GANA
      - SAMAVEDA_ARANYAKAGEYA_GANA
      - SAMAVEDA_UHAGANA
      - SAMAVEDA_UHYAGANA
      - SECOND_SAMAVEDIC_RECENSION
      - SAMAVEDIC_BRAHMANA
      - UPANISAD
    rights: >-
      Per data/canonical/samaveda_arcika_v1/manifest.json rights_summary:
      WIKISOURCE_SA.SV.KAU.ARCIKA_MULA CC_BY_SA; translations NONE_RELEASED;
      audio NONE_RELEASED; CC BY-SA 4.0 share-alike is a live obligation and is one-way
      incompatible with CC0. Recorded verbatim from the manifest, not adjudicated here.
    display_label_override: "Samaveda Samhita - Kauthuma arcika only (gana corpus NOT included)"
    scope_evidence: >-
      The scope sentence is the manifest's own rights_summary.scope field in
      data/canonical/samaveda_arcika_v1/manifest.json, quoted rather than paraphrased. The
      1,875 = 1,844 + 29 + 2 reconciliation is at
      docs/reports/FULL_INGESTION_RELEASE_QA.md:411. The SCOPE LIMIT paragraph in this
      entry's own notes states the same fact and predates this property; the property
      exists because the notes field is not queryable as data.
    notes: >-
      FROZEN 2026-09-07 by SAMAVEDA_REFERENT_INTEGRITY_REPAIR. The key names the
      COLLECTION and never numbers it, and it carries only the levels that collection
      actually declares:
      VG:SV:KAU:CHANDA:P{prapathaka:02d}:D{dasati:02d}:V{verse:02d};
      VG:SV:KAU:ARANYA:D{dasati:02d}:V{verse:02d};
      VG:SV:KAU:MAHANAMNYA:V{verse:02d};
      VG:SV:KAU:UTTARA:P{prapathaka:02d}:R{ardha:02d}:D{dasati:02d}:V{verse:02d}.
      WHY THE TOP SLOT IS A NAME AND NOT AN ORDINAL. The superseded candidate key wrote
      A{arcika}, which encoded the contested four-sibling arity. That ordinal does not
      denote a stable collection: slot-1 value 2 means Aranyarcika in the Pandey e-text
      lineage and Uttararcika in all six independent witnesses, a 1,225-verse referent
      collision. The arity dispute is a BRACKETING dispute - every witness holds the same
      four blocks in the same order with the same extents 585/55/10/1225 - so naming the
      blocks records exactly what is agreed and leaves the bracketing to the container
      spine, where changing it renumbers nothing. MEASURED: collection assignment agrees
      between the two lineages for 1,867 of 1,867 comparable printed verse numbers, zero
      disagreements. arcika_arity is therefore RESOLVED as an identity question without
      the philological question having to be settled.
      The four SUB-collections are named rather than the two top-level groupings because
      the extent of the grouping name "Purvarcika" is itself disputed - 650 in Wikisource,
      the Vedic Heritage Portal, Wikipedia and B. R. Sharma HOS 57, but 585 in Caland and
      Vedapeetha, which treat the Aranyaka portion as a separate collection. The four
      sub-collection extents are disputed by nobody.
      THE LITERAL 0 IS GONE. The superseded key wrote 0 for a level the rejected edition
      treated as absent, which made that edition's flattening choice part of canonical
      identity. A level a collection does not declare is now OMITTED from the key, and
      identity.sv_mantra_identity REFUSES a value for an undeclared level rather than
      coercing it. Every level value is padded to two digits so a key sorts
      lexicographically in coordinate order and no key is a prefix of another.
      ARDHA is present only in the Uttararcika, where it is load-bearing: dasati resets
      inside each ardha, so ardha 1 spans dasati 1-23 and ardha 2 spans dasati 1-22 in
      prapathaka 1, and dropping ardha would collapse 22 distinct units onto 22 keys.
      MEASURED: prapathaka and ardha agree between the two lineages for 1,217 of 1,217
      comparable Uttararcika verses. Ardha is deliberately ABSENT from the Chanda key even
      though an identified printed edition asserts it there, because in the Chanda
      collection the dasati already numbers 1-10 continuously across the prapathaka, so
      the ardha carries no information and admitting it would create a representable
      ambiguity: the same key shape could then be produced by the print convention, which
      numbers dasati 1-5 per ardha, denoting a different unit. Omitting it makes the print
      convention unrepresentable rather than ambiguously representable, which fails closed.
      The print's per-ardha dasati reset is recorded as an alternate Citation, not as a
      competing canonical value; both machine-readable witnesses number the Chanda dasati
      1-10 continuously and agree for 585 of 585 verses.
      VERSE IS THE DASATI-LOCAL INDEX, never the samhita running number. The selected
      witness prints only the running number, so the local index is DERIVED from the
      source's own printed arithmetic - rank within the dasati's contiguous ascending run -
      and the derivation FAILS CLOSED when that run is not contiguous.
      THE ORDER-INDEPENDENCE CLAIM, STATED EXACTLY, because a blanket version of it was
      recorded here and was too strong. The VERSE index is order-free: it is arithmetic
      over printed numbers, sorted by value, so permuting verse blocks on a page cannot
      change it - verified over Chanda, Aranya and Mahanamnya leaf pages and over whole
      Uttararcika dasati units, 3 seeds each. The DASATI of an Uttararcika verse is a
      different matter: it is the nearest preceding printed dasati numeral in DOCUMENT
      ORDER, because that is how the source declares it, so moving a verse block across a
      heading does move its dasati. That affects the dasati level of 1,194 of the 1,844
      released keys. It is a property of the source's own layout rather than of the parser,
      and no alternative exists short of the source numbering each verse - but it is not
      the same as "document order is never consulted", and it must not be written that
      way. The
      superseded adapter wrote the running number straight into the verse slot, minting
      keys such as V45 inside D05 for verses that do not exist; deriving the address from
      the page title and the printed numbers makes that class of defect unrepresentable.
      COVERAGE IS INCOMPLETE AND BOUNDED, and this is a coverage gap, not an identity
      ambiguity: 1,844 of the traditional 1,875 verses carry a canonical key. The 31
      without one are (a) 2 running numbers the selected witness does not print at all
      (1179, 1315), of which 1179 is unprinted by BOTH witnesses and is the single
      genuinely unattested value; (b) 9 verses in one Uttararcika dasati whose printed run
      is non-contiguous because the source typesets 1179 as a second 1181, a defect both
      lineages share; and (c) 21 verses in four Uttararcika dasati groups where the
      two witnesses disagree about the dasati partition.
      CORRECTED 2026-09-07 by FULL_SV_YV_AV_CANONICAL_INGESTION: clause (c) read "where the
      selected witness omits a dasati heading, so its partition is contradicted by the
      second witness". That attributes the defect to the wrong witness in THREE of the four
      groups. Measured per group: at UTTARA P4:R2:D14 the selected witness prints the
      heading and the second witness runs D13 to six verses; at P5:R1:D17 the selected
      witness prints it and the second witness skips label 17 entirely in that ardha; at
      P5:R2:D5 the selected witness prints it and the second witness prints labels 6-9
      twice with four welded verses carrying two running numbers each. Only P4:R1:D22 is
      the shape originally described - one heading over 1107-1112 then an unheaded block
      1113-1115. The WITHHOLDING IS UNCHANGED and remains correct: an unadjudicated
      disagreement between two witnesses is not a licence to mint from either. What was
      wrong was the stated reason, which named the selected witness as defective on
      evidence that says the opposite. In every case the WHOLE affected dasati is withheld, so supplying
      the missing structure later ADDS keys without renumbering any existing one.
      A REFERENT-INTEGRITY GATE now binds each released key to the occurrence it denotes.
      UUID determinism was never evidence of identity correctness: the only identity check
      recomputed uuid5(namespace, urn) from the URN alone and so returned the identical
      verdict before and after a key silently started denoting a different verse. See
      models.PassageReferentBinding, vedagraph.referent, and the committed baseline at
      tests/fixtures/identity/sv_referent_baseline.jsonl.
      Hierarchy confirmed from the selected source record, not from secondary literature:
      the GRETIL Samavedasamhita TEI named in structure_evidence_sha256 below declares its
      own reference system in its body as
      "arcika | prapathaka | ardha | dasati | verse | line". This supersedes the earlier
      VHP-derived guess of [Arcika, Prapathaka, Ardha, Adhyaya, Khanda, Mantra]: the fourth
      level is Dasati, and there is no Adhyaya or Khanda identity level. "line" is a
      sub-verse pada label (a/c/e) and is deliberately excluded from identity.
      Depth is NOT uniform, and that remains true; what changed is how absence is encoded.
      SUPERSEDED 2026-09-07 by SAMAVEDA_REFERENT_INTEGRITY_REPAIR: this paragraph used to
      read "the edition encodes an absent level as a literal 0, so 0 is a legitimate
      hierarchy value for this work alone and identity.sv_mantra_identity applies
      _non_negative rather than _positive". Both halves are now false. _non_negative no
      longer exists; 0 is refused on every path for every work; and a level a collection
      does not declare is OMITTED from the key rather than zero-filled. The Aranya
      collection has no prapathaka and no ardha, the Mahanamnya collection has none of the
      three, and their keys simply carry no such segment. The fourth slot still has no
      fixed cardinality: a Chanda dasati is a decad numbered 1-10 continuously across the
      prapathaka, while an Uttararcika dasati resets inside each ardha and holds two or
      three verses - which is exactly why ardha is in the Uttara key and not the Chanda
      key.
      Identity is NOT reduced to a running mantra number, as originally required. The
      artifact prints a running verse number 1..1875 and it is recorded only as a
      non-canonical Citation.
      CORRECTED 2026-09-07 by SAMAVEDA_CANONICAL_IDENTITY_FINAL_CLOSURE: this note
      previously described that apparatus as "defective (five values absent, one
      duplicated)". THE SOURCE PRINTS EXACTLY 1875 VERSE-TERMINAL MARKERS, measured
      directly. Only ONE value (1179) is genuinely unprinted, typeset as 1181. The other
      four are printed and lost to adapter regex strictness: 1133 and 1592 carry a SINGLE
      danda where the parser requires a double, 1211 is printed corrupt as "121clsdir", and
      1035 is defeated by a stray "rm" label prefix. The "five absent" figure was a PARSER
      CONFIGURATION, not a property of the source: under a punctuation-tolerant read it
      becomes two, then one. Only the total gap of 7 is invariant. The refusal to use the
      running number as identity is UNAFFECTED and is independently strengthened - the
      Samasrami printed edition carries no continuous 1..1875 series at all, only a
      per-section counter that resets. See docs/reports/SAMAVEDA_COUNT_RECONCILIATION.md and
      data/source_registry/samaveda_count_ledger.yaml. The named
      kanda division (agneya, aindra, saumya-pavamana, aranya) cannot be a tree level
      because its colophons cut across prapathaka/ardha boundaries; it is an alternate
      Citation system. The artifact contains no gana collection, so no gana slot exists;
      gana collections would need their own work_id.
      Corroboration, counted exactly: the hierarchy rests on the selected source's own
      declared reference system, plus TWO independent textual witnesses and ONE independent
      addressing scheme. The two textual witnesses are Sanskrit Wikisource (840 CC BY-SA
      4.0 pages under samavedah/kauthumiya/samhita - of which only ~106 are ARCIKA, the
      other 725 being GANA and out of scope for this work_id, so "840 pages" must never be
      cited as this work's coverage - whose independence is graded NOT_A_VERBATIM_COPY
      rather than PROVEN (downgraded 2026-09-07 by the sole rights authority: the maxim
      "a text cannot inherit from a source it does not share an error with" is invalid as a
      universal, it excludes only verbatim UNCORRECTED inheritance, and the claim rests on
      ONE locus whose defect is conspicuous enough to be exactly what a copyist would
      repair; not load-bearing for identity, load-bearing for text redistribution) because
      it CORRECTS the Pandey text where that text is corrupt: GRETIL
      mislabels verse 2's first pada as 0101a, bleeding the pada into verse 1 and stripping
      it from verse 2, while Wikisource has both verses whole) and Griffith 1895 translating
      Benfey, which predates Pandey by a century and uses DECADE as the fourth level. The
      addressing scheme is TITUS's 8-level Kauthuma address, which corroborates the level
      vocabulary, but whose TEXT is NOT independent: the page carries
      "Copyright (C) 1998, 1999 Anshuman Pandey".
      CORRECTED 2026-09-07 by SAMAVEDA_CANONICAL_IDENTITY_FINAL_CLOSURE: this sentence
      previously also credited TITUS with corroborating "that there are exactly four
      arcikas". IT CANNOT. TITUS is Pandey lineage, which this very note concedes in its
      next clause, so it is the SAME WITNESS as GRETIL on any question of arity. That
      withdrawal leaves the four-arcika claim with ONE witness, ZERO independent
      corroborations, and SIX independent contradictions: Sanskrit Wikisource, Griffith
      1895, Wikipedia, the Vedic Heritage Portal (Government of India), Vedapeetha and
      B. R. Sharma HOS 57 all read TWO top-level arcikas, with Chandas / Aranya /
      Mahanamnya as the three SUB-SEGMENTS of the Purvarcika; Caland/Kashikar read three.
      THIS IS THE SAME OVERSTATEMENT PATTERN THIS NOTE ALREADY CORRECTS BELOW, ONE LAYER
      DEEPER: the earlier correction fixed the TEXTUAL witness count and left the ARITY
      claim resting on the identical defect.
      All witnesses hold the SAME FOUR BLOCKS IN THE SAME ORDER, so this is a BRACKETING
      dispute, not a dispute about the text - but the bracketing determines what number the
      TOP SLOT of the candidate key takes, and two hard coordinate collisions were verified
      because of it. Tracked as the new blocker dimension arcika_arity
      (OPEN_PHILOLOGICAL_REVIEW). The hierarchy LEVEL LIST is unaffected and is now
      additionally corroborated by the printed colophons of an identified edition. See
      docs/reports/SAMAVEDA_ADDRESSING_STABILITY.md.
      GRETIL, sanskritdocuments and TITUS are THREE re-publications of ONE Pandey 1998/99
      e-text, so their agreement is NOT corroboration. An earlier version of this note
      claimed four independent witnesses; that overstated the evidence and is corrected
      here. The hierarchy conclusion is unaffected.
      SUPERSEDED 2026-09-07: the following paragraph said "key_pattern nevertheless stays
      null and identity_status stays RESEARCH_REQUIRED ... the commitment cannot yet be
      made". The commitment HAS been made - see the FROZEN block at the head of this note.
      Its observation that "the hierarchy is an observation; the key is a commitment"
      remains the right distinction and is why the two were tracked separately. Its
      statement of the blocker is retained because it is the historical record of a
      position this project held and then found to be a category error: edition identity
      never reached a UUID, and no RV/YV/AV entry names an edition either.
      The blocker is no longer "no witness exists" - it is that NO WITNESS
      COMBINES AN IDENTIFIED PRINTED EDITION WITH REDISTRIBUTION RIGHTS. The GRETIL TEI
      was adjudicated unusable on two independent grounds: its rights (the upstream it
      names, the 1998 legacy HTML, self-declares reference-only and prohibits
      modification, so the CC BY-NC-SA 4.0 on the 2020 TEI is a blanket licence its
      upstream never granted) and its edition identity (sourceDesc/bibl is empty). Other
      Pandey-lineage re-publishers do not help: two of them agreeing is the same defect
      twice rather than corroboration. Wikisource clears the RIGHTS bar but not the
      EDITION bar, being a community transcription with no single named printed edition.
      Resolution requires an identified printed Kauthuma edition that is also
      redistributable - by written consent from the data-entry rights holder, by a fresh
      transcription from a public-domain printed edition, or by Wikisource pages being
      traced to a named edition.
      SUPERSEDED 2026-09-07: this note previously recorded a CANDIDATE key
      "VG:SV:KAU:A{arcika}:P{prapathaka:02d}:R{ardha}:D{dasati:02d}:V{verse:02d}" and
      insisted nothing treat it as canonical. That key is retired and is no longer
      implemented anywhere. It is not merely renamed: its top slot was the contested arcika
      ordinal and its zero-filled slots encoded the rejected edition's flattening. The
      declared key is the one in key_pattern above, and it IS canonical. Every retired key
      has a migration entry in data/source_registry/samaveda_referent_migrations.jsonl.
      NOTE FOR THE RECORD, because it is a governance lesson rather than a detail: a null
      key_pattern did NOT prevent 139 passages being materialized at status CANONICAL under
      the candidate key, three of them holding welded multi-verse referents. The null key
      was not functioning as a safety mechanism. What actually prevents that class of
      defect is the referent-binding gate, not the absence of a declaration.
      SCOPE LIMIT, not a caveat: this work_id addresses the arcika (verse) text ONLY. The
      Kauthuma gana collections - roughly 2,639 ganas across gramageya, aranyakageya, uha
      and uhya/rahasya, against 1,875 arcika verses - are a PARALLEL AND LARGER body that
      this work_id does not cover and cannot address. The sung dimension is not a
      decoration on the verse skeleton; it is the reason the Samaveda is a distinct Veda
      rather than a Rigveda excerpt. Any claim that VedaGraph "has the Samaveda" while
      holding only the arcika is FALSE. The ganas need their own work_id; Sanskrit
      Wikisource carries all four gana books, so this is real future work and not a
      hypothetical.
      See docs/FOUR_VEDA_STRUCTURAL_MODEL.md and ADR-017.
