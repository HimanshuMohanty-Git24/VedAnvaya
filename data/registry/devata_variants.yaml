- variant_entity_id: VG:DEVATA:APTRNAH-SURYAH
  base_entity_id: VG:DEVATA:SURYAH
  relation: EPITHET_QUALIFIED
  evidence: >-
    NOT_IN_SCOPE. The label `aptṛṇaḥ-sūryaḥ` does contain the base label `sūryaḥ`
    as a whole printed word, so on a substring test it is the strongest-looking
    new candidate in the corpus. It is placed out of scope on the orthography of
    the source itself, stated in the V3.2 header above: in the WSC2023 divinity
    field a hyphen is the co-ordination marker the editors use between separate
    names, and never an epithet join. Nine of the other nine hyphenated tokens
    are lists of distinct deities or patrons. So this label is a composite, and
    composites belong to devata_components.yaml, not here.
  review_status: NOT_IN_SCOPE
  notes: >-
    THE ONE UNRESOLVED VARIANT IN THE V3.2 SWEEP, and it reverses a standing
    project decision, so it is flagged rather than quietly applied. The
    display_label of the node reads "Surya, with the epithet aptrna" and
    devata_taxonomy.yaml stores `label_iast: aptṛṇaḥ sūrya` with a SPACE -- the
    taxonomy normalised away the hyphen that carries the evidence. That gloss is
    a project reading and not a source label, so it cannot be evidence here, but
    a reader should know the two disagree. Both readings nevertheless agree on
    the operational outcome -- keep the entity separate, assert no edge -- which
    is why this row changes nothing and destroys nothing. It would be
    NEEDS_REVIEW in devata_components.yaml with an empty component list, because
    `sūryaḥ` is registered but `aptṛṇaḥ` is not (VG:DEVATA:APTRNAH does not
    exist, checked). WHAT WOULD SETTLE IT: the printed devatā slot for RV 1.191
    in an edition other than WSC2023, showing whether the reading is a dvandva or
    a bahuvrīhi epithet. 16 attributions ride on it. The residual while it stays
    open: `deities_by_axis` reports it as a third INDIVIDUAL deity on the solar
    axis beside `sūryaḥ` and `sāvitrī sūryā`.

