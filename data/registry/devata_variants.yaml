# Epithet-qualified Devatā labels resolved to the base deity they qualify.
#
# WHAT THIS FILE IS FOR, AND THE DEFECT THAT MADE IT NECESSARY
#
# Benchmark Q86 asks which natural phenomena are personified as deities, and
# `DEVATA_ASSOCIATED_WITH` answered "fire (agni)" with FIVE personifications:
# Agni, Agni Jātavedas, Agni Pavamāna, Agni the slayer of demons, and the self
# of Agni. Those are one god under four epithets. The Anukramaṇī's devatā slot
# records the qualified form the hymn uses, the registry pins each distinct slot
# value as its own entity because entity_key is pinned identity and must not be
# recomputed, and nothing then said that four of the five are the same being. So
# a count of personifications counted labels.
#
# QUESTION_UNLOCKED = Q86 (personified natural phenomena, currently MISLEADING:
# the class membership of the answer is wrong because the count is inflated by
# unresolved duplicates). It also gives Q38 the exclusion it needs.
#
# WHAT COUNTS AS EVIDENCE HERE
#
# One thing only: the SOURCE LABEL. A row is asserted when the qualified label
# contains the base deity's own registered label, or a regular sandhi or case
# form of it, plus a qualifier that qualifies rather than replaces. That is the
# same evidence class as the hyphen-joined composites in devata_components.yaml
# -- read off the label the editors printed, not inferred from religion.
#
# WHAT IS REFUSED, AND WHY THE REFUSALS ARE IN THE FILE
#
# A shared string is not identity. `sāvitrī sūryā` is Sūryā the daughter of
# Savitṛ, a feminine figure who marries the Aśvins; she is not Sūrya the sun
# with an epithet, and her label differs from his in gender, not in qualifier.
# `ahirbudhnyaḥ` is the serpent of the deep, a distinct Rigvedic figure whose
# identification with `ahiḥ` (Vṛtra's snake) is a claim about mythology. Both
# are recorded as REFUSED so the absence of an edge is a decision.
#
# Number variants (`gauḥ`/`gāvaḥ`, `aśvaḥ`/`aśvāḥ`) are NOT handled here. They
# are a different relation -- singular and plural of the same deified object,
# which the registry already distinguishes by `structure` -- and merging them
# would need a decision about whether a plural collective is the same devatā as
# its singular. That decision is not made in this file and the cases are listed
# as NOT_IN_SCOPE.
#
# Composite and pair labels are not handled here either: `dyāvāpṛthivyau` is not
# an epithet variant of Pṛthivī, it is a compound, and it is already recorded in
# devata_components.yaml. Excluding composites from a personification count is
# `structure`-based and needs no edge.
#
# PROVENANCE
#
# adjudicator: MODEL_ADJUDICATED. No human has reviewed this file. It is graded
# TIER_C / L3_MODEL_ADJUDICATED for that reason and never TIER_B, and every row
# states the label substring a reviewer has to check.
policy_version: vedagraph-devata-variant-policy-v1
adjudicator: MODEL_ADJUDICATED

