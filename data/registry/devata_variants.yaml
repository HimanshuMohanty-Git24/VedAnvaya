# ===========================================================================
# V3.2. ORTHOGRAPHIC_VARIANT -- a fourth relation value, and why it was added
# ===========================================================================
#
# THE DEFECT. Six pairs of Devatā nodes render an identical `display_label`. The
# reproducing query is
#
#   MATCH (v:Devata)
#   WITH toLower(trim(v.display_label)) AS lbl, collect(v.entity_key) AS keys,
#        count(*) AS n
#   WHERE n > 1 AND lbl IS NOT NULL
#   RETURN lbl, n, keys ORDER BY n DESC, lbl;
#
# `preferred_label` yields zero collisions and `label_iast` yields a different
# four, so `display_label` is the surface that carries this defect and the other
# two are not substitutes for it.
#
# THE ROOT CAUSE, worth stating because it will recur. The entity_key slug folds
# diacritics but preserves ASCII letter identity and word boundaries. So a
# source-side spelling slip MERGES silently when it differs only in a diacritic,
# and FORKS into a second pinned entity when it differs in an ASCII letter or a
# word boundary. The proof is `sarasvati-iḻā-bhāratī`: it is the one source
# divinity token with no matching node label, because it merged into
# `sarasvatī-iḻā-bhāratī` on the macron alone. Four of the six pairs are that
# same mechanism caught on the other side of the fold.
#
# WHY A NEW RELATION VALUE RATHER THAN ONE OF THE THREE ALREADY HERE.
# EPITHET_QUALIFIED is simply false of these rows: there is no qualifier.
# `dadhikrā` and `dadhikrāḥ` differ by a visarga, not by an epithet, and
# asserting EPITHET_QUALIFIED would record a qualifier no reviewer could find in
# the label. PART_OF_DEITY is false for the same reason, and NUMBER_VARIANT is
# false because these are not singular/plural contrasts -- `structure` is
# identical on both sides of every pair, which is exactly what distinguishes them
# from the gāvaḥ/gauḥ rows recorded NOT_IN_SCOPE above.
#
# WHY THE EPITHET_VARIANT_OF EDGE IS NEVERTHELESS THE RIGHT CARRIER. The job of
# this edge in every consumer is "resolve me to my canonical base before
# counting" -- `natural_phenomena_personified`, `deities_by_axis` and
# `deity_widest_range` all use it that way and nothing else does. The `relation`
# property exists precisely so a consumer can narrow: the PART_OF_DEITY row above
# is already not an epithet, and its note says "a consumer that wants only
# epithets can filter on the relation". This is that mechanism used a second
# time, not a new one.
#
# NOTHING IS MERGED, exactly as above. Both nodes keep their entity_key, their
# attributions and their mentions. entity_key is pinned identity in this project
# and no row in this file removes a node.
#
# WHAT THE ALTERNATIVE WOULD HAVE COST. Without these four rows the counts stay
# inflated by 10 + 1 + 7 + 4 = 22 Anukramaṇī attributions across four pairs. A
# distinct `display_label` alone would hide the doubled string while leaving the
# doubled count, which is the worse of the two failures: it makes the defect
# invisible without making it false.

