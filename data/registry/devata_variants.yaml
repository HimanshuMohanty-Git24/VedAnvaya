  review_status: ASSERTED
  notes: >-
    The highest-impact row of the four: 10 attributions sitting unresolved beside
    805. Direction chosen so the base is the better-attested node.

- variant_entity_id: VG:DEVATA:DEVYAU-HOTARAU
  base_entity_id: VG:DEVATA:DAIVYAU-HOTARAU
  relation: ORTHOGRAPHIC_VARIANT
  evidence: >-
