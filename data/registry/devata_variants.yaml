# ===========================================================================
# V3.2 CLOSURE. Bounded sweep of all 214 Devatā for the same defect class as
# the Agni rows above: an INDIVIDUAL-structure node whose printed label is a
# registered base label (or a regular sandhi/case form of it) plus a
# qualifier, left unlinked to its base.
# ===========================================================================
#
# METHOD, so a reviewer can rerun it. For every Devatā label, test whether any
# OTHER Devatā's preferred_label -- or a diacritic-folded / nominative-stripped
# form of it -- occurs inside it, either as the final compound member or as a
# space-or-hyphen-delimited whole token. Across the 72 INDIVIDUAL nodes the
# strict test returns eight hits. Five are the rows already asserted above. Two
# are pure orthographic accidents: `puruṣaḥ` ends in the letters of `uṣāḥ`, and
# `rātriḥ` ends in the letters of the ṛṣi `atriḥ`. That leaves exactly ONE new
# assertable row, and it is the one the V3.1 report named.
#
# THE ORTHOGRAPHIC RULE THIS SWEEP ESTABLISHED, and which decides two rows.
#
# The sweep went to the printed source rather than to the graph labels, because
# the evidence rule of this file is the SOURCE LABEL. The Anukramaṇī data is at
# data/raw/wsc2023/2026-09-04/*.txt, ten files, one per maṇḍala, in the format
# `hymn.verses.seer.divinity.meter`. Parsing all ten yields 212 distinct
# divinity tokens against 214 node labels -- effectively 1:1.
#
# In that source the hyphen is the editors' CO-ORDINATION MARKER between
# separate names, and it is never an epithet join. The complete inventory of
# hyphenated divinity tokens is ten strings, and nine are unambiguously lists of
# distinct deities or patrons: `iḻā-sarasvatī-mahī`, `sarasvatī-iḻā-bhāratī`,
# `sarasvati-iḻā-bhāratī`, `indrāṇī-varuṇānī-agnāyī`, `vāk-āpaḥ`,
# `indraḥ-marutaḥ`, `agniḥ-marutaḥ`, `agniḥ-mitrāvaruṇau-rātriḥ-savitā`, and a
# five-member list of human patrons. Meanwhile EVERY epithet-qualified label in
# the same source is printed with a space (`jātavedā agniḥ`, `pavamāno agniḥ`,
# `pavamānaḥ somaḥ`, `sasarparī vāk`, `sāvitrī sūryā`) or solid (`rakṣohāgniḥ`,
# `marutvānindraḥ`). Space or solid means epithet plus name; a hyphen means two
# co-ordinated names. That is a label-only test, which is the evidence class
# this file demands, and it is what places `aptṛṇaḥ-sūryaḥ` out of scope below.

