# Structural region sampling. Each entry is an (arcika, prapathaka, ardha, dasati)
# unit. Absent levels are written 0 because that is how the source writes them.
# Every unit is here for a stated reason; nothing was chosen because it was first.
sample_units:
  # --- Purvarcika (arcika 1): early / middle / late ---
  - unit: [1, 1, 1, 1]
    region: PURVARCIKA_EARLY
    rationale: first dasati of the work; also carries the DUPLICATE_LINE_LABEL defect
  - unit: [1, 1, 1, 5]
    region: PURVARCIKA_EARLY
    rationale: last dasati of the first ardha; carries a TRANSLITERATION_RESIDUE defect
  - unit: [1, 3, 2, 8]
    region: PURVARCIKA_MIDDLE
    rationale: mid-work dasati in the second ardha, aindra kanda
  - unit: [1, 6, 2, 9]
    region: PURVARCIKA_LATE
    rationale: final dasati of the Purvarcika; carries an UNEXPECTED_UPPERCASE defect

  # --- Aranya arcika (arcika 2): depth anomaly, no prapathaka and no ardha ---
  - unit: [2, 0, 0, 1]
    region: ARANYA_ARCIKA
    rationale: proves the parser and identity handle a missing prapathaka and ardha

  # --- Mahanamnya arcika (arcika 3): maximum depth anomaly, dasati also absent ---
  - unit: [3, 0, 0, 0]
    region: MAHANAMNYA_ARCIKA
    rationale: shallowest arcika in the edition; all three middle levels absent

  # --- Uttararcika (arcika 4): early / middle / late ---
  - unit: [4, 1, 1, 1]
    region: UTTARARCIKA_EARLY
    rationale: first unit of the Uttararcika; SPACED label notation; has inline anukramani
  - unit: [4, 1, 1, 2]
    region: UTTARARCIKA_EARLY
    rationale: second unit; has inline anukramani
  - unit: [4, 1, 1, 6]
    region: UTTARARCIKA_EARLY
    rationale: carries a six-line DUPLICATE_LINE_LABEL collision
  - unit: [4, 1, 1, 12]
    region: UTTARARCIKA_EARLY
    rationale: carries a TRANSLITERATION_RESIDUE defect
  - unit: [4, 4, 1, 1]
    region: UTTARARCIKA_MIDDLE
    rationale: control unit adjacent to the corrupt-label region
  - unit: [4, 4, 1, 2]
    region: UTTARARCIKA_MIDDLE
    rationale: the UNPARSEABLE_REFERENCE_LABEL region; one source line is not ingested
  - unit: [4, 4, 1, 3]
    region: UTTARARCIKA_MIDDLE
    rationale: control unit adjacent to the corrupt-label region
  - unit: [4, 5, 1, 18]
    region: UTTARARCIKA_MIDDLE
    rationale: carries a TRANSLITERATION_RESIDUE defect
  - unit: [4, 5, 2, 6]
    region: UTTARARCIKA_MIDDLE
    rationale: DUPLICATE_LINE_LABEL collision in the second ardha
  - unit: [4, 5, 2, 10]
    region: UTTARARCIKA_MIDDLE
    rationale: DUPLICATE_LINE_LABEL collision spanning three verses
  - unit: [4, 6, 2, 16]
    region: UTTARARCIKA_MIDDLE
    rationale: the ZERO_VERSE_INDEX defect; also the CONCAT/SPACED notation boundary
  - unit: [4, 9, 3, 1]
    region: UTTARARCIKA_LATE
    rationale: final prapathaka, third ardha
  - unit: [4, 9, 3, 5]
    region: UTTARARCIKA_LATE
    rationale: final prapathaka, mid third ardha
  - unit: [4, 9, 3, 9]
    region: UTTARARCIKA_LATE
    rationale: last unit of the work; carries an UNEXPECTED_UPPERCASE defect

