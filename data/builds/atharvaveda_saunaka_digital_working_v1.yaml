# Atharvaveda-Samhita (Saunaka) WORKING PRIVATE corpus - build configuration
#
# Declarative record of what this build produced and why. The executable is
# scripts/build_atharvaveda_working_v1.py; this file is the auditable statement of intent,
# pinned snapshots and policy, so a reader can tell whether the build honoured it.
#
# This is a DEVELOPMENT corpus. It is not a scholarly critical edition and does not claim
# to be one. See `honesty:` below, which is the most important block in this file.

config_version: atharvaveda-digital-working-v1
build_id: atharvaveda_saunaka_digital_working_v1
build_version: 1.0.0-avs-digital-working.1
working_corpus_id: ATHARVAVEDA_SAUNAKA_DIGITAL_WORKING_V1
status: WORKING_PRIVATE
output_dir: data/canonical/atharvaveda_saunaka_digital_working_v1
work_id: VG:WORK:AV:SAU
work_abbreviation: AVS
recension: Shaunaka
hierarchy: [Kanda, Sukta, Mantra]
scope: FULL_CORPUS

identity_functions:
  # Unchanged from the pilot. This build redesigns no key, URN or UUID rule.
  section: avs_kanda_identity(kanda)
  hymn: avs_sukta_identity(kanda, sukta)
  mantra: avs_mantra_identity(kanda, sukta, mantra)
identity_derivation: canonical key -> canonical URN -> uuid5(namespace, URN). Never a text hash.

parser_version: gretil-avs-saunaka-legacy-html-v1
comparator_version: text-compare-v1
provenance_source: >-
  Source and SourceArtifact records are READ FROM data/registry via load_sources() and
  load_source_artifacts(); this build constructs neither. The registry's pinned
  checksum_sha256 is cross-checked against the bytes actually read, so a registry edit that
  repointed an artifact at different bytes fails the build.

# ---------------------------------------------------------------------------------------
# HONESTY. Read this before citing anything built here.
# ---------------------------------------------------------------------------------------
honesty:
  is_independent_roth_whitney_1856_transcription: false
  actual_lineage: >-
    Gli inni dell' Atharvaveda (Saunaka), transliteration by Chatia Orlandi, Pisa 1991,
    collated with R. Roth and W. D. Whitney, Atharva Veda Sanhita, Berlin 1856; input by
    Vladimir Petr and Petr Vavrousek; TITUS redaction by Jost Gippert 1997; books 11-20
    improved by Arlo Griffiths 2000 and Philipp Kubisch 2007, revised by Arlo Griffiths
    2009; re-hosted by GRETIL as legacy HTML.
  roth_whitney_1856_role: >-
    A COLLATION BASIS inside the Orlandi/TITUS lineage. It is not the text this corpus was
    read from, and no record here may be described as a Roth/Whitney transcription.
  supersedes: >-
    data/canonical/atharvaveda_saunaka_1856_provisional and the cancelled image-based
    transcription pipeline (scripts/build_atharvaveda_canonical.py). Those outputs are
    stale. This build neither reads nor regenerates them. It supersedes them as the AV
    WORKING corpus only; it does not supersede them as a scholarly edition, because it
    makes no scholarly-edition claim.
  publication_authorised: false

# ---------------------------------------------------------------------------------------
# Pinned source snapshots. Immutable, hashed, written by PoliteFetcher. Never overwritten.
# ---------------------------------------------------------------------------------------
