config_version: rigveda-semantic-pilot-v1
selection_rule_version: rigveda-semantic-pilot-selection-v1
corpus_dataset_id: rigveda_full_v1
description: Mantra ids only. No Sanskrit or translation text is stored here; every evidence packet is
  rebuilt from the pinned corpus using these ids.
strata:
- name: TRANSLATION_MISSING
  quota: 60
  selected: 52
  reason: 'no Griffith verse exists: the packet carries Sanskrit and morphology only, and the model must
    decline rather than translate'
- name: LEXICALLY_AMBIGUOUS
  quota: 45
  selected: 45
  reason: the lexical layer deliberately refused to resolve a token here; a model that resolves it anyway
    is doing so without evidence
- name: EXACT_PARALLEL
  quota: 45
  selected: 45
  reason: the mantra recurs verbatim elsewhere, so its extraction can be compared with that of its twin
- name: NEAR_PARALLEL
  quota: 30
  selected: 30
  reason: 'a near-parallel: similar wording, possibly different claims'
- name: RARE_DEVATA
  quota: 40
  selected: 40
  reason: assigned a Devatā with at most 12 mantras
- name: RARE_CHANDAS
  quota: 25
  selected: 25
  reason: assigned a metre with at most 12 mantras
- name: RARE_RISHI
  quota: 25
  selected: 25
  reason: assigned a Ṛṣi with at most 12 mantras
- name: MULTI_DEVATA
  quota: 25
  selected: 6
  reason: tradition assigns more than one Devatā
- name: NO_LEXICAL_MENTION
  quota: 40
  selected: 40
  reason: no deterministic mention was found, so the model has metadata and text but no pre-established
    entity to lean on
- name: SHORT_SUKTA
  quota: 25
  selected: 25
  reason: 'a Sūkta of at most 3 mantras: little context'
- name: LONG_SUKTA
  quota: 25
  selected: 25
  reason: 'a Sūkta of at least 30 mantras: a narrow window'
- name: MANDALA_09_SOMA
  quota: 40
  selected: 40
  reason: 'Maṇḍala 9 is almost entirely Soma Pavamāna: highly repetitive ritual language'
- name: MANDALA_10
  quota: 40
  selected: 40
  reason: Maṇḍala 10 carries the cosmological and philosophical material, where the temptation to interpret
    is strongest
- name: MANDALA_SPREAD
  quota: 70
  selected: 70
  reason: an even draw across all ten Maṇḍalas so no book is represented only by its difficult cases
