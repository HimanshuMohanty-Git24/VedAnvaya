# Atharvavedic human-concern, condition and rite entities, for merge into
# data/registry/concepts.yaml.
#
# This fragment follows the entry shape and the alias discipline of
# data/registry/concepts.yaml exactly; read that file's header first, because every rule
# stated there applies here and is not restated. Evidence for every alias below --
# per-Veda token counts, substring hosts, intrusion share, verdict -- is in
# docs/reports/ATHARVAVEDA_CONCERN_MODEL_V1.md, together with every candidate that was
# measured and dropped.
#
# ---------------------------------------------------------------------------
# Type vocabulary: this fragment is V2-only, by construction
# ---------------------------------------------------------------------------
# `HUMAN_CONCERN`, `CONDITION` and `SOCIAL_RITE` are members of
# vedagraph.domain.ontology.DomainNodeType, NOT of the deliberately frozen
# vedagraph.semantic.ontology.SemanticNodeType. They therefore load only through the V2
# path -- vedagraph.domain.registry.load_domain_entities, which passes
# ALL_NODE_TYPE_NAMES as `allowed_node_types` -- and a bare V1 `load_concepts(root)` will
# raise on them, which is the intended behaviour and not a defect to route around: the
# frozen enum must not grow, because 448 sealed semantic extractions record the ontology
# version they were produced under.
# `PLANT`, `OBJECT` and `STATE` below are frozen-enum members and load either way.
#
# Verified, not assumed: merging this fragment with data/registry/concepts.yaml (89) and
# domain_entities_material.yaml (44) yields 162 entities against MAX_CONCEPT_NODES 260,
# with `duplicate_ids: []` and `alias_collisions: []` -- so none of the 224 Sanskrit or 27
# English aliases here collides with the base registry OR with the material fragment.
# The four predicates in concern_predicates.yaml match the V2 relationship signatures in
# vedagraph.domain.ontology exactly: ADDRESSES_CONCERN -> HumanConcern, TREATS ->
# Condition, PROTECTS_FROM -> {Condition, HumanConcern}, USED_FOR_RITE -> SocialRite.
#
# ---------------------------------------------------------------------------
# What is deliberately NOT here, because it already exists
# ---------------------------------------------------------------------------
# Healing (VG:CONCEPT:BHESAJA-HEALING), protection (VG:CONCEPT:SARMAN-PROTECTION),
# progeny (VG:CONCEPT:PRAJA-OFFSPRING), lifespan (VG:CONCEPT:AYUS-LIFE), wellbeing
# (VG:CONCEPT:SVASTI-WELLBEING), wealth (VG:CONCEPT:VASU-WEALTH), guilt
# (VG:CONCEPT:ENAS-SIN), demons (VG:CONCEPT:RAKSAS-DEMON), human enemies
# (VG:CONCEPT:SATRU-ENEMY) and herbs collectively (VG:CONCEPT:OSADHI-PLANTS) are all in
# the registry already. Re-declaring any of them would be a duplicate node with worse
# evidence, and the six PLANT entities below are filed under OSADHI-PLANTS rather than
# beside it.
#
# ---------------------------------------------------------------------------
# takman / yaksma: fever is left with VG:CONCEPT:YAKSMA-DISEASE, on purpose
# ---------------------------------------------------------------------------
# VG:CONCEPT:YAKSMA-DISEASE already claims `takman`, `takmanam` and `takma`. Measured over
# the corpus, those three tokens are 22 of the 36 Atharvaveda mantras that carry any
# takman- form; the unclaimed remainder is takmane (6), takmann (2), takmanah (1),
# takmana (1), takmams (1), takmanasana (1), takmanasanam (1), plus ruraḥ (1) and ruraṃ
# (1). A sibling TAKMAN-FEVER built on that remainder would hold ~39% of the evidence
# while carrying the label "fever", and VG:CONCEPT:YAKSMA-DISEASE would keep the larger
# 61% share under the label "disease" -- the specific reading of every passage would then
# depend on which of two nodes happened to win, and the split would be invisible to a
# reader of either. So option (a) was taken: no fever entity is added here.
# The correct fix is a single edit to data/registry/concepts.yaml, which this fragment is
# forbidden to make: move the whole takman- paradigm out of YAKSMA-DISEASE into one new
# TAKMAN-FEVER entity, leaving yaksma-, amiva- and rapas in YAKSMA-DISEASE. Recorded here
# so the decision is a choice with a reason and not an oversight.
#
# Consumption/yaksma itself is likewise untouched. The seven CONDITION entities that are
# genuinely kinds of sickness (jaundice, ksetriya, balasa, viskandha, grahi, asrava,
# kasa) are filed under YAKSMA-DISEASE via `broader`; worms, poison, sorcery, evil dream
# and the ill-named beings are causes or agents rather than kinds of sickness, and take
# no parent.

policy_version: vedagraph-concern-lexicon-v1

