# Atharvavedic practical knowledge, V3: the fever split, three re-typings, and the
# conditions, plants, substances, agents, concerns and rites the V1 pass left out.
#
# ADDITIVE MERGE FRAGMENT. This file is never loaded alone and never edits another file.
# It uses the entry shape of domain_entities_material.yaml exactly; read that file's
# header first, because every rule stated there applies here and is not restated.
#
# ===========================================================================
# HOW THE ALIASES WERE CHOSEN -- the standard this file had to meet
# ===========================================================================
# Every Sanskrit alias below was probed against all 20,210 mantras and then READ: for
# each alias at least one witness passage per Veda in which it occurs was printed with
# its translation and judged. Across the pass: 165 Sanskrit aliases stand; 42 candidate
# forms were read and REJECTED, each with the passage that rejected it; 23 candidate
# words token-matched nothing anywhere in the corpus and are recorded as absent rather
# than as rejected. 152 of the surviving and borderline forms additionally went through
# the full two-pass host/intrusion probe, which is what caught the five sandhi hazards
# named below. Every rejection is tabulated in
# docs/reports/ATHARVAVEDA_CONCERN_MODEL_V3.md. The four that matter most:
#
#   palitasya  Grey hair and a grey priest are the same string. RV 1.164.1 "this
#              benignant Priest, with eld grey-coloured" and AVS 9.9.1 "this pleasant
#              hoary invoker" are both the hoary man, not the ailment AVS 1.23 removes.
#              PALITA-GREYING rests on `palitaṃ` alone, 2 of 2 in the kilasa hymn.
#   aruṣ       Not the wound. `aruṣ-` as probed matches 90 occurrences of aruṣá
#              'ruddy', the colour of Agni's horses (RV 3.15.3, RV 4.58.7). No wound
#              entity was authored; the only genuine token is `arusrāṇam` (AVS 2.3.3,
#              2.3.5), two hits of a compound.
#   pāmán      In the translation, not in the text. Whitney renders AVS 5.22.12 "thy
#              cousin the scab (pāmán)", but the stored Sanskrit surface of that mantra
#              reads `pāpmā́` -- pāpman, 'evil'. `pāman`, `pāmnā` and `pāpman` all
#              token-match nothing. The scab is Whitney's reading of a word the corpus
#              does not have there, so no entity was authored for it.
#   vidradhe   RV 4.32.23 "Like two slight images of girls, unrobed, upon a new-wrought
#              post" -- not the abscess of AVS 6.127. VIDRADHA-ABSCESS keeps
#              `vidradhasya` and `vidradhaṃ`, 3 of 3 Atharvavedic.
#
# ===========================================================================
# BLOCKER: five aliases here need a companion sandhi suppression
# ===========================================================================
# MIN_SANDHI_ALIAS_CHARS is 6, so an alias of six characters or more is matched anywhere
# in the boundary-free surface as well as as a whole word. Five aliases below clear that
# floor and were measured to be wrong on the sandhi path. They are correct on the token
# path and are kept, but until they are added to
# vedagraph.enrich.concepts.SANDHI_SUPPRESSED_ALIASES -- an edit this fragment is
# forbidden to make -- they will produce the false positives named:
#
#   amīvāḥ       sits inside `anamīvāḥ` ('free from disease'), whose sense is the exact
#                opposite; 5 of 15 sandhi hits are the negation or a word-boundary glue.
#                NOTE: `amīvāḥ` is ALREADY a live alias of VG:CONCEPT:YAKSMA-DISEASE, so
#                this is a defect in the shipped registry and not only a risk here.
#   rapaso       inside `nārīrapaso`, the glue of nā́rīr apáso ('women, active ones').
#   apacit       inside `apacitiṃ` (RV 4.28.4 'took great vengeance') and
#                `dadhadindriyamūrjamapacitiṃṃ`; apaciti 'requital' is a different word.
#   arāyam       7 of its 8 sandhi hits are word-boundary glue, not the sprite; the
#                token pass finds 1.
#   sarasvatyām  inside the glue of sárasvatyā + a m-initial word: AVS 5.7.5
#                `sarasvatyā manoyujā` and VSM 21.46 / 21.47 `sarasvatyā meṣasya`, all
#                three of which are the GODDESS. This is the one that matters most,
#                because it is the whole basis of the new River node.
#
# ===========================================================================
# MERGE ORDER IS NOT OPTIONAL
# ===========================================================================
# Probed with scripts/probe_domain_aliases.py --collisions, six aliases below are
# currently claimed by VG:CONCEPT:YAKSMA-DISEASE: takman, takmā, takmānam, amīvā,
# amīvāḥ, rapaḥ. That is the fold this file exists to undo. The `retypings` block below
# carries a FULL REPLACEMENT entry for YAKSMA-DISEASE with those six removed; if the
# merge inserts the new entities without applying that replacement, load_concepts will
# refuse the registry with six alias_collisions. The refusal is correct. Apply the
# replacement.
#
# `rāṣṭraṃ` and `rāṣṭram` collide with VG:CONCEPT:RAJAN-KINGSHIP. No dominion entity was
# authored -- see `refusals`. Nothing else in this file collides.
#
# Merged count: 89 (registry) + 45 (material) + 29 (concern V1) + 41 (here) = 204,
# against MAX_CONCEPT_NODES 260.

policy_version: vedagraph-concern-lexicon-v3

# ---------------------------------------------------------------------------
# RE-TYPINGS AND REPLACEMENTS
# ---------------------------------------------------------------------------
# Declarative, because vedagraph.domain.registry.NODE_TYPE_OVERRIDES is the established
# mechanism and lives in src/, which this fragment may not touch. `kind: retype` needs
# only a NODE_TYPE_OVERRIDES row; `kind: replace` needs the entry under `concepts` below
# to supersede the base registry's entry of the same concept_id.
retypings:

  - concept_id: VG:CONCEPT:AYUDHA-WEAPON
    kind: retype
    from_node_type: OBJECT
    to_node_type: WEAPON
    verified_live: >-
      labels are [Concept, DomainEntity, Object]; MATCH (n:Weapon) returns 3 nodes --
      bowstring, noose, axe -- and none of them is the weapon word itself.
    reason: >-
      V1 typed the generic weapon word OBJECT, which was reasonable before WEAPON
      existed. The consequence measured in the live graph is that `MATCH (:Weapon)`
      answers "which weapons occur in the corpus" with the bowstring, the noose and the
      axe, and omits the bow, the arrow and the word āyudha itself. WEAPON carries the
      Object label through SUPERLABELS, so the retype cannot make any existing question
      harder to ask.

  - concept_id: VG:CONCEPT:VAJRA-THUNDERBOLT
    kind: retype
    from_node_type: OBJECT
    to_node_type: WEAPON
    verified_live: labels are [Concept, DomainEntity, Object].
    reason: >-
      Indra's bolt is the most frequently named weapon in the corpus and was invisible to
      the Weapon label. Its own `broader` already points at AYUDHA-WEAPON, so the two
      retypes have to happen together or the taxonomy asserts that a Weapon's parent is a
      plain Object.

  - concept_id: VG:CONCEPT:RAKSAS-DEMON
    kind: retype
    from_node_type: CONCEPT
    to_node_type: CONDITION
    verified_live: >-
      labels are [Concept, DomainEntity]; PROTECTS_FROM has range {Condition,
      HumanConcern}, so no protective edge to it can be emitted today.
    reason: >-
      This is the retype that closes the evaluator's closest miss. The demon is what the
      Atharvavedic charm asks protection FROM, and the model had no way to say so: the
      endpoint signature of PROTECTS_FROM admits Condition and HumanConcern only, and a
      projector that emitted Passage->Concept would fail the contract check. CONDITION is
      the right home and the precedent is already inside the V1 concern file, which types
      DURNAMAN-ILL-NAMED-BEINGS and KRTYA-SORCERY as CONDITION and says in its own header
      that "worms, poison, sorcery, evil dream and the ill-named beings are causes or
      agents rather than kinds of sickness". A demon is an agent of the same kind. Its
      alias set was re-read and is uniformly hostile beings -- rakṣas, piśāca,
      yātudhāna -- with no ethnonym in it.

  - concept_id: VG:CONCEPT:YAKSMA-DISEASE
    kind: replace
    from_node_type: STATE
    to_node_type: CONDITION
    verified_live: >-
      One State-labelled node carries yakṣmam, yakṣmaṃ, yakṣmaḥ, yakṣmo, takman,
      takmānam, takmā, amīvā, amīvāḥ and rapaḥ, and 15 of the 33 mantras that contain a
      takman- form reach it as "disease (yakṣma)". Four distinct afflictions, one node,
      and the label of the node is the name of only one of them.
    reason: >-
      See the takman section below. The replacement entry under `concepts` keeps the
      yakṣma- paradigm, adds the two yakṣma compounds the V1 alias set had missed
      (rājayakṣma "royal yakṣma", ajñātayakṣma "unknown yakṣma"), and hands takman-,
      amīvā- and rapas- to three new sibling entities. Type moves STATE -> CONDITION so
      that consumption can take a protective edge at all; STATE takes none of the four
      concern predicates.

# ---------------------------------------------------------------------------
# The takman split, and why it is four nodes and not two
# ---------------------------------------------------------------------------
# The V1 concern file recorded a deliberate refusal to split takman out, on the ground
# that YAKSMA-DISEASE already claimed three takman- forms holding "22 of the 36
# Atharvaveda mantras that carry any takman- form", so a sibling built on the remainder
# would hold about 39% of the evidence. That arithmetic was right and the conclusion
# followed from it, but the premise was that the split had to be made on the UNCLAIMED
# remainder. It does not: the whole paradigm can move, and this file moves it.
#
# Measured, by enumerating every folded token beginning takman- and takmā-:
#   10 distinct forms, 36 occurrences, 33 distinct mantras, 33 of 33 Atharvaveda.
#   Zero occurrences in the Rigveda, Samaveda or Yajurveda. Zero rejections: every one
#   of the 36 is Whitney's "fever".
#   12 hymns, concentrated: AVS 5.22 (13 mantras), 1.25 (4), 5.4 (3), 6.20 (3),
#   11.2 (2), 19.39 (2), and one each in 4.9, 5.30, 9.8, 11.4, 12.5, 19.34.
#
# Two independent witnesses that the corpus itself treats takman and yakṣma as different
# things, neither of which is an inference:
#   (1) AVS 5.4.9 names both in one line -- "both do thou efface all yákṣma, and do thou
#       make the fever sapless" -- and AVS 5.30.16 does it again: "by it I have exorcised
#       the yákṣma and the hundred pangs of the fever."
#   (2) The Anukramaṇī's own deity ascription for the whole of AVS 5.22 is
#       VG:ASCRIPTION:AV:TAKMANACANADEVATYAM-7B6D, takmanāçanadevatyam, "having
#       fever-destruction as its deity" -- a distinct ascription from the yakṣmanāçana-
#       ones on AVS 1.25 and 6.20. The tradition indexed these hymns under fever before
#       this repository existed.
#
# What the old node's edges should become, stated per edge type because they do not all
# move the same way. Measured on the live graph: VG:CONCEPT:YAKSMA-DISEASE currently
# carries 92 MENTIONS_ENTITY, 180 ABOUT_CONCEPT and 3 DESCRIBES in-edges, and no TREATS
# or PROTECTS_FROM, because a State cannot be their object.
#   MENTIONS_ENTITY  Do not repoint by hand. Every one of the 92 is derived from an alias
#                    match, so re-running the concept enrichment against the replaced
#                    registry regenerates all of them correctly and splits them four ways
#                    by construction. Repointing them individually would be guessing
#                    which alias produced which edge, and the mention_id is the only
#                    thing that records it.
#   ABOUT_CONCEPT    Same: derived, regenerate.
#   DESCRIBES        3 edges, from Ritual or SocialRite nodes. These were authored, not
#                    derived, so they must be re-read one at a time; a rite described as
#                    being about "disease" is about yakṣma unless its passage carries a
#                    takman- form, and none of the three does.
#   BROADER_THAN     The V1 file files seven CONDITION entities under YAKSMA-DISEASE via
#                    `broader`: jaundice, kṣetriya, balāsa, viṣkandha, grāhi, āsrāva,
#                    kāsa. All seven stay, and eleven more are added below.
#   DEVATA_ASSOCIATED_WITH
#                    VG:DEVATA:YAKSMANASANAH exists in the graph with the display label
#                    "the destruction of consumption". It stays on YAKSMA-DISEASE and is
#                    deliberately NOT copied to TAKMAN-FEVER: consumption-destruction is
#                    not fever-destruction, and copying it would re-create the conflation
#                    in the deity layer having just removed it from the condition layer.
#                    TAKMAN-FEVER therefore takes `related_devatas: []`, because the
#                    honest target -- takmanāçanadevatyam -- is a DEVATA_ASCRIPTION row
#                    in data/registry/devata_ascriptions_av.yaml and is not a Devata node
#                    in the graph. Measured: the Atharvaveda has 0 HAS_DEVATA edges.

concepts:

  # -------------------------------------------------------------------------
  # CONDITION -- the four afflictions that were one node
  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:YAKSMA-DISEASE
    preferred_label_sa: yakṣma
    preferred_label_en: consumption
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Yakṣma: the wasting, consuming sickness that is drawn out of a patient limb by limb
      in the Atharvaveda's ejection charms and flies away like a bird. Not fever, which
      is takman, and not affliction in general, which is amīvā.
    aliases_sa: [yakṣmam, yakṣmaṃ, yakṣmaḥ, yakṣmo, yakṣma, yakṣmā, yakṣmān, yakṣmāt,
                 yakṣmād, yakṣmāso, yakṣmasya, yakṣmeṇa, yakṣmāṇāṃ, yakṣmanāśanīḥ,
                 rājayakṣmāt, rājayakṣmas, rājayakṣmo, ajñātayakṣmād]
    aliases_en: [consumption, wasting]
    broader: []
    related_devatas: [VG:DEVATA:YAKSMANASANAH]

  - concept_id: VG:CONCEPT:TAKMAN-FEVER
    preferred_label_sa: takman
    preferred_label_en: fever
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Takman, the Atharvaveda's fever: addressed in the second person, classified by its
      period (tertian, quartan, constant), by its season (autumnal, cold, hot, of the
      rainy season) and by its colour, and sent away to named foreign peoples. It has its
      own hymns -- AVS 1.25, 5.22, 6.20 -- and occurs nowhere outside the Atharvaveda.
    aliases_sa: [takman, takmane, takmann, takmanaḥ, takmanā, takmā, takmānaṃ, takmānam,
                 takmanāśana, takmanāśanam]
    aliases_en: []
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:AMIVA-AFFLICTION
    preferred_label_sa: amīvā
    preferred_label_en: affliction
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Amīvā: sickness in general, the affliction a god is asked to smite or expel rather
      than a named complaint. The one member of this group that is a four-Veda word --
      Soma, Brahmaṇaspati and Vāstoṣpati are each called amīvahán, "slayer of amīvā".
    aliases_sa: [amīvā, amīvāḥ, amīvāṃ, amīvāś, amīvahā, amīvacātanīḥ, amīvacātanaḥ,
                 amīvacātanam, amīvacātanaṃ]
    aliases_en: []
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:RAPAS-BODILY-HURT
    preferred_label_sa: rapas
    preferred_label_en: bodily hurt
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Rapas: bodily hurt, blemish and defect -- the thing the wind is asked to blow away
      at AVS 4.13 and the thing Rudra is asked to carry one over at RV 2.33. Distinct
      from the root rap- "to prate", which is the same string in four other forms.
    aliases_sa: [rapaḥ, rapas, rapasā, rapaso]
    aliases_en: []
    broader: []
    related_devatas: []

  # -------------------------------------------------------------------------
  # CONDITION -- named ailments the V1 pass did not reach
  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:APACIT-SWELLINGS
    preferred_label_sa: apacit
    preferred_label_en: apacit swellings
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      The apacíts: swellings counted off in fives, sevens and nines over the nape, neck,
      shoulders and sides, and told to fly away like a bird from its nest. Left
      untranslated beyond "swellings" because the corpus gives their sites and their
      colours and not their nature.
    aliases_sa: [apacitām, apacitaḥ, apacit, apacitāṃ, apacito]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:JAYANYA-DISEASE
    preferred_label_sa: jāyānya
    preferred_label_en: jayanya
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Jāyānya, a winged sickness that "flies and enters into a man", crushes the
      breast-bone and descends to the sole; named beside jaundice and visalpaka as
      something the ointment drives out. Untranslated for the same reason as balasa.
    aliases_sa: [jāyānya, jāyānyam, jāyānyaḥ, jāyānyo]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:KILASA-LEUCODERMA
    preferred_label_sa: kilāsa
    preferred_label_en: leprous spot
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      The white or pale skin patch, treated by a night-born dark herb told to give the
      skin back its own colour; the corpus distinguishes the bone-born from the body-born
      kind and from the kind "made by the spoiler".
    aliases_sa: [kilāsaṃ, kilāsasya, kilāsabheṣajam, kilāsanāśanam]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: [VG:DEVATA:OSADHAYAH]

  - concept_id: VG:CONCEPT:PALITA-GREYING
    preferred_label_sa: palita
    preferred_label_en: pallor
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      What is pale, named twice in the kilasa hymn beside the leprous spot and removed by
      the same herb. Kept apart from palitá "hoary" said of a man, which is the same
      string and a different thing.
    aliases_sa: [palitaṃ]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:VIDRADHA-ABSCESS
    preferred_label_sa: vidradha
    preferred_label_en: abscess
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      The vidradhá, an internal swelling or abscess, named with the red balāsa and the
      visalpaka as things a forest tree and a herb are told not to leave a bit of.
    aliases_sa: [vidradhasya, vidradhaṃ]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:SIRSAKTI-HEADACHE
    preferred_label_sa: śīrṣakti
    preferred_label_en: headache
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Head-pain, in the two words the corpus uses for it: śīrṣakti the ache and
      śīrṣāmaya the head-ailment, both expelled by incantation at AVS 9.8.1 and both
      wiped off onto lead and onto a pillow at AVS 12.2.
    aliases_sa: [śīrṣaktim, śīrṣaktiṃ, śīrṣaktir, śīrṣāmayam, śīrṣāmayaṃ]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:KARNASULA-EARACHE
    preferred_label_sa: karṇaśūla
    preferred_label_en: earache
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Ear-pain, named twice in the head-disease charm of AVS 9.8 and nowhere else in the
      four Saṃhitās.
    aliases_sa: [karṇaśūlaṃ]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:ANGABHEDA-LIMB-SPLITTING
    preferred_label_sa: aṅgabheda
    preferred_label_en: limb-splitting
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      The limb-splitter, paired in both its occurrences with the limb-waster and with
      heart-ache, in the two charms that expel head-disease by incantation.
    aliases_sa: [aṅgabhedo, aṅgabhedam]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:VISALPAKA-AILMENT
    preferred_label_sa: visalpaka
    preferred_label_en: visalpaka
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      A named Atharvavedic ailment of the limbs, ears and eyes, ejected together with the
      abscess and the heart-disease; left untranslated because the corpus gives its sites
      and its remedy and not its nature.
    aliases_sa: [visalpakam, visalpakaḥ, visalpakaṃ, visalpasya]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:HRDDYOTA-HEART-BURN
    preferred_label_sa: hṛddyota
    preferred_label_en: heart-burn
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Burning of the heart, sent up to the sun together with yellowness in the jaundice
      hymn, and the thing the heavenly waters are asked for a remedy for at AVS 6.24.
    aliases_sa: [hṛddyoto, hṛddyotabheṣajam]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: [VG:DEVATA:APAH]

  - concept_id: VG:CONCEPT:VATIKRTA-WIND-AILMENT
    preferred_label_sa: vātīkṛta
    preferred_label_en: wind-caused ailment
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      The vātī́kṛta, "made by wind": an ailment named only in the two compounds the
      corpus prints for its remedies -- the viṣāṇakā herb that effaces it and the
      pippalī that is a remedy for it.
    aliases_sa: [vātīkṛtasya, vātīkṛtanāśanī]
    aliases_en: []
    broader: [VG:CONCEPT:YAKSMA-DISEASE]
    related_devatas: []

  - concept_id: VG:CONCEPT:KSIPTA-BRUISE
    preferred_label_sa: kṣipta
    preferred_label_en: bruise
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      What is struck or bruised, named at AVS 6.109 only inside the compound that says
      the pippalī berry is its remedy, and once in the genitive beside the wind-ailment.
    aliases_sa: [kṣiptabheṣajy, kṣiptasya]
    aliases_en: []
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:UNMADA-MADNESS
    preferred_label_sa: unmāda
    preferred_label_en: madness
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Being crazed, in the one Atharvavedic verse that names it: crazed from sin against
      the gods or crazed from a demon, with the speaker declaring he knows the remedy.
    aliases_sa: [unmaditam, unmattam]
    aliases_en: []
    broader: []
    related_devatas: []

  - concept_id: VG:CONCEPT:SEDI-DEBILITY
    preferred_label_sa: sedi
    preferred_label_en: debility
    node_type: CONDITION
    condition_kind: AFFLICTION
    definition: >-
      Sedí, debility or failure: housed in an enemy's dwelling with the hags, wished onto
      an opposing army beside hunger and fear, and trodden down underfoot by the
      ploughman. Every token occurrence is Atharvavedic.
    aliases_sa: [sedir, sedim, sediṃ]
    aliases_en: []
    broader: []
    related_devatas: []

  # -------------------------------------------------------------------------
  # CONDITION -- hostile agency, on the V1 precedent that a cause is a Condition
  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:ARAYA-MALIGNANT-SPRITE
    preferred_label_sa: arāya
    preferred_label_en: malignant sprite
    node_type: CONDITION
    condition_kind: THREAT
    definition: >-
      The arāyá: a noxious sprite blamed for wasting a person and for attacks on a woman,
      smitten away by a herb or an amulet. Whitney renders it variously "niggard",
      "sorceress" and "wizard (? arā́ya-)", which is recorded here because the
      inconsistency is his and not this file's.
