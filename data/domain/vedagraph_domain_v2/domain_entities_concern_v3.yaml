  # -------------------------------------------------------------------------
  # RIVER -- the Sarasvati decision, reversed with evidence
  # -------------------------------------------------------------------------
  # domain_entities_material.yaml records, under "What is deliberately NOT here", that
  # there is no Sarasvatī River node because "its forms token-match 172 mantras ... and
  # the great majority are the goddess". Re-measured here over all 37 folded forms
  # beginning sarasvat-: 206 mantras, RV 69, SV 3, YV 99, AV 35. The share is not the
  # issue and never was; the reason that decision was right is that the aliases it would
  # have to be built on -- sarasvatī, sarasvatīm, sarasvaty -- are the goddess in the
  # large majority of their own occurrences, and a node claiming them would assert "this
  # passage is about a river" of more than a hundred passages about a deity.
  #
  # What changes the answer is that ONE form is not like the others. The locative
  # singular is river in 2 of 2 occurrences corpus-wide, and it is river for a reason
  # that is grammatical rather than statistical: the locative of a river name means "on
  # it", and a goddess is not something one ploughs on or shines on.
  #     AVS 6.30.1  sarasvatyām  "the gods plowed much on the Sarasvatī"      RIVER
  #     RV  3.23.4  sarasvatyāṃ  "on the rivers Drsadvati, Sarasvati, shine"  RIVER
  # Two token hits is the same standard the rest of the river set already meets, and
  # PARUSNI-RIVER already rests on exactly this device: its second alias is `paruṣṇyām`,
  # the locative. Measured token hits for the six existing River nodes: gaṅge 1;
  # yamunā 1, yamune 1; sarayuḥ 2; paruṣṇī 1, paruṣṇyām 1; vipāṭ 1, vipāśam 1;
  # śutudri 1. So this entity is neither the weakest nor a new kind of evidence.
  #
  # It is deliberately narrow. It does NOT claim the river hymns RV 6.61, 7.95 and 7.96,
  # which are reachable through VG:DEVATA:SARASVATI and its HAS_DEVATA edges; those hymns
  # praise a being who is both, and the folded surface cannot separate the readings. What
  # a researcher gets from this node is the two passages where the *form* settles it.

  - concept_id: VG:CONCEPT:SARASVATI-RIVER
    preferred_label_sa: sarasvatī
    preferred_label_en: Sarasvati river
    node_type: RIVER
    definition: >-
      The Sarasvatī as a place on the ground, on the only two occasions in the four
      Saṃhitās where the grammar says so: the barley the gods ploughed on it (AVS 6.30.1)
      and the rivers Agni is asked to shine on (RV 3.23.4). The goddess is
      VG:DEVATA:SARASVATI and is not this node; the river hymns belong to her, because
      their case forms do not distinguish the two.
    aliases_sa: [sarasvatyām, sarasvatyāṃ]
    aliases_en: []
    broader: [VG:CONCEPT:SINDHU-RIVER]
    related_devatas: [VG:DEVATA:SARASVATI, VG:DEVATA:NADYAH]

# ---------------------------------------------------------------------------
# Companion changes this fragment cannot make itself
# ---------------------------------------------------------------------------
required_companion_changes:

  sandhi_suppressions:
    file: src/vedagraph/enrich/concepts.py
    symbol: SANDHI_SUPPRESSED_ALIASES
    entries:
      amīvāḥ: >-
        inside anamīvāḥ ('free from disease'), whose sense is the opposite; 5 of 15
        sandhi hits are the negation or a boundary glue. Already live on
        VG:CONCEPT:YAKSMA-DISEASE, so this is an existing defect and not only a risk here.
      rapaso: inside nārīrapaso, the glue of nā́rīr apáso ('women, active ones').
      apacit: >-
        inside apacitiṃ (RV 4.28.4, apaciti 'requital') and
        dadhadindriyamūrjamapacitiṃṃ (VSM 12.97).
      arāyam: 7 of 8 sandhi hits are word-boundary glue rather than the sprite.
      sarasvatyām: >-
        inside the glue of sárasvatyā + m-initial word -- AVS 5.7.5 sarasvatyā manoyujā,
        VSM 21.46 and 21.47 sarasvatyā meṣasya -- all three of which are the goddess.
        Without this suppression the River node acquires three goddess passages.

  node_type_overrides:
    file: src/vedagraph/domain/registry.py
    symbol: NODE_TYPE_OVERRIDES
    entries:
      VG:CONCEPT:AYUDHA-WEAPON: WEAPON
      VG:CONCEPT:VAJRA-THUNDERBOLT: WEAPON
      VG:CONCEPT:RAKSAS-DEMON: CONDITION
      VG:CONCEPT:YAKSMA-DISEASE: CONDITION

  registry_replacement:
    note: >-
      VG:CONCEPT:YAKSMA-DISEASE must be superseded by the entry in this file, not merged
      beside it. Its base alias set claims takman, takmā, takmānam, amīvā, amīvāḥ and
      rapaḥ, which now belong to four separate entities; merging without the replacement
      raises six alias_collisions and the merge is refused.

# ---------------------------------------------------------------------------
# What was measured and refused
# ---------------------------------------------------------------------------
refusals:
  VG:CONCEPT:SATRU-ENEMY: >-
    NOT re-typed to CONDITION and NOT given a PROTECTS_FROM edge, although that is part
    of the evaluator's finding. Its alias set mixes hostile-intent words (śatru, amitra,
    arāti) with ethnonyms (dāsa, dāsī, dasyu), and several of those aliases match
    Rigvedic passages that describe peoples. "This passage protects from the Dāsa" would
    then be asserted of RV 4.28.4 and its like, which is a claim about a people and not
    about a charm. The demon half of the gap is closed by re-typing RAKSAS-DEMON; the
    rival half by adding SAPATNA-RIVAL-OVERCOMING to protects_from; the human-enemy half
    is closed narrowly and honestly by DURHARD-MALEVOLENT, which is 26 of 26
    Atharvavedic and contains no ethnonym.
  rastra_dominion: >-
    No dominion or kingdom entity. rāṣṭraṃ and rāṣṭram are already claimed by
    VG:CONCEPT:RAJAN-KINGSHIP, which also holds kṣatra and samrāj. A sibling built on the
    unclaimed rāṣṭre would hold 13 of 55 token hits under a near-synonymous label, which
    is precisely the fold this file exists to undo. Royal concerns are answered through
    RAJAN-KINGSHIP and, for the occasion, through SABHA-ASSEMBLY.
  paman_scab: >-
    No scab entity. Whitney has "thy cousin the scab (pāmán)" at AVS 5.22.12, but the
    stored Sanskrit surface of that mantra reads pāpmā́ (pāpman, 'evil'), and pāman,
    pāmnā and pāpman token-match nothing in the corpus.
  udyuga: >-
    No entity. Its single occurrence, AVS 5.22.11, is rendered by Whitney as "the udyugá
    (?)"; he does not identify it, and this file does not invent an identification.
  taimata_snake: >-
    No entity. taimātasya occurs twice and Whitney renders it "the Timātan (?) black
    serpent"; his own query mark is the reason. The two passages remain reachable through
    AHI-SERPENT and VISA-POISON.
  arus_wound: >-
    No wound entity. See the header: aruṣ- as probed is aruṣá 'ruddy', 90 occurrences,
    mostly Rigvedic horses. The genuine wound token is arusrāṇam, twice, at AVS 2.3.3
    and 2.3.5 -- too little to name an affliction on.
  vilohita_anaemia: >-
    No entity. AVS 9.8.1 has Whitney's "anæmia (? vilohitá)", but three of the word's
    five occurrences are Yajurvedic purushamedha victims (VSM 16.7, 16.52, 16.58) where
    it is a colour, so the alias set would be more wrong than right.
  nirrti_calamity: >-
    Deferred, not refused. nirṛti- has 94 occurrences, Atharvaveda-heavy, and Whitney
    renders it "perdition". It is a personified power with a Devatā counterpart, so
    whether it is a Condition or a Devatā is a modelling question this fragment should
    not settle alone. Recorded here so the gap is visible.
  bala_strength: >-
    No entity. balaṃ/balam have 69 token hits and would duplicate
    VG:CONCEPT:OJAS-MIGHT, which already carries the strength axis.
  khadiro: >-
    Alias rejected, entity kept. `khadiro` token-matches only AVS 20.131.14, which has no
    stored translation, so it could not be read. The alias discipline is that an alias
    that cannot be read is not written down, even when the entity it would join is sound.
