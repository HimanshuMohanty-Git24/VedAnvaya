    aliases_sa: [turvaśaṃ, turvaśam]
    aliases_en: []
    broader: [VG:CONCEPT:JANA-PEOPLE]
    related_devatas: []

  - concept_id: VG:CONCEPT:TRTSU-TRIBE
    preferred_label_sa: tṛtsu
    preferred_label_en: Trtsus
    node_type: TRIBE
    definition: >-
      The Tṛtsus, Sudās's people in the battle of ten kings, confined to RV 7.18 and 7.83.
    aliases_sa: [tṛtsavaḥ, tṛtsūnām, tṛtsubhiḥ]
    aliases_en: [trtsus]
    broader: [VG:CONCEPT:JANA-PEOPLE]
    related_devatas: []

  # -------------------------------------------------------------------------
  # Named rites
  #
  # Two, not seven. rājasūya, vājapeya and agniṣṭoma occur once or twice each and all three
  # in one verse, AVS 11.7.7; darśapūrṇamāsa, sattra, pravargya, puruṣamedha and agniṣṭoma
  # token-match nothing at all. The elaborate procedures those names carry are Brāhmaṇa and
  # Sūtra systematisation, and a node per name would import that systematisation into the
  # Saṃhitās on the strength of a list.
  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:AGNIHOTRA
    preferred_label_sa: agnihotra
    preferred_label_en: fire oblation
    node_type: RITUAL
    definition: >-
      The offering poured into the fire, named as such exactly once in the four Saṃhitās
      (AVS 11.7.9, beside faith, the vaṣaṭ-call and the vow).
    aliases_sa: [agnihotraṃ]
    aliases_en: []
    broader: [VG:CONCEPT:YAJNA-SACRIFICE]
    related_devatas: [VG:DEVATA:AGNIH]

  - concept_id: VG:CONCEPT:DIKSA-CONSECRATION
    preferred_label_sa: dīkṣā
    preferred_label_en: consecration
    node_type: RITUAL
    definition: >-
      The consecration that makes a man fit to sacrifice, treated in the Atharvaveda as a
      power in its own right and in VS 19.30 as what a vow earns.
    aliases_sa: [dīkṣā, dīkṣām, dīkṣayā]
    aliases_en: []
    broader: []
    related_devatas: []

  # -------------------------------------------------------------------------
  # Priestly offices
  #
  # RITUAL_ROLE, not CONCEPT, because PERFORMED_BY may only point at a RitualRole.
  # VG:CONCEPT:HOTR-PRIEST already exists as the generic "priest" and already claims hotā,
  # hotāram, ṛtvijam and the principal adhvaryu forms; nothing here re-claims a string it
  # holds. There is deliberately no udgātar node: udgātā and udgātāraḥ match nothing in any
  # of the four Saṃhitās.
  # -------------------------------------------------------------------------

  - concept_id: VG:CONCEPT:ADHVARYU-PRIEST
    preferred_label_sa: adhvaryu
    preferred_label_en: adhvaryu
    node_type: RITUAL_ROLE
    definition: >-
      The officiant who does the physical work of the rite -- pressing, pouring, handling
      the vessels -- addressed in the plural as the men whose hands carry the offering.
    # adhvaryuḥ, adhvaryavaḥ and adhvaryo moved here from VG:CONCEPT:HOTR-PRIEST in
    # V3.1, where they sat inside the hotar's portmanteau alias list and contributed
    # 14 mention edges to the wrong office (adhvaryo 9, adhvaryavaḥ 4, adhvaryuḥ 1).
    # rituals_v3.yaml's PERFORMED_BY note asked for this split at the same time as the
    # hotar retype and not later: retyping without splitting produces a RitualRole that
    # answers "which rites does the adhvaryu officiate at" twice, differently. No folded
    # surface collides -- this node held none of the three. QUESTION_UNLOCKED: 90
    aliases_sa: [adhvaryavo, adhvaryubhiḥ, adhvaryuḥ, adhvaryavaḥ, adhvaryo]
    aliases_en: [adhvaryu, adhvaryus]
    broader: [VG:CONCEPT:HOTR-PRIEST]
    related_devatas: []

  - concept_id: VG:CONCEPT:BRAHMAN-PRIEST
    preferred_label_sa: brahman
    preferred_label_en: brahman priest
    node_type: RITUAL_ROLE
    definition: >-
      The brahman as a person: the priest who holds the formulation, and the class of men
      who do. NOT the formulation itself, which is
      VG:CONCEPT:BRAHMAN-FORMULATION.
    aliases_sa: [brahmā, brāhmaṇam, brāhmaṇāḥ, brāhmaṇasya]
    aliases_en: [brahmans]
    broader: [VG:CONCEPT:HOTR-PRIEST]
    related_devatas: [VG:DEVATA:BRAHMA]

  - concept_id: VG:CONCEPT:PUROHITA-CHAPLAIN
    preferred_label_sa: purohita
    preferred_label_en: household priest
    node_type: RITUAL_ROLE
    definition: >-
      The priest "placed in front" of a household or a king, an office the corpus attributes
      to men and to Agni in the same words.
    aliases_sa: [purohitaḥ, purohitam, purohita]
    aliases_en: [household-priest, house-priest]
    broader: [VG:CONCEPT:HOTR-PRIEST]
    related_devatas: []

  - concept_id: VG:CONCEPT:YAJAMANA-SACRIFICER
    preferred_label_sa: yajamāna
    preferred_label_en: sacrificer
    node_type: RITUAL_ROLE
    definition: >-
      The man on whose behalf and at whose cost the rite is performed: not an officiant,
      and the party most of the corpus's requests are made for.
    aliases_sa: [yajamānaḥ, yajamānam, yajamānasya, yajamānāya]
    aliases_en: [sacrificer]
    broader: []
    related_devatas: [VG:DEVATA:YAJAMANAH, VG:DEVATA:YAJAMANAPATNI]

  - concept_id: VG:CONCEPT:BRAHMACARIN-STUDENT
