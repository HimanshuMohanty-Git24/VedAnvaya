    aliases_sa: [yadum, yadave]
    aliases_en: [yadu, yadus]
    broader: [VG:CONCEPT:JANA-PEOPLE]
    related_devatas: []

  - concept_id: VG:CONCEPT:TURVASA-TRIBE
    preferred_label_sa: turvaśa
    preferred_label_en: Turvasha
    node_type: TRIBE
    definition: >-
      The Turvaśas, the Yadus' constant pair; the one tribe name of this set that the
