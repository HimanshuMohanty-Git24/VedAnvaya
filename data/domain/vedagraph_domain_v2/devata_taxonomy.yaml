version: vedagraph-devata-taxonomy-v1

# Devata display and classification overlay.
#
# This file is an OVERLAY on data/registry/devatas.yaml. It adds nothing to
# identity: every entity_key here is copied byte for byte from that registry,
# which states that entity_key is pinned identity and must not be recomputed.
# The registry is generated from commit-pinned Anukramani artifacts and is not
# edited by this work.
#
# ---------------------------------------------------------------------------
# TWO KINDS OF CLAIM, KEPT APART
# ---------------------------------------------------------------------------
#
# `structure` is SOURCE-SETTLED. It records what the label itself already
# decides, mostly by Sanskrit morphology, and a reviewer can check it without
# knowing any Vedic religion:
#
#   INDIVIDUAL     a single named deity or single deified thing
#   PAIR           a dual: endings -au / -i (asvinau, mitravarunau, dampati)
#   GROUP          a plural collective addressed as one devata (marutah,
#                  adityah, gravanah). Objects count; humans do not - see below
#   PATRON_PRAISE  a danastuti, or a label naming a patron and his gift
#   ABSTRACT       a noun, act, event or phrase rather than a being
#                  (jnanam, mrtyuh, sapatnaghnarupo arthah, bhavavrttam)
#   HUMAN          a named human rishi, king or patron standing as addressee,
#                  singular or plural. HUMAN takes precedence over GROUP: a
#                  human collective is still human (vasisthaputrah, kesinah)
#   UNSPECIFIED    the label genuinely does not settle it. Used twice in this
#                  file, both times because the form is ambiguous in number
#
# `axes` are INTERPRETIVE. A deity holds several at once, which is the whole
# point of replacing the old single devata_subtype: Agni no longer has to be
# either a god or a fire or a ritual medium, he is FIRE_MEDIUM and PRIESTLY and
# TERRESTRIAL together. Every axis assignment is a reading of the text and is
# defended in that entry's curation_note.
#
# `axes: [UNSPECIFIED]` is a POSITIVE STATEMENT, not a gap. It means: this
# entity was examined and no axis in the closed vocabulary applies to it. A
# justified UNSPECIFIED is better than invented taxonomy, so it is used freely
# and always with a reason. Four recurring reasons are named in the notes:
#
#   * deified animals - the vocabulary has no term for them
#   * implements of war from the weapons hymn - RITUAL_OBJECT means an
#     implement of the sacrifice, and a bow is not one
#   * charm-purpose labels - the slot names the act, not an agent with a domain
#   * lunar and generally celestial bodies - there is no lunar axis, and both
#     SOLAR and ATMOSPHERIC would be wrong
#
# `confidence` grades the AXES only, never the structure. On an
# `axes: [UNSPECIFIED]` entry, HIGH means confident that no axis applies.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE REFUSES TO DO
# ---------------------------------------------------------------------------
#
# * No post-Vedic identifications. Rudra is not given Siva's attributes, Yama
#   is not given an underworld, Ka is not identified with Prajapati, and Visnu
#   is not given Puranic sovereignty. Each refusal is stated in its entry.
# * No decomposition is invented. `composed_of` is copied only from
#   data/registry/devata_components.yaml rows with review_status ACCEPTED.
#   Where that file says NEEDS_REVIEW or REJECTED, or is silent, composed_of is
#   empty and the note says which of those it is.
# * No alias that matches nothing. Every alias listed was probed with
#   scripts/probe_domain_aliases.py against all four Vedas. Forms with zero
#   token hits were dropped even when they are the conventional stem - this
#   removed `agni`, `brhaspati`, `vayu`, `aditi`, `rbhu`, `indu`, `visvedevah`,
#   `aranyani`, `satakratu`, `ganapati`, `samraj`, `vivasvat` and `yami`. Where
#   a deity ends up with no safe alias, aliases_iast is empty and the note says
#   why.
# * `member_of` uses two DeityGroup keys minted by this overlay,
#   VG:DEITYGROUP:ADITYAH and VG:DEITYGROUP:APRIDEVATAH. They have no registry
#   entities behind them yet and are assigned sparingly.
#
# Entries are in registry order so the two files can be read side by side.

