  node_type: ACTION
  definition: 'The third of the day''s three soma pressings, and the one the corpus numbers most often:
    "tṛtīye savane" at RV 3.28.5, "idaṃ tṛtīyaṃ savanaṃ kavīnām" at AVS 6.47.3, "tṛtīye savana ṛbhūṇām"
    at AVS 9.1.13, and the Rbhus'' third libation at RV 4.34.4, RV 4.35.9 and RV 8.57.1. All six were
    read and all six are this act -- and none of them is reachable, because the third pressing is the
    only one of the three the corpus never writes as one word. The morning has prātaḥsāva and the midday
    has mādhyaṃdina; the third has only the phrase tṛtīya + savana, and SANDHI_MATCH_VEDAS restricts the
    production substring pass to the Samaveda. The one alias is therefore VS 19.26''s single token, `tṛtīyamāptaṃṃ`,
    whose doubled anusvara is an artefact of this corpus''s VSM transliteration and is recorded as such
    in the report: it is brittle by construction and will need replacing if that transliteration is normalised.'
