- concept_id: VG:CONCEPT:ASAT-NONEXISTENCE
  preferred_label_sa: asat
  preferred_label_en: non-existence
  node_type: PHILOSOPHICAL_CONCEPT
  definition: 'Non-existence: the asat of "there was neither non-existence nor existence then" (RV 10.129.1).
    Unlike sat it is already a noun in its own right -- the Rigvedic annotation lemmatises it asant-,
    separately from the root -- and existence is twice said to have sprung from it (RV 10.72.2-3). In
    the Atharvaveda it is one pole of a paired cosmological formula (AVS 4.1.1, 10.7.10, 17.1.19). Not
    filed under VG:CONCEPT:SAT-EXISTENCE: non-existence is not a kind of existence.'
