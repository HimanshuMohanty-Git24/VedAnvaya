  definition: 'The piling up of Agni out of bricks, named by the Samhita as an act and not by a rite-name:
    Agni is addressed as `cīyamānaḥ`, "while thou art being piled" (VS 13.41, VS 13.47), the sacrificer
    as `cinvānaḥ`, "piling" (VS 13.47 and four parallels), and the bricks are addressed as bricks and
    called milch-cows at VS 17.2. The name `agnicayana` is absent from all four Samhitas and is not used
    here. `cinvānas` is read evidence but not an alias: it occurs only across a token boundary (`cinvānas
    tanvo`), and SANDHI_MATCH_VEDAS restricts the production substring pass to the Samaveda, so the string
