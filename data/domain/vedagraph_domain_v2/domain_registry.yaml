ambiguous_aliases:
- alias: madhu
  kind: sa
  reason: Claimed by MADHU-HONEY as the substance and by SOMA-DRINK, whose juice is called madhu throughout
    Mandala 9. 178 passages, and no deterministic rule separates the readings. Both concepts keep their
    unambiguous forms; neither gets this one.
- alias: sweet
  kind: en
  reason: Griffith's rendering of madhu, madhumat and svadu alike, used for soma, milk, speech and rain.
    Wanted by MADHU-HONEY and SOMA-DRINK; given to neither.
- alias: strength
  kind: en
  reason: 955 passages. Griffith uses it for ojas, savas, sahas, bala, tavas AND vaja, which is exactly
    the boundary between OJAS-MIGHT and VAJA-PRIZE. Retained here rather than assigned, because assigning
    it would put ~750 Rigvedic passages on one side of a distinction the translation does not make.
