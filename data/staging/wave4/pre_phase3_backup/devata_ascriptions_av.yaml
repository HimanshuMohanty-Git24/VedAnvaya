# AV DEVATA registry, generated by
# scripts/build_anukramani_knowledge_layer.py from the corpus's own
# traditional index (WIKISOURCE_WHITNEY_AV.BRHATSARVANUKRAMANI).
#
# DELIBERATELY A SEPARATE NAMESPACE (AV_WHITNEY_ANUKRAMANI). Values are the index's own
# strings and are not resolved against data/registry/. Measured: only 8 of 228
# Yajurvedic rsi names equal a Rigvedic registry label, because that registry
# stores Sarvanukramani patronymic compounds where these indices give bare
# names. rv_registry_name_match records where a name coincides; it asserts
# nothing about whether the two indices mean the same person.
#
# preferred_label is the source string with a trailing visarga folded and
# nothing else changed; source_variants lists every spelling folded into it.
#
# THESE ARE NOT DEITY NAMES. Whitney prints adjectival ascription
# descriptors -- `agneyam` is 'belonging to Agni', `mantroktadevatyam` is
# 'having the deity named in the mantra'. They are typed
# DEVATA_ASCRIPTION and must never be unioned with the Rigvedic deity set:
# doing so would add spurious gods and make a deity census meaningless.
#
# `rejections` is part of the contract, not commentary. Whitney's bracket
# interleaves the ascription with the rest of the printed apparatus -- verse
# counts, verse-count notes, pada addresses, metre names -- in one
# period-delimited run with no field markers, and every value listed there
# once stood in this file as a product-visible ascription node. The graph
# asserted that the deity-ascription of AVS 18.4 was `ekonanavati`, the
# number eighty-nine. They are recorded rather than silently dropped so that
# a later pass cannot re-add them believing they were never seen.
#
# `ocr_variants_merged` on an entity lists the scan spellings folded into
# its printed one. Only two-test merges are made: the variant is not a
# Sanskrit word AND the target is independently printed elsewhere in this
# same index. See AV_ASCRIPTION_OCR_SIBLINGS in the builder for the
# near-pairs that are deliberately NOT merged.
