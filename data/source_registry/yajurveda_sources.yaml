    rights_status: PUBLIC_DOMAIN
    recension_evidence: >-
      archive.org's own metadata states "Translation of: Vājasaneyīsaṃhitā", and Griffith
      translated the Madhyandina text. Recension is CORROBORATED, not decisive: the front
      matter was not read, because only OCR text is available.
    machine_readability: >-
      OCR ONLY. The sole text-bearing derivative is
      textswhiteyajur00grifgoog_djvu.txt, 862,258 bytes, sha1
      7fd4f74e7edade39e9851d0c232a2a28b50e07e5. There is no structured transcription.
    action: >-
      NOT INGESTED as canonical translation records in this pilot. Reason: OCR output is
      not corpus data, and aligning OCR verse numbers to 1,975 mantras cannot be verified
      without human review. Recorded here so the sources.yaml placeholder can be
      resolved to a concrete item and rights value.
    alternatives_checked:
      - "en.wikisource.org: NO transcription of Griffith's White Yajurveda exists. Searches for 'White Yajurveda', 'Yajurveda', 'Vajasaneyi' return only secondary literature. WARNING: en.wikisource DOES have 'The Veda of the Black Yajus School' (Keith, Taittiriya) - that is KRISHNA Yajurveda and MUST NOT be used for VG:WORK:YV:VSM."
      - "sacred-texts.com/hin/wyv/: hosts Griffith's White Yajurveda in structured HTML but is behind Cloudflare bot interstitial - HTTP 403 on index.htm and wyvbk01.htm. Not machine-retrievable."
      - "archive.org textsofwhiteyaju0000unse (1957 E. J. Lazarus): only ACS/LCP ENCRYPTED PDF, i.e. lending-restricted. Not usable."

  - candidate_id: WEBER_VS_EDITION_SCAN
    verdict: REFERENCE_ONLY
    archive_org_identifier: india.history.resource.52798
    title: "The White Yajurveda, in Three Parts"
    creator: "Weber, Albrecht (Ed.)"
    date: 1855
    publisher: "Ferd. Dummler's Verlagsbuchhandlung, William and Norgate (Berlin)"
    rights_status: PUBLIC_DOMAIN
    note: >-
      The printed edition underlying the TITUS text. Scan with DjVuTXT OCR. Valuable as a
      human-verifiable reference for adjudicating counts and readings; NOT ingested,
      because OCR of accented Devanagari/romanised Sanskrit is not corpus-grade.
      Records the edition date as 1855 in this item, against TITUS's stated 1849 and the
      commonly cited 1852 - three different dates for Weber's VS. Recorded as data.

  - candidate_id: VEDAWEB
    verdict: OUT_OF_SCOPE_NO_YAJURVEDA
    url: https://vedaweb.uni-koeln.de/
    finding: >-
      VedaWeb serves Rigveda (and Atharvaveda/Saunaka) only. It has no Yajurveda corpus,
      so the parallel-source pattern used for the Rigveda pilot has no VedaWeb analogue
      here. This is why the Yajurveda pilot's "parallel" version is a second text layer
      of the same artifact rather than a second repository.

  - candidate_id: VEDIC_HERITAGE_PORTAL
    verdict: REFERENCE_ONLY_PENDING_AGENT_E
    url: https://vedicheritage.gov.in/samhitas/yajurveda/vajasneyi-madhyandina-samhita/
    finding: >-
      IGNCA / Government of India portal with a Madhyandina VS section and a large audio
      archive. Default posture is PERMISSION_REQUIRED and therefore reference-only, per
      Agent E's standing instruction. Not mirrored. See the audio inventory sent to
      Agent E separately.
    rights_status: PERMISSION_REQUIRED
    storage_policy: EXTERNAL_REFERENCE

hindi_translation:
  verdict: NOT_AVAILABLE_UNDER_A_USABLE_LICENCE
  finding: >-
    No machine-readable Hindi translation of the Madhyandina VS was found under a licence
    permitting ingestion. The well-known Hindi renderings (Satavalekar; Dayananda
    Sarasvati's Yajurveda Bhasya; Devi Chand) are 20th-century works whose Hindi
    translation layers are frequently still in copyright or of unclear status, and none
    was found as structured per-mantra data. Recorded as a gap, not filled.

# ---------------------------------------------------------------------------
# COUNT RECONCILIATION (computed, not quoted from memory)
# ---------------------------------------------------------------------------

count_reconciliation:
  method: >-
    Counts are COMPUTED from the selected source records by the adapter over all 40
    snapshotted adhyaya pages, never hard-coded. Per adhyaya the count is the number of
    distinct mantra numbers the source itself labels, taken as the union of the two text
    layers, because each layer is individually incomplete in different places.
  computed:
    adhyaya_count: 40
    total_mantras: 1975
    sum_of_accented_layer_maxima: 1973
    sum_of_unaccented_layer_maxima: 1844
    note: >-
      The two layers disagree. The unaccented samhita block is badly truncated in
      adhyaya 3 (43 of 63), adhyaya 7 (15 of 48) and adhyaya 19 (17 of 95), and has
      single-mantra gaps in adhyayas 4, 10, 12, 13, 18 and 39. The accented layer is
      short by one in adhyaya 6 (36 of 37) and adhyaya 23 (64 of 65). Their UNION is
      exactly 1975 with no gaps. The layers were not merged into a single text; only the
      structural inventory is unioned.
  external_cross_checks:
    - source: TITUS (reference-only)
      total: 1974
      divergence: "VS 2.32 absent from TITUS; present on Wikisource. TITUS therefore yields 1974."
      verdict: "Divergence recorded as data. No source was edited to agree with another."
    - source: Vedic Heritage Portal (reference-only)
      total: 1974
      divergence: "adhyaya 23 = 64 there, against 65 on Wikisource, TITUS and Griffith."
    - source: "TITUS adhyaya 1 and 40 endpoint check"
      result: "adhyaya 1 ends at verse 31 and adhyaya 40 at verse 17 - both match the computed counts."
  unresolved:
    - >-
      One secondary source cites the Madhyandina VS as 1951 kandikas in 303 anuvakas.
      That is an ANUVAKA-based count, not a mantra count, and is recorded as a different
      counting system rather than as a contradiction. Not reconciled; flagged.

# ---------------------------------------------------------------------------
# NAMED BLOCKERS (not worked around)
# ---------------------------------------------------------------------------

blockers:
  - id: NO_LAWFUL_PADAPATHA
    statement: >-
      There is NO lawfully reusable machine-readable padapatha for Sukla YV Madhyandina.
      The only scholarly padapatha (Yudhisthira Mimamsaka) is a 1996 Ramlal Kapur Trust
      edition, in copyright in India until 2081; an archive.org duplicate carries an
      uploader-asserted CC0 that the uploader had no standing to grant. Sanskrit
      Wikisource has a padapatha only inside Dayananda's bhasya, covering roughly 290 of
      1975 mantras (adhyayas 1-5, 29, 30). Consequence: the Rigveda's padapatha-backed
      lexical layer has no Yajurveda equivalent.
  - id: NO_STRUCTURED_ENGLISH_TRANSLATION
    statement: >-
      Griffith 1899 is public domain but exists only as OCR. en.wikisource has no
      transcription; sacred-texts.com is Cloudflare-blocked. No translation records were
      created rather than creating unverifiable ones.
  - id: SANSKRIT_LIBRARY_TEI_UNPUBLISHED
    statement: >-
      The TEI edition that would top the format ranking is catalogued but has no public
      retrieval URL, and would impose CC BY-NC-SA.
  - id: DEVANAGARI_COMPARISON_FOLDING_ABSENT
    statement: >-
      normalize/unicode.py TRANSCRIPTION_EQUIVALENCES folds only Latin IAST/ISO-15919
      variants. There is no Devanagari-side folding, so the three Unicode spellings of
      anusvara/anunasika used by these sources (U+A8F3; U+1CEA+U+0902+U+1CED; U+0902) and
      the source's 1,538 ASCII colons standing for visarga do not fold. Every
      Devanagari-vs-Devanagari comparison therefore falls through to UNCLASSIFIED.
      Reported to Agent F, who owns normalize/ and compare/. NOT patched here.
