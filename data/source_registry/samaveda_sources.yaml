# ---------------------------------------------------------------------------
# TRADITIONAL METADATA
# ---------------------------------------------------------------------------
traditional_metadata:
  status: PARTIAL_AND_INSUFFICIENT
  do_not_infer: >-
    Rigvedic Anukramani rules must NOT be transferred to Samaveda, and missing rishi /
    chandas / devata values must NOT be filled in by an LLM. Samaveda verses are largely
    borrowed from the Rigveda, which makes LLM-guessed attribution especially plausible
    and especially wrong.
  sources_found:
    - source_id: GRETIL_SV_KAUTHUMA_TEI
      form: >-
        Inline plain-text triads in the Uttararcika of the shape
        "asitah kasyapo devalo va. gayatri. pavamanah somah." = rishi. chandas. devata.
      machine_readable: PARTIALLY
      coverage_computed: >-
        Only 31 of 395 Uttararcika paragraphs carry any non-verse head line, and once
        prapathaka/ardha headings are excluded roughly 24 triads remain. The Purvarcika
        carries NO such triads at all. Field separators are inconsistent, alternating
        between "." and ",". This is far too sparse to be a metadata source.
      rights: PERMISSION_REQUIRED    # inherits the artifact's contested rights
    - source_id: WIKISOURCE_SA_SV_KAU
      form: >-
        Plain-text triads such as "vasisthah . tristup . pavamanah somah", plus gana
        performance metadata of the form "di 8 . pa 6 . ma 7".
      machine_readable: PARTIALLY
      rights: CC_BY_SA
      note: >-
        Better covered than GRETIL and rights-clean, but still plain text inside prose,
        with no controlled vocabulary and no scope markers.
    - source_id: VHP_SAMAVEDA
      form: Devanagari structural headings only (kanda, adhyaya, prapathaka, ardha).
      machine_readable: NO
      rights: PERMISSION_REQUIRED
      note: >-
        VHP's Kauthuma pages use "adhyaya" as a division name alongside prapathaka/ardha.
        This is where the earlier works.yaml guess of [Arcika, Prapathaka, Ardha, Adhyaya,
        Khanda, Mantra] came from. Adhyaya is a real Kauthuma division but it is NOT the
        fourth level of the selected edition's reference system, which is dasati. Adhyaya
        therefore belongs in Citation, not in the identity tree.
  safe_resolution_method: >-
    1. Extract the triads verbatim from the two rights-permitting sources into
       CandidateMetadataAssertion records with parse_status and no canonical entity id.
    2. Attach each to the dasati or verse the source itself places it against; never widen
       a triad to a scope the source did not state.
    3. Require human review before any promotion to TraditionalMetadataAssertion, because
       Samaveda scope conventions are not the Rigveda's and no verified Samaveda
       Anukramani has been located.
    4. Where a Samaveda verse is a known Rigveda borrowing, its Rigvedic rishi/devata/
       chandas may be CITED as a cross-reference but must never be asserted as the
       Samaveda verse's own traditional metadata. Sanskrit Wikisource supplies explicit
       Rigveda cross-references on 363 pages, which makes this cross-reference tractable
       without guessing.

