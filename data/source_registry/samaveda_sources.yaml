# ---------------------------------------------------------------------------
# SELECTION VERDICT
# ---------------------------------------------------------------------------
selection:
  recommended_primary_sanskrit: WIKISOURCE_SA_SV_KAU
  recommended_primary_rationale: >-
    Only candidate that is simultaneously rights-clean for redistribution (CC BY-SA 4.0),
    in Devanagari, carries genuine Samavedic notation on the gana pages, covers the gana
    collections at all, and is textually correct where GRETIL is provably corrupt. Its
    weakness is authority tier: it is a community transcription with no single named
    printed edition, so it needs a scholarly collation before promotion to canonical.
  pilot_primary_sanskrit: GRETIL_SV_KAUTHUMA_TEI
  pilot_primary_rationale: >-
    Used as the pilot's primary only because it is a single self-describing file that
    declares its own reference system, which is what made the hierarchy adjudication
    possible. It is NOT recommended as the canonical primary: its rights are contested,
    its printed edition is unidentified, and cross-source comparison proved its text
    defective. See docs/reports/SAMAVEDA_SOURCE_RESEARCH.md.
  parallel_sanskrit: WIKISOURCE_SA_SV_KAU
  citation_authority: TITUS_SV_KAUTHUMA          # reference only, never copied
  collation_check: SANSKRITDOCUMENTS_SV_KAUTHUMA # research only, never redistributed
  english_translation: SACRED_TEXTS_GRIFFITH_SV
  hindi_translation: null
  audio_reference: VHP_SAMAVEDA_AUDIO
  # Corroboration strength for the adjudicated hierarchy, stated honestly.
  # Three of the digital Kauthuma texts are ONE text: the Pandey 1998/99 e-text,
  # re-published by GRETIL, sanskritdocuments and TITUS. Agreement among them is the same
  # defect repeated, not corroboration.
  witness_tally:
    independent_textual_witnesses:
      count: 2
      items:
        - WIKISOURCE_SA_SV_KAU  # independence graded NOT_A_VERBATIM_COPY, not PROVEN - see below
        - SACRED_TEXTS_GRIFFITH_SV  # Griffith 1895 via Benfey; predates Pandey by a century
    independent_addressing_evidence:
      count: 1
      items: [TITUS_SV_KAUTHUMA]  # Gippert's addressing over Pandey's text
    same_text_republications:
      count: 3
      items: [GRETIL_SV_KAUTHUMA_TEI, SANSKRITDOCUMENTS_SV_KAUTHUMA, TITUS_SV_KAUTHUMA]
    conclusion: >-
      The hierarchy conclusion is unchanged and the level names agree across every witness,
      but the corroboration is WEAKER than an earlier draft claimed. That draft said "four
      independent witnesses"; the true figure is two independent textual witnesses plus one
      independent addressing scheme.
    independence_grade_correction: >-
      DOWNGRADED 2026-09-07 by SAMAVEDA_CANONICAL_IDENTITY_FINAL_CLOSURE, on the sole
      rights authority's finding. The Wikisource independence claim was recorded across this
      registry as PROVEN. Its true grade is NOT_A_VERBATIM_COPY.
      The inference "a text cannot inherit from a source it does not share an error with" is
      NOT VALID AS A UNIVERSAL. It excludes only verbatim UNCORRECTED inheritance. It does
      not exclude copy-then-correct or copy-then-collate, both of which are ordinary wiki
      practice and both of which leave exactly this signature - and the defect it turns on
      (verse 2 reduced to a bare fragment while verse 1 runs long) is CONSPICUOUS, i.e.
      precisely the kind of error a copyist notices and repairs. The claim rests on ONE
      locus, running verses 1-2; zero further loci are cited anywhere.
      The differing numbering system (running whole-samhita vs dasati-local) is BETTER
      evidence than the pada correction, because a wholesale renumbering is harder to
      explain as light-touch correction.
      A SECOND, PROCEDURAL DEFECT IN THE SAME CLAIM: the published comparison in
      docs/reports/SAMAVEDA_SOURCE_RESEARCH.md is IAST-versus-IAST, while this artifact is
      Devanagari (language sa-Deva). The Wikisource side therefore passed through
      AGENT-PERFORMED TRANSLITERATION of a passage the model holds memorised in the target
      script - a RIGHTS-13-class channel that RIGHTS-13 does not currently name, because
      cross-script rendering FEELS mechanical and is in fact generative. The pinned
      Devanagari bytes make this checkable, so it is a VERIFICATION GAP, not a demonstrated
      breach.
      SCOPE OF THE DOWNGRADE: independence is NOT load-bearing for an identity freeze, since
      a structural address scheme is derived from no lineage's expression. It IS load-bearing
      for TEXT REDISTRIBUTION. Consequence: re-verify at CODEPOINT LEVEL against the pinned
      Devanagari, at more than two loci, BEFORE any bulk text release.
      Honest restatement to use in future records: "not a verbatim copy of the Pandey text at
      the one locus tested, and using a different numbering system; full independence of
      descent is unestablished."
  blocking_issues:
    - No source found offers an ACCENTED machine-readable arcika text. The one advertised
      (sanskritdocuments sv-kauthuma-saswara.pdf/.itx) is a dead 404.
    - No rights-clear machine-readable Hindi translation was found.
    - No single source combines an identified printed edition with redistribution rights.

