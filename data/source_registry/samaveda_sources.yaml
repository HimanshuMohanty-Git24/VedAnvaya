# ---------------------------------------------------------------------------
# GANA (SONG) COLLECTIONS -- the biggest coverage gap
# ---------------------------------------------------------------------------
gana_coverage:
  finding: >-
    A Samaveda without the gana is musically incomplete, and most text candidates omit it
    entirely. GRETIL has NO gana anywhere (string counts in the body: "gana" 0,
    "gramageya" 0, "aranyageya" 0, "uhya" 0; the few "uha"/"stobha" hits are ordinary
    word-forms inside mantras). sanskritdocuments has the gana only as four PDFs.
    Sanskrit Wikisource is the ONLY source found that carries the gana as reusable text.
  wikisource_gana_pages:
    gramageya: 190
    aranyakageya: 86
    uhagana: 362
    uhyagana: 87
  identity_note: >-
    Gana collections are NOT part of the arcika citation and must NOT be given a slot in
    sv_mantra_identity. If ingested they need their own work_id. Agent A has agreed this.
  pdf_only_elsewhere:
    - gramageya.pdf        # 1198 ganas / 579 pp
    - aranyakaganam.pdf    # 296 / 177
    - uhaganam.pdf         # 936 / 515
    - uhya-rahasyaganam.pdf # 209 / 148

# ---------------------------------------------------------------------------
# NEGATIVE FINDINGS  (recorded so they are not re-researched)
# ---------------------------------------------------------------------------
negative_findings:
  - VedaWeb hosts no Samaveda at all (verified against its live /api/texts).
  - English Wikisource has no Samaveda verse text (preface + red links only).
  - No Samaveda TEI or JSON corpus exists on GitHub (repo search for samaveda+TEI,
    samaveda+json and kauthuma all return total_count 0).
  - Zenodo could NOT be verified; its API returned HTTP 403 due to traffic restriction.
    Treat as UNCONFIRMED, not as a verified negative.
  - vedicreserve (Maharishi) has a single 823 KB PDF and no machine-readable text.
  - GRETIL has no gana, no Arseya-Brahmana, no Shadvimsa, no Devatadhyaya, no
    Samhitopanishad, no Samavidhana, no Arseyakalpa, no Latyayana or Drahyayana
    Srautasutra, no Pushpasutra, no Nidanasutra and no Samatantra. Its Vamsa-Brahmana
    and Jaiminiya-Brahmana entries say "Converted file(s) not available at present".
  - archive.org DLI scans of Satyavrata Samasrami's Bibliotheca Indica edition
    (in.ernet.dli.2015.487112, .514035, .487160, .487161, .487322) have NO licenseurl,
    NO rights and NO possible-copyright-status field. Rights are unstated; CC0 must not
    be assumed. Note also that Griffith's preface identifies Samasrami's edition as
    RANAYANIYA, not Kauthuma.
  - >-
      archive.org title metadata is unreliable. "zkbn_vajasaneya-samhita-of-sama-veda" is
      actually Yajurveda, and "unaz_sama-veda_202406" contains no text files at all.
