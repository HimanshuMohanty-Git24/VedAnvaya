    edition: NO_SINGLE_NAMED_EDITION
    accent_preservation: PARTIAL_AND_SECTION_DEPENDENT
    accent_evidence: >-
      The gana/notation pages carry genuine samana svara notation as Devanagari Extended
      combining digits U+A8E1-U+A8E5, plus U+A8EF, U+A8F3, and Vedic Extensions U+1CD0
      KARSHANA (51 pages), U+1CD2 PRENKHA (38), U+1CF2 ARDHAVISARGA (78). Classical
      udatta/anudatta U+0951/U+0952 are rare (2-3 pages), which is expected because
      Samaveda marks tone numerically rather than tonally. The plain arcika dasati pages
      sampled for the pilot carried NO notation, so accent coverage is uneven and must be
      verified per page, not assumed.
    structure: >-
      Structure is encoded in the page title path, not the body. Verse text sits inside
      <poem> tags with verse terminators of the form "|| N ||" in Devanagari numerals.
    structure_corroboration: >-
      Independently corroborates the GRETIL hierarchy on two points. (1) There is no
      ardha level: a prapathaka contains dasati 1..10 directly, consistent with GRETIL
      numbering dasati continuously across its two ardhas, so ardha is derivable. (2) The
      Aranya arcika has no prapathaka. It DIVERGES on one point: Wikisource nests Aranya
      inside Purvarcika as 1.2.x, where GRETIL makes it a sibling arcika 2. That is a real
      edition-order divergence, recorded not reconciled.
    verse_numbering_system: RUNNING_WHOLE_SAMHITA
    verse_numbering_note: >-
      Verse labels are the running whole-Samhita number (1..1875), NOT a dasati-local
      index. GRETIL uses a dasati-local index. Aligning the two by printed verse position
      is therefore wrong and produced 19 spurious MISSING rows out of 29 before the join
      was moved onto the running number both sources independently supply.
