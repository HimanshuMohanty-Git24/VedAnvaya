schema_version: 1.0.0

# ===========================================================================
# FOUR-VEDA MASTER SOURCE MATRIX
#
# Owner: Agent E (rights / provenance / source archivist). SINGLE WRITER.
# Compiled: 2026-09-07
#
# Human-readable companion : docs/FOUR_VEDA_SOURCE_ADJUDICATION.md
# Rights decision table    : docs/FOUR_VEDA_RIGHTS_MATRIX.md
# Audio inventory          : docs/FOUR_VEDA_AUDIO_SOURCE_INVENTORY.md
# Snapshot provenance      : docs/reports/FOUR_VEDA_SNAPSHOT_PROVENANCE.md
#
# GOVERNING RULE (data/registry/rights.yaml, RIGHTS-1):
#   Rights attach to each source file or asset, not merely to a host website.
#
# Consequences enforced throughout this file:
#   * artifact_license and site_license are ALWAYS separate fields.
#     `license_conflict` is set whenever they diverge.
#   * A source that is rights-clear for one Veda is NOT thereby clear for
#     another. GRETIL is the worked example: its Rigveda file is CC BY-NC-SA
#     4.0, its Samaveda file is internally self-contradictory, and its
#     Atharvaveda file self-declares REFERENCE PURPOSES ONLY.
#   * Where rights are genuinely unresolved the status is UNKNOWN and the
#     operational posture is no-redistribution. No permissive licence is
#     guessed in order to unblock ingestion.
#   * Audio is first-class data with its own rights, never inherited from the
#     text source.
#
# ROLE VOCABULARY (every Veda is assessed against every role):
#   primary_sanskrit        the canonical Sanskrit text to be ingested
#   parallel_sanskrit       an independent Sanskrit witness for comparison
#   english_translation
#   hindi_translation
#   traditional_metadata    rishi / devata / chandas / anukramani
#   audio
#   verification_reference  consulted for QA, never ingested
#
# SELECTION VOCABULARY:
#   SELECTED            adjudicated fit for its role
#   SELECTED_RESTRICTED selected, but with a posture narrower than ingestion
#   REJECTED            will not be used
#   DEFERRED            plausible, blocked on a named unresolved item
#   ABSENT              the source does not carry this Veda at all
#   GAP                 no candidate was found for this role
#
# FIELD NOTES:
#   coverage_exact   measured or source-stated scope. Where a count is a claim
#                    rather than a measurement, it is labelled as such.
#   redistribute / redistribute_derived / direct_link / mirror_local
#                    resolved from data/registry/rights.yaml
#                    operational_semantics for the recorded rights_status.
# ===========================================================================

compiled_by: Agent E
compiled_on: 2026-09-07
governing_policy: Rights attach to each source file or asset, not merely to a host website.

fragment_intake:
  # B/C/D write these; Agent E reads and consolidates.
  # ALL THREE ARRIVED, after an initial compile in which none were present.
  # Their contents forced material corrections, logged under `corrections_applied`.
  - path: data/source_registry/samaveda_sources.yaml
    owner: Agent B
    status: RECEIVED_AND_CONSOLIDATED
    note: >-
      Forced three corrections: (1) the selected Samaveda English translation
      contains NO VERSE TEXT; (2) the only complete Griffith Samaveda is the
      RANAYANIYA recension, not Kauthuma; (3) Sanskrit Wikisource is a
      textually PROVEN independent Kauthuma witness, which unblocked the
      primary-Sanskrit role. Also supplied the only mirrorable audio found
      anywhere in the survey.
  - path: data/source_registry/yajurveda_sources.yaml
    owner: Agent C
    status: RECEIVED_AND_CONSOLIDATED
    note: >-
      Forced a correction to an Agent E ERROR: TITUS is PERMISSION_REQUIRED,
      not RESEARCH_ONLY, because every TITUS text page carries a stricter
      per-page notice that Agent E had not read. Also identified the printed
      edition behind the Sanskrit Wikisource Yajurveda text, which Agent E had
      recorded as unidentified, and resolved the Griffith 1899 item.
  - path: data/source_registry/atharvaveda_sources.yaml
    owner: Agent D
    status: RECEIVED_AND_CONSOLIDATED
    note: >-
      Supplied computed AVS coverage, proved the Saunaka recension from
      per-verse locators rather than the filename, resolved the GRETIL
      "terms as for source file" pointer to the actual TITUS prohibition, and
      established that TITUS, GRETIL and VedaWeb's AVS Sanskrit layer are ONE
      licensing dependency rather than three sources.

# ---------------------------------------------------------------------------
# CORRECTIONS APPLIED AFTER THE FIRST COMPILE
#
# Recorded openly rather than quietly folded in. Per-artifact detail and
# verbatim evidence live in data/registry/source_artifacts.yaml.
# ---------------------------------------------------------------------------
corrections_applied:
  - id: CORR-1
    severity: AGENT_E_ERROR
    subject: TITUS, all three Vedas
    was: RESEARCH_ONLY
    now: PERMISSION_REQUIRED
    why: >-
      Agent E classified TITUS from its project-wide page at texte2.htm alone.
      EVERY TITUS Veda text page carries a stricter per-page notice: "Copyright
      TITUS Project, Frankfurt a/M, 2.11.2013. No parts of this document may be
      republished in any form without prior permission by the copyright
      holder." Found by Agent C, then independently verified by Agent E
      fetching vs001.htm, svk001.htm and avs001.htm. This is a failure of
      exactly the rule Agent E was enforcing on everyone else - RIGHTS-1 - and
      note the direction: here the SITE page was the more PERMISSIVE of the two,
      so relying on it was not merely incomplete but wrong in our favour.
  - id: CORR-2
    severity: COVERAGE_INVALIDATES_SELECTION
    subject: Samaveda english_translation
    was: SELECTED (Wikisource Griffith 1895)
    now: GAP
    why: >-
      The page is PREFACE ONLY - 5615 characters, 934 words, TextQuality 25%,
      33 chapter links of which zero resolve, and an allpages prefix query
      returns exactly one page. Verified independently by Agent E. Every RIGHTS
      check on this artifact passed; it is public domain and cleanly tagged.
      What no rights check catches is that there is nothing behind the banner.
      Compounding it, the only COMPLETE Griffith Samaveda (sacred-texts.com) is
      the RANAYANIYA recension - Griffith's own preface says "I have followed
      Benfey's text" and Benfey is Ranayaniya - so it cannot be aligned to a
      Kauthuma text without producing a silently wrong cross-recension
      alignment. Samaveda therefore has NO rights-clear, coverage-complete,
      recension-correct English translation.
  - id: CORR-3
    severity: BLOCKER_CLEARED
    subject: Samaveda primary_sanskrit
    was: DEFERRED, independence unverified
    now: SELECTED, with an edition-identity limitation
    why: >-
      Agent B proved Sanskrit Wikisource's independence from the Pandey lineage
      TEXTUALLY rather than by provenance argument: at running verses 1-2 GRETIL
      misplaces a pada between verses while Wikisource has both verses whole,
      and the two use different verse-numbering systems. A text cannot inherit
      from a source it does not share an error with. It also carries the GANA
      (725 pages), which the GRETIL text lacks entirely. The Samaveda problem is
      therefore NOT "no independent witness exists" - it is "no witness combines
      an identified printed edition WITH redistribution rights".
  - id: CORR-4
    severity: GAP_FILLED
    subject: Sukla Yajurveda edition identity
    was: edition UNIDENTIFIED
    now: >-
      Vasudeva Sarma Panasikara, 2nd edn, Nirnaya Sagara Press, Bombay,
      Saka 1850 = CE 1929, with Uvata's Mantrabhasya and Mahidhara's Vedadipa
    why: >-
      Agent E read the per-adhyaya headers, which carry empty year and notes
      fields. Agent C read the wiki's separate PREFACE page, which reproduces
      the printed title page verbatim. Edition identity may live on a sibling
      page rather than in the artifact header, so an empty header is not proof
      the edition is unknown - unlike the GRETIL Samaveda TEI, whose
      sourceDesc/bibl is affirmatively empty with no sibling page to rescue it.
  - id: CORR-5
    severity: VERDICT_REVERSED
    subject: audio, all four Vedas
    was: ZERO mirrorable assets
    now: 474 mirrorable files exist, for Samaveda only
    why: >-
      Wikimedia Commons holds 474 Ogg files of Kauthuma saman/gana recitation,
      licence-checked PER FILE via the Commons imageinfo API by Agent B: 458
      CC BY-SA 4.0, 16 CC0, 0 missing. These are also the FIRST AND ONLY CC0
      artifacts in the registry - the enum member requested from Agent A was
      unused until they arrived. Everything else across every other host
      remains REFERENCE_ONLY, PERMISSION_REQUIRED or UNKNOWN.
  - id: CORR-6
    severity: NEW_CONSTRAINT
    subject: VHP direct linking, affects ALL FOUR Vedas
    was: direct_link true
    now: direct_link CONTESTED
    why: >-
      Two live IGNCA pages contradict each other, both footer-dated 2026-08-27.
      Terms & Conditions: "We do not object to linking directly to the
      information that is hosted on this portal and no prior permission is
      required for the same." Hyper linking Policy: "Prior permission is
      required before hyperlinks are directed from any website/portal to this
      site." Independently found by Agents B, D and Agent E's own research.
      Consequence: for VHP even the LINK-ONLY fallback is not clean, which is
      unusual and affects every Veda because VHP is the verification source for
      all four. Framing is separately prohibited.
  - id: CORR-7
    severity: AGENT_E_ERROR
    subject: Atharvaveda english_translation, Kanda 20
    was: gap declared unclosable
    now: CLOSED via Griffith 1895-96
    why: >-
      Agent E found Kanda 20 untranslated in both VedaWeb and Wikisource and
      concluded the gap belonged to the digitised Whitney tradition, closable by
      no source switch. The error was scoping the search to ONE TRANSLATOR.
      Griffith 1895-96 is complete, covers book XX per-verse, and sits on the
      same Roth/Whitney numbering spine as our Sanskrit. Found by Agent D.
      Recorded defects: AVS 2.20-2.23 missing, some corrupted verse anchors,
      Latin-appendix passages absent.
  - id: CORR-8
    severity: DISAGREEMENT_RESOLVED_AGAINST_A_PEER
    subject: archive.org atharvaveda_202107 audio
    was: Agent D recorded mirroring PERMITTED on its CC Public Domain Mark
    now: UNKNOWN, no redistribution
    why: >-
      Agent E overruled Agent D. PD Mark is an ASSERTION by whoever applied it
      that a work is already out of copyright, not a grant. This is a 2020
      recording whose master is still sold on CD, tagged by a re-uploader with no
      standing. Agent D's own evidence clinches it - the sibling item
      atharvaveda_202106 is a BYTE-IDENTICAL file set with NO licence field, and
      the same bytes cannot be both public domain and all rights reserved.
      Generalised into rights.yaml as RIGHTS-11. Recorded openly so the
      disagreement is auditable rather than silent.
  - id: CORR-9
    severity: AGENT_E_ERROR_CATEGORY_CONFUSION
    subject: Shukla Yajurveda primary_sanskrit
    was: SELECTED, rights-clear and complete
    now: RIGHTS CLEAR, ARTIFACT COMPLETE, but NO USABLE PRIMARY TEXT LAYER
    why: >-
      Surfaced by Agent C as a direct consequence of Agent E's own ruling that
      the accented layer is EXTRACTED_FROM_CONTAINER. Agent E marked this role
      SELECTED on the strength of the ARTIFACT being rights-clear (CC BY-SA) and
      complete (40/40 adhyayas, 1975/1975 mantras). Both facts are true and
      neither establishes a usable primary text, because the artifact decomposes
      into two layers and NEITHER qualifies: UNACCENTED is a faithful
      transcription covering only 1836 of 1975 mantras, and ACCENTED reaches 1958
      but is extraction-derived and carries a role that must never be selected as
      primary_sanskrit. No layer is both faithful and complete.
      THE ERROR IS PRECISELY THE ONE AGENT E HAD BEEN WARNING OTHERS ABOUT, run
      in the opposite direction. Agent E told Agent D that role is not a proxy for
      permission; Agent E then used rights clarity as a proxy for role
      suitability. Same conflation, mirrored. RIGHTS CLARITY, ARTIFACT
      COMPLETENESS AND THE EXISTENCE OF A USABLE PRIMARY LAYER ARE THREE
      INDEPENDENT PROPERTIES, and a matrix row that reports one SELECTED verdict
      cannot express all three.
      Agent C fixed its build at the root rather than by constant: the builder
      now reads text_role from load_text_versions() rather than choosing one in
      code, and an unregistered id falls back to COMPARISON_ONLY, the most
      restrictive sensible role, never a permissive one. It also renamed its
      config field primary_text_version to leading_text_version so it stops
      implying a role it never had, and its report now states
      has_primary_text_layer NO.
# ===========================================================================
vedas:

  # =========================================================================
  # RIGVEDA - SAKALA
  # =========================================================================
  - work_id: VG:WORK:RV:SAK
    veda: Rigveda
    recension: Shakala
    overall_rights_verdict: SUFFICIENT_FOR_INGESTION_NON_COMMERCIAL
    verdict_note: >-
      The only Veda of the four with a rights-clear, retrievable, artifact-
      licensed primary Sanskrit text. Non-commercial and share-alike
      obligations attach permanently to anything derived from it.

    sources:

      - source_id: GRETIL
        role: primary_sanskrit
        selection: SELECTED
        work: Rigveda Samhita
        recension: Shakala (structural identification; the TEI header does not state a recension)
        edition: Theodor Aufrecht, Die Hymnen des Rigveda, Bonn 1877, volumes 1-2
        location: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_Rgveda-edAufrecht.xml
        artifact_id: GRETIL.RV.AUFRECHT.TEI.2019
        format: TEI_XML
        encoding: UTF-8, Sanskrit in Latin/IAST with combining Vedic accent marks
        coverage_exact: 10552 lg verse records (measured); complete Shakala samhita
        checksum_sha256: 14197d9c1dcced64900ef971d9f4dc5b46aa8750780f5599453c9739d6a29edd
        retrieval_date: 2026-09-04
        rights_status: CC_BY_NC_SA
        artifact_license: >-
          CC BY-NC-SA 4.0, declared in this file's own TEI
          teiHeader/fileDesc/publicationStmt/availability/licence element with
          target https://creativecommons.org/licenses/by-nc-sa/4.0/ - verbatim:
          "Distributed under a Creative Commons
          Attribution-NonCommercial-ShareAlike 4.0 International License."
        site_license: >-
          NONE. GRETIL publishes no corpus-wide licence. Its site posture is
          per-file and its own availability note disclaims warranty of title:
          "This e-text was provided to GRETIL in good faith that no copyright
          rights have been infringed."
        license_conflict: false
        license_conflict_note: >-
          This file carries NO notesStmt/note[@type="legacyheader"]. That
          absence is the decisive fact: unlike GRETIL's Samaveda file, there is
          no embedded upstream statement contradicting the CC licence. Verified
          by direct inspection of the stored snapshot on 2026-09-07.
        attribution_requirements: >-
          Credit Theodor Aufrecht (edition); Barend A. van Nooten and Gary B.
          Holland (data entry); Detlef Eichler (conversion and revision);
          Reinhold Gruenendahl (GRETIL normalization); Maximilian Mehner (TEI
          normalization); GRETIL/SUB Goettingen as publisher. Link the licence.
        redistribute: conditional
        redistribute_derived: conditional
        direct_link: true
        mirror_local: true
        conditions: >-
          Non-commercial only, and every derived artifact must itself be
          released under CC BY-NC-SA 4.0. This permanently forecloses
          commercial licensing of any VedaGraph output incorporating this text.
        reason: >-
          SELECTED. Sole candidate with (a) an explicit artifact-level licence,
          (b) no contradicting upstream statement, (c) a named printed critical
          edition, (d) machine-readable TEI with accents, (e) a
          hash-verified local snapshot.

      - source_id: VEDAWEB
        role: parallel_sanskrit
        selection: SELECTED
        work: Rigveda Samhita, multi-version corpus
        recension: Shakala
        edition: >-
          Aggregate of six Sanskrit versions (Aufrecht, Eichler, Lubotsky,
          Padapatha, van Nooten-Holland, Zurich) plus translations
        location: https://github.com/VedaWebProject/vedaweb-data
        repository_commit_sha: d3eb8af7324338161520d2d35eae8f7e985a19a5
        repository_path: rigveda/TEI/vedaweb_corpus.tei
        format: TEI_XML
        coverage_exact: >-
          Rigveda complete; six distinct Sanskrit text versions recorded
          individually in data/registry/text_versions.yaml
        retrieval_date: 2026-09-04
        rights_status: UNKNOWN
        rights_status_note: >-
          UNKNOWN is recorded at SOURCE level deliberately, because no
          repository-wide licence exists. Rights are real and resolved at
          TEXT VERSION level, not here.
        artifact_license: >-
          Per-version, declared inside vedaweb_corpus.tei. Five versions:
          "Distributed under a Creative Commons
          Attribution-NonCommercial-ShareAlike 4.0 International License."
          The Zurich version: "Distributed under a Creative Commons
          Attribution 4.0 International License." Two different CC licences in
          ONE file.
        site_license: >-
          NONE. The GitHub repository carries no repository-wide LICENSE
          granting rights over the corpus data.
        license_conflict: true
        license_conflict_note: >-
          Not a contradiction but a MULTIPLICITY: a single artifact contains
          sub-parts under different licences. Recording one licence for the
          file would be wrong in both directions - it would over-restrict the
          CC BY Zurich version and under-restrict nothing. Hence per-version
          records.
        attribution_requirements: >-
          Per version. Cologne Center for eHumanities as publisher; the named
          editors of each incorporated version; link each version's own licence.
        redistribute: conditional
        redistribute_derived: conditional
        direct_link: true
        mirror_local: true
        conditions: >-
          Must be resolved per text version before use. Git-hosted, so every
          build pins commit d3eb8af7324338161520d2d35eae8f7e985a19a5. Never
          build against a moving branch.
        reason: >-
          SELECTED for parallel-witness and padapatha roles. It is the reason
          VedaGraph has a text_versions registry at all: rights here are
          per-version by necessity.

      - source_id: GRETIL
        role: parallel_sanskrit
        selection: DEFERRED
        work: Rigveda Samhita Padapatha
        recension: Shakala
        edition: not yet inspected
        location: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_RgvedasaMhitApadapATha.xml
        format: TEI_XML
        coverage_exact: NOT ESTABLISHED - file identified in the GRETIL index but not fetched
        rights_status: UNKNOWN
        artifact_license: NOT ESTABLISHED - this file's own TEI header has not been read
        site_license: NONE (see the GRETIL primary_sanskrit row)
        license_conflict: unknown
        attribution_requirements: NOT ESTABLISHED
        redistribute: false
        redistribute_derived: false
        direct_link: true
        mirror_local: false
        reason: >-
          DEFERRED, not selected. A separate GRETIL padapatha TEI exists. Per
          RIGHTS-1 its licence CANNOT be inferred from the Aufrecht file's
          CC BY-NC-SA even though both are GRETIL Rigveda files - the Samaveda
          case proves that inference is unsafe. VedaWeb already supplies a
          rights-resolved padapatha, so this is redundant rather than blocking.

      - source_id: WIKISOURCE_GRIFFITH_RV
        role: english_translation
        selection: SELECTED
        work: The Hymns of the Rigveda
        recension: n/a (translation, follows Shakala numbering)
        edition: Ralph T. H. Griffith, second edition, E. J. Lazarus and Co., Benares, 1896
        location: https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda
        artifact_id: GRIFFITH.RV.1896.WIKISOURCE
        format: MEDIAWIKI_TRANSCRIPTION
        coverage_exact: Complete translation; 1245 page snapshots retained and hash-verified
        retrieval_date: 2026-09-04
        rights_status: PUBLIC_DOMAIN
        artifact_license: >-
          Wikisource PD-old page banner, verbatim: "This work was published
          before January 1, 1931, and is in the public domain worldwide because
          the author died at least 100 years ago." Page categories include
          "PD-old". Griffith died 1906.
        site_license: >-
          CC BY-SA. Wikimedia site footer, verbatim: "Text is available under
          the Creative Commons Attribution-ShareAlike License; additional terms
          may apply."
        license_conflict: true
        license_conflict_note: >-
          GENUINE DIVERGENCE, and it runs in the permissive direction at
          artifact level. The 1896 translation is public domain. The MediaWiki
          transcription layer - editorial markup, headers, proofreading
          decisions - is a contribution licensed CC BY-SA by the site footer.
          We rely on the PD status of the TRANSLATION TEXT, and deliberately do
          not depend on the transcription layer's creative content. Page
          revision provenance is therefore mandatory: the hosted transcription
          can change independently of the immutable print edition.
        attribution_requirements: >-
          None legally required for the PD translation. VedaGraph policy records
          Griffith as translator, the 1896 Lazarus edition, and the Wikisource
          page revision.
        redistribute: true
        redistribute_derived: true
        direct_link: true
        mirror_local: true
        reason: >-
          SELECTED. Unambiguously PD by age, complete, already snapshotted with
          full per-page provenance. The one caution is segmentation drift
          against the Sanskrit, which is a QA matter and not a rights matter.

      - source_id: WSC2023
        role: traditional_metadata
        selection: SELECTED
        work: Digital Rig Vedic Index (Anukramani)
        recension: Shakala
        edition: Akavarapu and Bhattacharya 2023, WSC Computational Sanskrit and Digital Humanities, pp. 89-96
        location: https://github.com/mahesh-ak/WSC2023
        format: PLAIN_TEXT
        coverage_exact: Anukramani/Mandala_*.txt only, 10 files, all hash-verified
        retrieval_date: 2026-09-04
        rights_status: APACHE_2_0
        artifact_license: >-
          NONE AT ARTIFACT LEVEL. The Anukramani data files carry no licence
          header. This was established by inspecting the exact files, not
          assumed.
        site_license: Apache-2.0, repository-level, https://www.apache.org/licenses/LICENSE-2.0
        license_conflict: false
        license_conflict_note: >-
          NOT a conflict, but the ONE case in our set where the
          repository-level licence is legitimately the operative level. It is
          legitimate here for two specific reasons: (a) the data files carry no
          contradicting statement, and (b) the repository owners are the authors
          of the data, so they hold the rights they are granting. Contrast
          GRETIL Samaveda, where the re-publisher did NOT author the data and
          an upstream statement contradicts the applied licence. The test is
          chain of title, not level of declaration.
        attribution_requirements: >-
          Retain Apache-2.0 LICENSE and NOTICE, state modifications, cite
          Akavarapu and Bhattacharya 2023, credit A V S D S Mahesh and Arnab
          Bhattacharya.
        redistribute: true
        redistribute_derived: true
        direct_link: true
        mirror_local: true
        reason: >-
          SELECTED for rishi / devata / chandas metadata. Commercial-safe. The
          repository's devata classifier models and dcs_w2v.vec word vectors are
          model artifacts, not traditional metadata, and are NEVER ingested.

      - source_id: VHP
        role: verification_reference
        selection: SELECTED_RESTRICTED
        work: Rigveda Shakala Samhita
        recension: Shakala
        edition: IGNCA portal presentation
        location: https://vedicheritage.gov.in/samhitas/rigveda/shakala-samhita/
        format: HTML_REFERENCE
        coverage_exact: All 10 mandalas presented; 5 verification snapshots retained
        retrieval_date: 2026-09-04
        rights_status: PERMISSION_REQUIRED
        artifact_license: >-
          No per-page grant. Governed by the portal copyright policy at
          https://vedicheritage.gov.in/copyright-policy/ - reproduction requires
          written permission.
        site_license: Same policy; PERMISSION_REQUIRED
        license_conflict: false
        attribution_requirements: >-
          Indira Gandhi National Centre for the Arts, Ministry of Culture,
          Government of India, or the individual contributor.
        redistribute: false
        redistribute_derived: false
        direct_link: true
        mirror_local: false
        conditions: >-
          Bounded private verification snapshots only. Structural metadata ABOUT
          the pages (hierarchy, counts, presence of audio) may be recorded. Page
          text and media are never republished.
        reason: >-
          SELECTED_RESTRICTED as the authoritative traditional cross-check and
          for audio discovery. Never an ingestion source.

      - source_id: VEDSEARCH
        role: verification_reference
        selection: REJECTED
        work: Rigveda
        recension: Shakala (asserted)
        edition: aggregator presentation, edition not disclosed
        location: https://vedsearch.org/
        format: HTML / JSON_API
        coverage_exact: NOT ESTABLISHED; displayed counts are assertions requiring reconciliation
        rights_status: UNKNOWN
        artifact_license: NONE FOUND
        site_license: NONE FOUND
        license_conflict: unknown
        attribution_requirements: NOT ESTABLISHED
        redistribute: false
        redistribute_derived: false
        direct_link: true
        mirror_local: false
        reason: >-
          REJECTED. No reusable content licence could be established, the
          underlying edition is undisclosed, and it is an aggregator rather than
