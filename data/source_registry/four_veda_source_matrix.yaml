  - work_id: VG:WORK:YV:VSM
    veda: Shukla Yajurveda
    recension: Madhyandina
    overall_rights_verdict: RIGHTS_SUFFICIENT_BUT_NO_USABLE_PRIMARY_TEXT_LAYER
    verdict_note: >-
      REVISED TWICE. RIGHTS are sufficient for every role - primary Sanskrit
      (CC BY-SA), English translation (Griffith 1899, public domain), and
      traditional metadata (CC BY-SA) - and the ARTIFACT is complete at 40 of 40
      adhyayas and 1975 of 1975 mantras. BUT THIS VEDA HAS NO USABLE PRIMARY TEXT
      LAYER, which is a different question and the honest headline. See
      correction CORR-9. The complete, rights-clear artifact decomposes into two
      text layers and NEITHER can serve as primary: the UNACCENTED layer is a
      faithful transcription but covers only 1836 of 1975 mantras, while the
      ACCENTED layer reaches 1958 of 1975 but is EXTRACTION-DERIVED and is
      registered EXTRACTED_FROM_CONTAINER, a role that must never be selected as
      primary_sanskrit. So no layer is both FAITHFUL and COMPLETE. Rights
      clarity, artifact completeness, and the existence of a usable primary layer
      are three independent properties and this Veda has the first two without
      the third. Two further caveats stand: the printed edition is now identified
      (Nirnaya Sagara 1929) but transcription FIDELITY to it is unverified, and
      share-alike binds any output incorporating the text. Notably GRETIL does
      not host this Veda at all, and the scholarly alternatives are worse on
      rights - TITUS grants no redistribution and The Sanskrit Library bytes are
      unreachable.

