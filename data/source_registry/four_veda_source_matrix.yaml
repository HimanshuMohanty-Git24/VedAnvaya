    Samaveda: SELECTED (Wikimedia Commons, 474 ogg, 458 CC_BY_SA + 16 CC0, page-level alignment, MIRRORABLE) / VHP reference-only
    Shukla_Yajurveda: REFERENCE_ONLY (VHP is the only authentic Madhyandina audio; archive.org alternatives are UNKNOWN or wrong recension)
    Atharvaveda: MIRRORABLE_WITH_RISK (Vedavani HF, APACHE_2_0, per-mantra + transcription, unaccented, no AVS refs, residual chain-of-title risk) / VHP per-sukta REFERENCE_ONLY. NOTE - AVS pada/krama/jata/ghana-patha recordings DO NOT EXIST, only samhita-patha, so patha_type must read SAMHITA or UNKNOWN
