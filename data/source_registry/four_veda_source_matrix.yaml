  - id: CORR-6
    severity: NEW_CONSTRAINT
    subject: VHP direct linking, affects ALL FOUR Vedas
    was: direct_link true
    now: direct_link CONTESTED
    why: >-
      Two live IGNCA pages contradict each other, both footer-dated 2026-08-27.
      Terms & Conditions: "We do not object to linking directly to the
      information that is hosted on this portal and no prior permission is
      required for the same." Hyper linking Policy: "Prior permission is
      required before hyperlinks are directed from any website/portal to this
      site." Independently found by Agents B, D and Agent E's own research.
      Consequence: for VHP even the LINK-ONLY fallback is not clean, which is
      unusual and affects every Veda because VHP is the verification source for
      all four. Framing is separately prohibited.
    applied_to_rows: false
    applied_run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
    applied_date: "2026-09-07"
    applied_note: >-
      DELIBERATELY NOT APPLIED - BLOCKED ON A SCHEMA DECISION, not overlooked.
      All four VHP rows still carry direct_link true, and rights.yaml still has
      direct_link yes under PERMISSION_REQUIRED with no VHP override.
      WHY IT CANNOT BE APPLIED AS WRITTEN: this correction's "now" value is
      CONTESTED, which is OUTSIDE the declared value domain. rights.yaml states
      the domain as "yes | no | conditional", and this file states that
      direct_link is RESOLVED FROM rights.yaml operational_semantics for the
      recorded rights_status - it is a derived field, not a per-row free value.
      Writing CONTESTED literally would both introduce an out-of-domain enum and
      break the derivation rule.
      RECOMMENDED RESOLUTION for whoever picks this up: express it as
      direct_link conditional plus a conditions field quoting BOTH contradictory
      IGNCA pages verbatim, since the schema already requires conditional to
      carry conditions. That stays in-domain and preserves the finding. The
      alternative - adding CONTESTED to the domain - is a wider schema change
      affecting every source and should not be made incidentally.
      ALSO OUT OF SCOPE HERE: VHP is a verification_reference, not a
      canonical-Sanskrit primary source, so this does not gate any of the three
      blockers this run was opened to close. Flagged rather than forced.
  - id: CORR-7
    severity: AGENT_E_ERROR
    subject: Atharvaveda english_translation, Kanda 20
    was: gap declared unclosable
    now: CLOSED via Griffith 1895-96
    why: >-
