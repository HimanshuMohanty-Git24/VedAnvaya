          DECLARATION MATTERS and is easy to get wrong: it is NOT the basis for
          the text's public-domain status (see rights_basis - that comes from
          1856 plus the author death dates). What it uniquely supplies is a
          DISCLAIMER OF THE SCAN-LAYER RIGHT. Under German law a faithful
          reproduction photograph may attract a thin neighbouring right (UrhG
          s.72 Lichtbildschutz), and BSB is the one party in this chain with
          standing to assert or waive that right over its own digitisation. It
          has waived it. A party without standing to GRANT rights in the text
          does have standing to WAIVE a right it could itself assert.
        license_conflict: false
        attribution_requirements: >-
          None legally required. VedaGraph records Roth and Whitney, Berlin 1856,
          and the BSB URN.
        redistribute: true
        redistribute_derived: true
        direct_link: true
        mirror_local: true
        conditions: >-
          Any transcription derived from this scan is governed by RIGHTS-13: it
          must be derived SOLELY from the page images, with no Orlandi-derived
          reading admitted through any channel, including transcriber recall, a
          parallel edition, or an LLM assistant. Unclear characters are marked
          [?] and ship as PHILOLOGICAL_REVIEW_REQUIRED, never silently completed.
          LICENCE OF THE OUTPUT MUST BE SPLIT, or the combined artifact
          overclaims: the TRANSCRIBED TEXT is CC0/public domain, because there is
          no copyright in it to license and asserting one would be the same
          copyfraud RIGHTS-10 condemns in others; only VedaGraph's own STRUCTURAL
          APPARATUS (keying, JSONL schema, alignment, SourceAssertions) carries a
          VedaGraph licence. CC0 text inside a CC BY-SA artifact composes upward,
          so this does not conflict with the live Yajurveda and Samaveda
          share-alike obligations.
        alternate_location_note: >-
          THE ARCHIVE.ORG COPY IS A CONVENIENCE MIRROR ONLY, and its metadata is
          actively misleading. It is tagged CC BY 3.0 by uploading account
          "drvgaikwad" (June 2011), but every sampled leaf carries a "Digitized
          by Google" watermark: it is a GOOGLE BOOKS RE-UPLOAD and the tagger is
          not even the digitiser. That tag is VOID FOR WANT OF STANDING twice
          over - the uploader holds neither the text right nor the scan-layer
          right - and is recorded as the sixth instance of RIGHTS-10, a new
          sub-type detectable only by inspecting a page margin rather than by
          reading the print. Its scan layer is additionally UNDISCLAIMED, since
          Google has waived nothing. Prefer BSB.
          The Deutsche Digitale Bibliothek record carries "Nur nicht
          kommerzielle Nutzung erlaubt". That restriction is STRUCTURALLY WITHOUT
          STANDING, not a metadata glitch: DDB is an AGGREGATOR downstream of
          BSB, and under RIGHTS-9 the chain resolves to its root, which is BSB
          plus the 1856 print. An aggregator has no more standing to IMPOSE a
          restriction the holder released than to GRANT one the holder withheld.
        reason: >-
          SELECTED_RESTRICTED and STRATEGICALLY DECISIVE - this row is the reason
          the Atharvaveda blocker moved. Roth and Whitney 1856 is the ONLY
          identified route to a rights-clear Shaunaka Sanskrit text, because it
          bypasses the Orlandi 1991 encumbrance entirely rather than seeking
          permission through it. An earlier revision read "No specific scan item
          has been identified yet, so rights are recorded UNKNOWN rather than
          assumed"; two items are now identified, inspected and adjudicated.
          SELECTED_RESTRICTED rather than SELECTED because the posture is
          narrower than ingestion: the scan is acquired and cleared, but no
          transcription exists yet. What stands between this row and a usable
          Shaunaka primary text is bounded transcription LABOUR under RIGHTS-13,
          not unresolved research or unresolved rights. That is the whole
          distinction between this Veda's old status and its new one.

