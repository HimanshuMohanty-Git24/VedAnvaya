    Atharvaveda: SELECTED_RESTRICTED (VHP)

# ===========================================================================
# PRIMARY SANSKRIT RIGHTS ARE CLEAR FOR THREE OF FOUR - Rigveda, Samaveda,
#   Sukla Yajurveda. Atharvaveda alone is rights-blocked.
# BUT A USABLE PRIMARY TEXT LAYER EXISTS FOR ONLY ONE - Rigveda. Sukla
#   Yajurveda has rights and a complete artifact yet no layer that is both
#   faithful and complete (CORR-9); Samaveda's selected witness is a community
#   transcription with no identified printed edition; Atharvaveda is blocked
#   outright. RIGHTS CLARITY IS NOT THE SAME QUESTION AS USABILITY, and
#   conflating them is the single most likely way this project overstates
#   readiness.
# ENGLISH TRANSLATION IS CLEAR FOR TWO OF FOUR, PARTIAL FOR ONE, ABSENT FOR ONE.
# HINDI TRANSLATION IS CLEAR FOR NONE.
# AUDIO IS MIRRORABLE FOR TWO OF FOUR - Samaveda (474 Commons files, CC BY-SA
#   + CC0, page-level alignment, clean chain) and Atharvaveda (Vedavani,
#   Apache-2.0, per-mantra, but residual chain-of-title risk). Rigveda and Sukla
#   Yajurveda audio remain REFERENCE_ONLY or UNKNOWN.
# Partial clarity per Veda per ROLE is the real shape of this corpus.
#
# TWO THINGS CHANGED DURING COMPILATION, both by auditing snapshots that other
# agents had already taken rather than by new research:
#   * Sukla Yajurveda went from worst-covered to second-best-covered, because
#     Sanskrit Wikisource supplies an accented, complete, CC BY-SA Madhyandina
#     text plus its traditional metadata.
#   * Samaveda moved from blocked-outright to blocked-pending-verification.
# Neither upgrade came from finding a more permissive licence. Both came from
# finding a source with a DIFFERENT LINEAGE. Where a defect is at the root of a
# chain, only a different chain fixes it - shopping hosts does not.
# ===========================================================================
