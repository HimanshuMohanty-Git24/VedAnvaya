      check on this artifact passed; it is public domain and cleanly tagged.
      What no rights check catches is that there is nothing behind the banner.
      Compounding it, the only COMPLETE Griffith Samaveda (sacred-texts.com) is
      the RANAYANIYA recension - Griffith's own preface says "I have followed
      Benfey's text" and Benfey is Ranayaniya - so it cannot be aligned to a
      Kauthuma text without producing a silently wrong cross-recension
      alignment. Samaveda therefore has NO rights-clear, coverage-complete,
      recension-correct English translation.
    applied_to_rows: true
    applied_run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
    applied_date: "2026-09-07"
    applied_note: >-
      NOT APPLIED UNTIL THIS RUN. The WIKISOURCE_GRIFFITH_SV english_translation
      row still read selection SELECTED, with coverage_exact asserting "Complete
      translation per the page header" and a reason field explaining that
      alignment merely awaited the Kauthuma hierarchy. All three are now
      corrected to GAP. The file had been contradicting itself:
      role_coverage_summary already said GAP while the row said SELECTED.
  - id: CORR-3
    severity: BLOCKER_CLEARED
    subject: Samaveda primary_sanskrit
    was: DEFERRED, independence unverified
    now: SELECTED, with an edition-identity limitation
    why: >-
      Agent B proved Sanskrit Wikisource's independence from the Pandey lineage
      TEXTUALLY rather than by provenance argument: at running verses 1-2 GRETIL
      misplaces a pada between verses while Wikisource has both verses whole,
      and the two use different verse-numbering systems. A text cannot inherit
      from a source it does not share an error with. It also carries the GANA
      (725 pages), which the GRETIL text lacks entirely. The Samaveda problem is
      therefore NOT "no independent witness exists" - it is "no witness combines
      an identified printed edition WITH redistribution rights".
    applied_to_rows: true
    applied_run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
    applied_date: "2026-09-07"
    applied_note: >-
      NOT APPLIED UNTIL THIS RUN. The WIKISOURCE_SA primary_sanskrit Samaveda row
      still read selection DEFERRED, with both original sub-blockers still listed
      as open ("INDEPENDENCE - must confirm ..." and "COVERAGE - only 3 pages
      retrieved; gana presence unknown") and a reason field stating "Not
      selected, because independence is exactly the thing that has not been
      verified." Both sub-blockers had in fact been cleared. Row now reads
      SELECTED with edition identity as the sole remaining blocker.
      IMPORTANT DISTINCTION preserved in the row: SELECTED here is a SOURCE
      decision. It does NOT freeze canonical identity - works.yaml keeps
      identity_status RESEARCH_REQUIRED and key_pattern null, because the edition
      is still unnamed. Selection and identity are separate commitments and this
      correction moves only the first.
  - id: CORR-4
    severity: GAP_FILLED
    subject: Sukla Yajurveda edition identity
    was: edition UNIDENTIFIED
    now: >-
      Vasudeva Sarma Panasikara, 2nd edn, Nirnaya Sagara Press, Bombay,
