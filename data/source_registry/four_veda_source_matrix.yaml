  # =========================================================================
  # ATHARVAVEDA - SAUNAKA
  # =========================================================================
  - work_id: VG:WORK:AV:SAU
    veda: Atharvaveda
    recension: Shaunaka
    overall_rights_verdict: RIGHTS_BLOCKED_FOR_PRIMARY_SANSKRIT
    verdict_note: >-
      English translation is COMPLETE, but only via a SECOND translator, and
      recording an Agent E error. Whitney/Lanman 1905 via VedaWeb covers 4881 of
      5842 stanzas and KANDA 20 (958 stanzas, ~16 percent) is untranslated in
      BOTH VedaWeb and Wikisource. Agent E concluded the gap belonged to the
      digitised Whitney tradition and was closable by no source switch. WRONG -
      the error was scoping the search to ONE TRANSLATOR. Griffith 1895-96 is a
      different translation, is the only complete AVS translation, covers book XX
      per-verse, and critically sits on the SAME Berlin/Roth-Whitney numbering
      spine as our GRETIL_AVS Sanskrit (verified: book 7 = 118 hymns not the
      Bombay 123; book 20 = 143). Note the contrast with Samaveda, where the only
      complete Griffith translation is on the WRONG recension and is therefore
      unusable - same translator, same era, opposite outcome, and the deciding
      factor is the numbering spine rather than the licence. Traditional metadata
      is ALSO no longer a gap, and ONE mirrorable audio option now exists. Primary Sanskrit is blocked, and for a DIFFERENT reason from
      Samaveda: the digital Shaunaka text descends from Orlandi's Pisa 1991
      transliteration, a modern edition still in copyright, and GRETIL's copies
      self-declare reference-only, resolving via their own pointer to TITUS's
      express no-republication clause. KEY STRUCTURAL FINDING: TITUS, GRETIL's
      avs_*.htm and VedaWeb's AVS Sanskrit layer are ALL the same Petr and
      Vavrousek text - ONE licensing dependency wearing three hats, not three
      sources to compare. So there is no independent Shaunaka witness among
      them, and ONE written permission from the TITUS Project would unlock all
      three. Two Vedas blocked, two distinct legal causes - which is exactly why
      per-artifact adjudication cannot be replaced by a per-host rule.

