role_coverage_summary:
  primary_sanskrit:
    Rigveda: SELECTED (GRETIL Aufrecht TEI, CC_BY_NC_SA)
    Samaveda: SELECTED (Sanskrit Wikisource, CC_BY_SA, independence PROVEN textually, includes gana; edition unidentified)
    Shukla_Yajurveda: RIGHTS_CLEAR_BUT_NO_PRIMARY_TEXT_LAYER (Sanskrit Wikisource artifact is CC_BY_SA and complete at 40/40 adhyayas and 1975/1975 mantras, edition IDENTIFIED as Nirnaya Sagara 1929 - but its two text layers split into faithful-but-incomplete (UNACCENTED, 1836/1975) and complete-but-inferred (ACCENTED, 1958/1975, EXTRACTED_FROM_CONTAINER). No layer is both faithful and complete. See CORR-9.)
    Atharvaveda: BLOCKED (GRETIL reference-only; TITUS express no-republication; Orlandi 1991 still in copyright)
  parallel_sanskrit:
    Rigveda: SELECTED (VedaWeb, per-version licences)
    Samaveda: GAP (no independent lineage exists)
    Shukla_Yajurveda: DEFERRED (Weber 1849 scans)
    Atharvaveda: DEFERRED (Roth/Whitney 1856 scans)
  english_translation:
    Rigveda: SELECTED (Griffith 1896, PUBLIC_DOMAIN, 1245 pages snapshotted)
    Samaveda: GAP (Wikisource page has NO verse text; the only complete Griffith is RANAYANIYA, wrong recension)
    Shukla_Yajurveda: SELECTED (Griffith 1899, PUBLIC_DOMAIN, archive.org in.ernet.dli.2015.215626; OCR-only, not ingested)
    Atharvaveda: SELECTED (Griffith 1895-96 via sacred-texts, PUBLIC_DOMAIN, COMPLETE incl. book XX, same numbering spine as GRETIL_AVS; defects - AVS 2.20-2.23 missing, some corrupted anchors) + Whitney/Lanman 1905 via VedaWeb per-stanza for 4881/5842
  hindi_translation:
    Rigveda: GAP
    Samaveda: GAP
    Shukla_Yajurveda: GAP
    Atharvaveda: GAP
  traditional_metadata:
    Rigveda: SELECTED (WSC2023, APACHE_2_0)
    Samaveda: GAP
    Shukla_Yajurveda: SELECTED (Sanskrit Wikisource sarvanukramani + rishisuci, CC_BY_SA, contents unparsed)
    Atharvaveda: SELECTED (Whitney per-hymn Brhatsarvanukramani headers on Wikisource, PUBLIC_DOMAIN, 588 hymns books I-XIX, per-hymn NOT per-mantra; the true per-mantra source Vishva Bandhu 1970 prints all-rights-reserved and runs to 2034 in India)
    note: Hindi remains a GAP for all four, but Dayananda Saraswati (d. 1883, PD since 1944) is the one safely-PD Hindi option and is on the Madhyandina; Satavalekar (d. 1968) is in copyright in India until 2029 and Ramnath Vedalankar (d. 2013) until 2074
  audio:
