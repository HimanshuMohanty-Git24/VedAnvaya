    applied_to_rows: true
    applied_run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
    applied_date: "2026-09-07"
    applied_note: >-
      LIKE CORR-1, THIS HAD NOT BEEN APPLIED TO THE ROWS UNTIL THIS RUN. The
