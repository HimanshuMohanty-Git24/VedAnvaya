    applied_to_rows: PARTIAL
    applied_run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
    applied_date: "2026-09-07"
    applied_note: >-
      PARTIALLY APPLIED, and the unapplied half is a MISSING ROW rather than a
