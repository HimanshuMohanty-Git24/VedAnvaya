          work still in copyright. The Sanskrit Library asserts CC BY-NC-SA 3.0
          downstream of it. Per RIGHTS-9 the chain is followed to its root, and
          the root is encumbered. Note the same publisher's Vajasaneyi record IS
          accepted as CC_BY_NC_SA - because its root is Weber 1849, which is
          public domain. Same publisher, same licence text, three different
          verdicts across three Vedas, each driven by the root of the chain.
        attribution_requirements: >-
          The Sanskrit Library; Peter M. Scharf; Matthias H. Ahlborn; upstream
          Orlandi, Roth/Whitney, Petr, Gippert/TITUS.
        redistribute: false
        redistribute_derived: false
        direct_link: true
        mirror_local: false
        blocking_item: >-
          TWO blockers. (1) Chain of title: Orlandi 1991 is in copyright.
          (2) Acquisition: no download endpoint.
        reason: >-
          DEFERRED. Resolution requires either permission from the Orlandi/
          Giardini rights holders, or a Shaunaka text based solely on the
          public-domain Roth/Whitney 1856 edition with no Orlandi-derived
          collation.

