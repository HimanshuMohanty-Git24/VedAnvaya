# ---------------------------------------------------------------------------
# CORRECTIONS APPLIED AFTER THE FIRST COMPILE
#
# Recorded openly rather than quietly folded in. Per-artifact detail and
# verbatim evidence live in data/registry/source_artifacts.yaml.
# ---------------------------------------------------------------------------
corrections_applied:
  - id: CORR-1
    severity: AGENT_E_ERROR
    subject: TITUS, all three Vedas
    was: RESEARCH_ONLY
    now: PERMISSION_REQUIRED
    why: >-
      Agent E classified TITUS from its project-wide page at texte2.htm alone.
      EVERY TITUS Veda text page carries a stricter per-page notice: "Copyright
      TITUS Project, Frankfurt a/M, 2.11.2013. No parts of this document may be
      republished in any form without prior permission by the copyright
      holder." Found by Agent C, then independently verified by Agent E
      fetching vs001.htm, svk001.htm and avs001.htm. This is a failure of
      exactly the rule Agent E was enforcing on everyone else - RIGHTS-1 - and
      note the direction: here the SITE page was the more PERMISSIVE of the two,
      so relying on it was not merely incomplete but wrong in our favour.
    applied_to_rows: true
    applied_run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
    applied_date: "2026-09-07"
    applied_note: >-
      CORRECTION HAD NOT ACTUALLY BEEN APPLIED TO THE ROWS UNTIL THIS RUN. From
      the session that recorded it until now, this entry existed only as an audit
      record while all three TITUS rows still carried rights_status
      RESEARCH_ONLY and artifact_license "NONE at file level". Any consumer
      reading rights_status programmatically would have seen the PERMISSIVE
      pre-correction value, which is precisely the failure mode CORR-1 was
      raised about - so the correction reproduced its own bug one layer down.
      Found by the independent rights reviewer on re-inspection, applied by the
      single-writer coordinator. Three rows changed: Samaveda (svk), Shukla
      Yajurveda (vs), Atharvaveda (avs). Each row's rights_status is now
      PERMISSION_REQUIRED, each artifact_license now records the verbatim
      per-page notice, and each license_conflict is now true with the RIGHTS-3
      resolution stated. THE LESSON, recorded because it generalises: a
      corrections_applied block is a claim about the data, not a mutation of it,
      and nothing in the schema forced the two to agree. Future corrections must
      carry this applied_to_rows flag.
  - id: CORR-2
    severity: COVERAGE_INVALIDATES_SELECTION
    subject: Samaveda english_translation
    was: SELECTED (Wikisource Griffith 1895)
    now: GAP
    why: >-
      The page is PREFACE ONLY - 5615 characters, 934 words, TextQuality 25%,
      33 chapter links of which zero resolve, and an allpages prefix query
