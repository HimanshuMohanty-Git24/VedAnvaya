      - source_id: SANSKRIT_LIBRARY
        role: parallel_sanskrit
        selection: DEFERRED
        work: Rgveda-Samhita, Books I-X
        recension: Shakala
        edition: First XML edition, The Sanskrit Library, Providence RI, 2010
        location: https://sanskritlibrary.org/catalogsText/titus/vedic/rv1.html
        format: TEI_XML (catalogued; no download endpoint exposed)
        coverage_exact: Ten per-book records rv1.html..rv10.html, plus rvkh.html for the Khilani
        retrieval_date: 2026-09-07
        rights_status: CC_BY_NC_SA
        artifact_license: >-
          Per-record, verbatim: "Copyright (C) 2010 The Sanskrit Library" and
