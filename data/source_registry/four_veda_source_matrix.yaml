  # =========================================================================
  # SAMAVEDA - KAUTHUMA
  # =========================================================================
  - work_id: VG:WORK:SV:KAU
    veda: Samaveda
    recension: Kauthuma
    overall_rights_verdict: PRIMARY_SANSKRIT_CLEARED_ENGLISH_NOW_A_GAP
    verdict_note: >-
      BOTH VERDICTS MOVED, IN OPPOSITE DIRECTIONS - see corrections CORR-2 and
      CORR-3. Primary Sanskrit is now CLEARED: Sanskrit Wikisource was proved
      textually independent of the Pandey lineage that encumbers every scholarly
      digital Kauthuma text (GRETIL, TITUS, The Sanskrit Library all descend
      from the same 1998/1999 data entry forbidding modification), it is
      CC BY-SA 4.0, and uniquely it carries the GANA. English translation is now
      a GAP, not the one clear role: the Wikisource page has no verse text, and
      the only complete Griffith Samaveda is the RANAYANIYA recension. The
      remaining primary-text limitation is the EDITION bar, not rights - it is a
      community transcription with no named printed edition, unlike the
      Yajurveda case where a sibling preface page names one. Also record the
      coverage scale: the Kauthuma gana corpus is roughly 2639 ganas against
      1875 arcika verses, so the SUNG dimension is the LARGER artifact, and a
      claim to "have the Samaveda" while holding only the arcika would be false.

    sources:

      - source_id: GRETIL
        role: primary_sanskrit
        selection: REJECTED
        work: Samavedasamhita
        recension: Kauthuma (the file body states verbatim "kauthuma sakha")
        edition: >-
          UNIDENTIFIED. sourceDesc contains an EMPTY <bibl></bibl>. The
          underlying printed Kauthuma edition is named nowhere in the file.
        location: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_sAmavedasaMhitA.xml
        format: TEI_XML
        encoding: UTF-8, sa-Latn IAST romanization, NOT Devanagari
        coverage_exact: >-
          Arcika/verse text ONLY, with NO gana collections. Measured by Agent B:
          4 arcikas, 1868 distinct structural verse keys, 3714 verse lines
          (Purvarcika 585, Aranya 55, Mahanamnya 10, Uttararcika 1218). The
          source's own running numbering CLAIMS 1875 verses, so the structural
          parse is 7 short - an open reconciliation gap, reported not filled.
        checksum_sha256: 91c28c0394e94dccc9bad12a08224fbcde0a1194402b610df26647621ed92456
        file_size_bytes: 272261
        retrieval_date: 2026-09-07
        rights_status: PERMISSION_REQUIRED
        artifact_license: >-
          SELF-CONTRADICTORY WITHIN ONE FILE. The TEI
          publicationStmt/availability/licence asserts, verbatim: "Distributed
          under a Creative Commons Attribution-NonCommercial-ShareAlike 4.0
          International License." The SAME fileDesc carries
          notesStmt/note[@type="legacyheader"] asserting, verbatim: "Copyright
          (C) 1998 Anshuman Pandey / This document may only be used for academic
          and scholarly purposes. No modification of this document is in any way
          authorized. Any publication or other use of this document requires
          written consent of the editor."
        site_license: >-
          NONE. GRETIL publishes no corpus-wide licence, and its own
          availability note disclaims title: "This e-text was provided to GRETIL
          in good faith that no copyright rights have been infringed... The file
          will be immediately removed pending resolution of the claim."
        license_conflict: true
        license_conflict_note: >-
          IRRECONCILABLE INTRA-ARTIFACT CONFLICT. CC BY-NC-SA 4.0 permits
          adaptation under share-alike; the embedded contributor statement
          forbids modification outright and requires written consent for any
          publication. Under RIGHTS-3 the more restrictive statement controls,
          and under RIGHTS-9 the defect propagates from the root of the chain.
          GRETIL cannot grant rights it does not hold, and by its own wording it
          does not claim to hold them. Decisive operationally because
          VedaGraph's pipeline - TEI parse, NFC normalization, structural
          re-keying, JSONL republication - constitutes both modification AND
          publication. Independently reached by Agent B and Agent E.
        attribution_requirements: >-
          Anshuman Pandey (data entry 1998), Reinhold Gruenendahl, Maximilian
          Mehner, GRETIL/SUB Goettingen - but attribution does not cure the
          modification prohibition.
        redistribute: false
        redistribute_derived: false
        direct_link: true
        mirror_local: conditional
        conditions: The retained snapshot is a private verification artifact only.
        reason: >-
          REJECTED on TWO INDEPENDENT grounds, either sufficient alone.
          (1) RIGHTS: the modification prohibition blocks the pipeline.
          (2) EDITION IDENTITY: sourceDesc/bibl is empty, so the artifact cannot
          say WHICH printed Kauthuma edition it represents - fatal for a Veda
          whose identity contract explicitly requires the selected edition's
          Purvarcika/Uttararcika hierarchy. Its refsDecl is also mass-conversion
          boilerplate claiming references live in xml:id attributes the body does
          not contain. Evidence supplied by Agent B, corroborated by Agent E.

