referent_migration_summary:
  referents_that_move_under_an_unchanged_uuid: 5
  detectable_by_any_existing_gate: false
  why_undetectable: >-
    Passage carries NO text field (13 fields, verified by execution). qa/checks.py
    references text_original exactly once and it is a UTF-8 encodability assert.
    stable_uuid_deterministic recomputes uuid_for_urn(canonical_urn) from the URN ALONE, so
    it passes identically before and after a referent swap. Nothing anywhere binds a
    canonical key to its text. Renumbering is at least visible; referent migration is not.

phantom_canonical_keys:
  - key: VG:SV:KAU:A4:P04:R2:D01:V13
    address: "(4,4,2,1,13)"
    pada_labels: [c]
    marker: 1127
    why_phantom: >-
      Dasati (4,4,2,1) prints markers 1116..1127 = 12 verses but VedaGraph mints 13
      addresses. Pada labels '12a' and '13c' are the two padas of ONE verse (marker 1127).
      This key identifies a verse that does not exist, and marker 1127 is split across two
      IDs.
    invisible_because: >-
      The two pada labels land in DIFFERENT verse buckets, so DUPLICATE_LINE_LABEL never
      fires. The corpus-wide shortage (-9) and this local surplus (+1) cancel in the total,
      which is why a 1868-vs-1875 check cannot see either.
    retraction_requires: >-
      Deleting a minted canonical key. Per ID_SPEC that demands a versioned migration and
      an explicit mapping - which is precisely what freezing is meant to make unnecessary.

