    recovers: []
    also_fixes: PHANTOM_CANONICAL_KEY
    refinement_found_by_implementing_the_check: >-
      THE NAIVE SPAN CHECK HAS A FALSE POSITIVE, found by writing the test rather than by
      reasoning about it, and recorded so the check is not shipped in its naive form.
      "Flag a dasati that mints more addresses than its marker span" flags TWO units:
        (4,4,2,1)  - the GENUINE phantom. Pada sets are {1, 2}: V12=[a] and V13=[c] are one
                     verse split across two addresses. This is the signature.
        (4,7,3,10) - a FALSE POSITIVE. Pada sets are {3}: all three addresses carry complete
                     [a,c,e] triads. The span only LOOKS short because printed marker 1592 is
                     unliftable under the single-danda defect. Nothing is over-minted.
      Two equivalent sound forms: require that some address in the unit have an incomplete
      pada set, OR run the span check only AFTER SV-ADAPTER-1 has repaired single-danda
      lifting. Pinned by
      tests/unit/test_samaveda_referent_integrity.py::test_the_naive_over_minting_detector_has_exactly_one_false_positive
      NOTE THE GENERAL SHAPE OF THIS ERROR: a check that compares a MINTED count against a
      LIFTED count measures the adapter against itself, and inherits every lifting defect as a
      phantom report. Compare against what the SOURCE PRINTS.
