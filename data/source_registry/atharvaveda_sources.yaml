    entry_point: http://titus.uni-frankfurt.de/texte/etcs/ind/aind/ved/av/avs/avs.htm
    entry_point_http_status: 200
    structure: >-
      773 sequential frameset HTML pages avs001.htm to avs773.htm (avs774.htm returns 404).
      The index frame carries a SELECT element listing all 20 kandas.
    format: >-
      HTML 3.2-era framesets, UTF-8, with per-line structural labels reading Book,
      Hymn, Verse and Halfverse
    format_rank: 3
    accent_status: >-
      ACCENTED - the sole combining mark in the text is U+0301. Uses U+02B0 modifier letter
      small h for aspirates and m-with-dot-below for anusvara.
    machine_readable: >-
      Yes, scrapable, but the markup is very noisy - every single word is wrapped in a
      javascript concordance link, so pages run 7-20 KB for a few verses.
    artifact_rights_verbatim: |
      This text is part of the TITUS edition of Atharva-Veda-Samhita (Saunaka).
      Copyright TITUS Project, Frankfurt a/M, 4.3.2015. No parts of this document may be
      republished in any form without prior permission by the copyright holder.
    artifact_rights_location: >-
      http://titus.uni-frankfurt.de/texte/etcs/ind/aind/ved/av/avs/avs.htm and the footer of
      each avsNNN.htm page
    site_rights_verbatim: |
      All texts that can be downloaded via http from the TITUS server can be used freely
      for scholarly purposes, provided that they are quoted as sources and the name(s) of
      the editor(s) and the date of last changes are indicated in publications. The texts
      must not be used for any kind of commercial usage. Downloading of some of the texts
      is restricted to members of the TITUS project.
    site_rights_location: >-
      http://titus.uni-frankfurt.de/texte/textex.htm, section headed
      "Notice on copyright and etiquette"
    artifact_vs_site_conflict: >-
      YES, AND IT IS MATERIAL. The site grants free scholarly use with attribution; the
      artifact forbids republication in any form without prior permission. A redistributed
      derived corpus cannot satisfy both. The stricter artifact-level statement governs,
      per this project's rule that artifact rights are not overridden by site rights.
    additional_restriction: >-
      The catalogue page texte2.htm labels a plain-text version "Plain text retrieval
      (TITUS Members only)" at
      http://titus.fkidg1.uni-frankfurt.de/private/texte/indica/vedica/av/av.txt. That URL
      currently returns HTTP 200 with no authentication (798,190 bytes, ISO-8859-1, TITUS's
      own ASCII markup, 5,919 verse markers), so the access control is not enforced. It sits
      under /private/, which is Disallow-ed in robots.txt on both titus.uni-frankfurt.de and
      titus.fkidg1.uni-frankfurt.de. TREAT AS OFF-LIMITS REGARDLESS OF THE 200. VedaGraph
      did not fetch it and must not.
    rights_status_recommended: REFERENCE_ONLY
    rejection_reason: >-
      Not rejected on quality - it is a good edition and a genuine parallel candidate whose
      halfverse granularity would be useful. Deferred on rights: non-commercial, plus no
      republication, plus attribution including date of last change. Note also its 5,919
      verse markers against the GRETIL artifact's 5,839 distinct / 5,843 units, a third
      distinct count within the same lineage, which deserves reconciliation if TITUS is ever
      licensed.
    action_required: >-
      Written permission request to the TITUS Project.

