# =======================================================================================
# GAPS - stated plainly
# =======================================================================================
gaps:
  - gap: NO_ACCENTED_SANSKRIT_UNDER_AN_OPEN_LICENCE
    detail: >-
      Every accented AVS source found is rights-encumbered - GRETIL, TITUS and VedaWeb's
      Sanskrit layer are REFERENCE_ONLY pending TITUS permission; vedicheritage.gov.in is
      PERMISSION_REQUIRED; thevyasa.in is UNKNOWN. Every openly-licensed AVS source found is
      unaccented (sa.wikisource, CC BY-SA 4.0). This is a permission problem, not an
      engineering problem. But note the routes are NARROWER than first stated: a TITUS grant
      alone is NOT sufficient for the Latin text, because the root of that chain is Orlandi
      1991 and still in copyright - see the ORLANDI gap below. The genuinely open routes are
      IGNCA for accented Devanagari plus audio, or a fresh Saunaka text derived solely from
      the public-domain Roth/Whitney 1856 edition.
  - gap: NO_RETRIEVABLE_XML_OR_TEI_FOR_AVS
    detail: >-
      CORRECTED. An XML/TEI edition of the Saunaka Atharvaveda DOES exist - The Sanskrit
      Library, 2010, ed. Peter M. Scharf with XML markup and TEI header by Matthias H.
      Ahlborn - but the rights authority verified that only the bibliographic catalogue
      record is retrievable and THE UNDERLYING TEI IS NOT EXPOSED AT ANY DISCOVERED URL
      (registered as SANSKRITLIB.AV.SAUNAKA.TEI.2010, format CATALOGUE_RECORD for exactly
      that reason). So the correct statement is not "no TEI exists" but "no TEI is
      retrievable". Beyond that: GRETIL serves the PAIPPALADA recension as TEI but the
      SAUNAKA recension only as legacy HTML; its corpustei collection holds only the
      ancillary sa_atharvavedapariziSTas.xml and sa_atharvaprAyazcittAni.xml, which are not
      the samhita. TITUS is frameset HTML. VedaWeb serves JSON but not TEI, and
      github.com/VedaWebProject/vedaweb-data contains only a rigveda directory. So format
      rank 3 remains the best achievable in practice. No OCR was performed or needed.

  - gap: THE_ROOT_OF_THE_CHAIN_IS_ORLANDI_1991_AND_STILL_IN_COPYRIGHT
    detail: >-
      THE MOST IMPORTANT CORRECTION IN THIS FRAGMENT, and it weakens an earlier conclusion of
      mine. I wrote that ONE permission request to the TITUS Project would unlock GRETIL,
      TITUS and VedaWeb's Sanskrit layer together. Following the provenance chain to its ROOT
      shows that is not sufficient. Every accented Latin AVS text in this matrix descends from
      "Gli inni dell' Atharvaveda (Saunaka), trasliterazione a cura di Chatia Orlandi, Pisa:
      Giardini, 1991" - a MODERN SCHOLARLY TRANSLITERATION STILL IN COPYRIGHT - collated with
      the public-domain Roth/Whitney 1856 edition. The Sanskrit Library asserts CC BY-NC-SA
      3.0 downstream of Orlandi, which cannot cure an encumbered root. Under the authority's
      rule RIGHTS-9 the chain is followed to its root and the root governs.
      CONSEQUENCE: resolution requires EITHER additional permission from the Orlandi/Giardini
      rights holders on top of TITUS, OR a Saunaka text based solely on Roth/Whitney 1856 with
      no Orlandi-derived collation. The latter is the only identified route to a rights-clear
      Saunaka Sanskrit text, and no such artifact was found in this investigation.
  - gap: KANDA_20_HAS_NO_WHITNEY_TRANSLATION_BUT_GRIFFITH_COVERS_IT
    detail: >-
      CORRECTED after further verification. VedaWeb's Whitney layer stops before book 20 and
      English Wikisource has no book XX hymn subpages, so 958 of 5,839 mantras (16.4 percent)
      have no WHITNEY translation - Whitney excluded book 20 deliberately, calling it "in the
      main a pure mass of excerpts from the Rig-Veda". But GRIFFITH covers all 20 kandas,
      per-verse, on the same Berlin numbering spine, and sacred-texts.com's rights policy
      permits mirroring the body text. So this gap is CLOSABLE and is simply not closed in
      this release. See source_id SACRED_TEXTS_GRIFFITH_AV.
  - gap: FOUR_DIFFERENT_VERSE_COUNTS_IN_ONE_TEXTUAL_LINEAGE
    detail: >-
      GRETIL/TITUS legacy HTML gives 5,839 distinct triples and 5,843 parsed units.
      VedaWeb, which revised the TITUS count, gives 5,842 stanza locations.
      The TITUS restricted plain text carries 5,919 verse markers.
      Reference literature usually cites about 5,977. All of the first three descend from
      the same Petr/Vavrousek entry of Roth-Whitney plus Orlandi, so the differences are
      real editorial decisions rather than parser noise. None has been reconciled, and this
      pilot does not pretend otherwise.
  - gap: NO_RIGHTS_CLEAR_PER_MANTRA_TRADITIONAL_METADATA_EXISTS
    detail: >-
      RESOLVED AS A FINDING. A rights-clear, machine-readable, PER-MANTRA
      rishi/devata/chandas layer for AVS DOES NOT EXIST. You get either PD-but-per-HYMN
      (Whitney's Anukramani brackets on English Wikisource, 588 hymns, books I-XIX,
      ProofreadPage-Validated - see source_id WIKISOURCE_WHITNEY_AV_ANUKRAMANI) or
      per-MANTRA-but-COPYRIGHTED (Vishva Bandhu, Atharvaveda Rsi-Devata-Chando-Anukramanika,
      Hoshiarpur 1970, which prints "sarvadhikarah suraksitah" and runs to 2034 in India).
      The Brhatsarvanukramani and Pancapatalika have NO e-text at all - verified absent from
      the entire GRETIL index and from TITUS. vedicheritage.gov.in has per-sukta data but
      forbids reproduction. sa.wikisource is deterministic and 97-99 percent covered but
      cites NO source edition anywhere and disagrees with its own index at a measured 5.3
      percent. The pilot therefore emits ZERO TraditionalMetadataAssertion records. Rigvedic
      Anukramani rules do NOT transfer to the Atharvaveda and nothing was inferred or
      generated.
