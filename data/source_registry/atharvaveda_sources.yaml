    site_rights_verbatim: >-
      Text is available under the Creative Commons Attribution-ShareAlike License;
      additional terms may apply. (Devanagari original in the sa.wikisource footer; the href
      resolves the version to https://creativecommons.org/licenses/by-sa/4.0/)
    rights_status_recommended: CC_BY_SA
    rights_layer_distinction: >-
      CC BY-SA 4.0 covers Wikisource contributors' markup and compilation. The underlying
      traditional Sanskrit text is not itself copyrightable. GFDL could NOT be confirmed on
      the current footer - the string is absent from the pages fetched - so treat
      "CC BY-SA plus GFDL" as historically true but unverified today.
    rejection_reason: >-
      Rejected as PRIMARY because it is UNACCENTED and accent preservation is a corpus
