  - source_id: WIKISOURCE_WHITNEY_AV
    role: ENGLISH_TRANSLATION_ALTERNATIVE
    selected: false
    verified: true
    authority_tier: HISTORICAL_TRANSLATION
    registry_note: >-
      This source_id already exists as a placeholder in data/registry/sources.yaml. Findings
      for Agent E - the underlying work IS public domain and the page templates say so, but
      the digitisation has a structural gap that makes VEDAWEB_AVS the better choice.
    site: English Wikisource
    root_url: https://en.wikisource.org/wiki/Atharva-Veda_Samhita
    pages: >-
      850 under the prefix; a ProofreadPage project over Index:Atharva-Veda samhita.djvu
      (Progress=V, validated) plus volume 2
    granularity: >-
      per-HYMN, not per-verse
    completeness: >-
      Books I-XIV and XVII-XIX match canonical hymn counts exactly. Books XV and XVI use
      Paryaya N subpages (18 and 9, correct). Book VII uses dual numbering such as
      "/Book VII/Hymn 45 (46, 47)" and has 118 pages, correct.
      GAP - BOOK XX HAS NO HYMN SUBPAGES. /Book XX is 278 bytes and transcludes a single
      djvu page, so 143 hymns are unavailable at hymn granularity. There are also 222 legacy
      Roman-numeral duplicate titles in books II, III, IV and VI needing dedupe.
    content_note: >-
      Content is the translation PLUS Whitney's full critical and exegetical commentary, NOT
      the Sanskrit samhita text - the Devanagari character count on a hymn page is 1.
      Transliteration inside the commentary is accented with U+0301 and uses old Harvard
      Oriental Series conventions such as c-cedilla for s-acute.
    site_rights_verbatim: >-
      Text is available under the Creative Commons Attribution-ShareAlike License;
      additional terms may apply. By using this site, you agree to the Terms of Use and
      Privacy Policy.
    artifact_rights_verbatim: >-
      The PD/US 1941 template renders - this work is in the public domain in the United
      States because it was published before January 1, 1931. The longest-living author of
      this work died in 1941, so this work is in the public domain in countries and areas
      where the copyright term is the author's life plus 84 years or less.
    artifact_vs_site_conflict: >-
      NOT A CONFLICT, A LAYERING. The 1905 work is public domain; CC BY-SA 4.0 covers
      Wikisource contributors' own markup and annotation layer. Both statements are true of
      different things. Agent E asked specifically for this read: public domain applies to
