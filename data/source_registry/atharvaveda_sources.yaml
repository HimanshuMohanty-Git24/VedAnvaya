# Atharvaveda-Samhita source candidate matrix - Agent D fragment
#
# Scope: VG:WORK:AV:SAU (Saunaka recension, AVS). Paippalada (AVP) appears ONLY as an
# explicit non-candidate, so that a future reader cannot mistake it for a parallel of AVS.
#
# This file is EVIDENCE, not adjudication. Agent E owns data/registry/sources.yaml,
# source_artifacts.yaml and rights.yaml. `rights_status_recommended` below is a
# recommendation with its evidence attached; Agent E rules.
#
# Rule applied throughout: artifact-level rights and site/repository-level rights are
# recorded SEPARATELY, and artifact rights are never inferred from the site. Where they
# conflict, the conflict is stated rather than resolved by preference.
#
# Verification date: 2026-09-07. Every entry marked verified was fetched, not recalled.

fragment_version: atharvaveda-sources-v2
work_id: VG:WORK:AV:SAU
recension: Shaunaka
verification_date: 2026-09-07

# =======================================================================================
# SOURCE_ID RULING FROM THE RIGHTS AUTHORITY - recorded because it corrects this fragment
# =======================================================================================
# This fragment originally proposed GRETIL_AVS and VEDAWEB_AVS as new source_ids. That was
# WRONG and has been overruled. They are new ARTIFACTS of GRETIL and VEDAWEB, both already
# registered. Registering them as sources would assert four hosts where there are two, and
# would break the rights logic, because the entire purpose of the artifact layer is that
# rights differ per FILE within one host. This fragment's own evidence proves the point:
# VedaWeb's AVS Sanskrit resource reproduces the TITUS no-republication clause while its
# Whitney translation resource returns a null licence - same host, same Veda, same API,
# opposite verdicts. A source-level rights value for "VEDAWEB_AVS" could not be correct.
#
# The pilot build now reads Source and SourceArtifact records from data/registry via
# load_sources() / load_source_artifacts() and constructs neither locally. Registered ids:
#   GRETIL.AV.SAUNAKA.ACCENTED.HTML                source_id GRETIL
#   GRETIL.AV.SAUNAKA.UNACCENTED.HTML              source_id GRETIL
#   VEDAWEB.AVS.WHITNEY_LANMAN_1905.PLAINTEXT.L2   source_id VEDAWEB
#   VEDAWEB.AVS.SANSKRIT.TITUS.PLAINTEXT           source_id VEDAWEB  (not ingested)
# The source_id values used below are retained as this fragment's own research labels; the
# registry is the authority.
#
# Raw snapshot directories keep the local namespaces GRETIL_AVS and VEDAWEB_AVS on purpose,
# so Atharvaveda snapshots do not mix into the Rigveda's data/raw/gretil/ and data/raw/
# vedaweb/. A raw directory is storage layout; the registry source_id is the contract.

sources:

  # =====================================================================================
  # SELECTED - primary Sanskrit
  # =====================================================================================
  - source_id: GRETIL_AVS
    role: PRIMARY_SANSKRIT
    selected: true
    verified: true
    authority_tier: SCHOLARLY_EDITION
    site: >-
      GRETIL (Goettingen Register of Electronic Texts in Indian Languages), SUB Goettingen
    site_url: https://gretil.sub.uni-goettingen.de/gretil.html
    work: Atharvaveda-Samhita
    artifact_recension: Shaunaka
    recension_evidence: >-
      Proved from the artifact by two independent witnesses, not from the filename.
      (1) document title reads "Atharvaveda-Samhita, Saunaka recension, ACCENTED TEXT".
      (2) all 11,395 body locators are prefixed AVS_ with the palatal sibilant, for example
      (AVS_1,1.1a) - the recension marker is present per verse in the data, not only in a
      header that could belong to a swapped file.
    edition: >-
      Gli inni dell' Atharvaveda (Saunaka), trasliterazione a cura di Chatia Orlandi,
      Pisa 1991, collated with R. Roth and W.D. Whitney, Atharva Veda Sanhita, Berlin 1856.
      Books 11-20 improved by Arlo Griffiths (2000) and Philipp Kubisch (2007); revised by
      Arlo Griffiths, August 2009.
    provenance_chain: >-
      Roth/Whitney 1856 plus Orlandi 1991 -> data entry by Vladimir Petr and Petr Vavrousek
      (Praha 1996) -> TITUS redaction by Jost Gippert (1997-2012) -> GRETIL re-host as
      legacy HTML. GRETIL is a RE-HOST, not the rights holder; its own introduction says it
      provides "the contributions of varying sources and quality in an appropriately
      normalized way".
    text_type: >-
      samhita-patha, continuous text with explicit pada divisions
    format: >-
      legacy HTML, one BR-separated line per pada, each line prefixed by a parenthesised
      locator
    format_rank: 3
    format_rank_note: >-
      Machine-readable text. Structured XML/TEI was NOT available for the Saunaka recension
      at all - see the gaps section. No OCR was performed or needed.
    encoding: >-
      UTF-8, Latin scholarly transliteration (NOT Devanagari)
    machine_readable: true
    structural_addressability: >-
      per-mantra AND per-pada, explicit in every line
    artifacts:
      - source_artifact_id: GRETIL.AVS.SAUNAKA.TITUS.ACCENTED.2009
        url: https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/avs_acu.htm
        http_status: 200
        byte_length: 1114524
        sha256: cd89bd1e29e6158d7c3c7bcb607b8e4eed4c7556c8c2027dec039f56736adddb
        local_snapshot: data/raw/gretil_avs/2026-09-07/cd89bd1e29e6158d7c3c7bcb607b8e4eed4c7556c8c2027dec039f56736adddb.htm
        accent_status: ACCENTED_VERIFIED
        accent_evidence: >-
          Declares "ACCENTED TEXT"; 5843 of 5843 parsed units test positive under
          has_vedic_accents(). Encoding uses COMBINING LATIN marks, NOT Devanagari svaras:
          udatta is U+0301 combining acute, svarita is U+0300 combining grave. No U+0951 or
          U+0952 and no Vedic Extensions codepoint occurs anywhere in the file. Pluti is
          written as an inline digit 3, for example aasii3d at AVS 12.5.50.
        completeness: >-
          COMPLETE. 20 kandas, 731 suktas, 5,839 distinct mantras, 11,395 padas, all
          computed from the snapshot. Sukta numbering is 1..N contiguous in all twenty books.
      - source_artifact_id: GRETIL.AVS.SAUNAKA.TITUS.UNACCENTED.2009
        url: https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/avs___u.htm
        http_status: 200
        byte_length: 1024198
        sha256: 7e3f74f313d1b4348bf9e1f60a80e03bb72709994b85585a4f854a51bf57272c
        local_snapshot: data/raw/gretil_avs/2026-09-07/7e3f74f313d1b4348bf9e1f60a80e03bb72709994b85585a4f854a51bf57272c.htm
        accent_status: UNACCENTED_VERIFIED
        accent_evidence: >-
          Declares "UNACCENTED TEXT"; 0 of 5843 units test positive.
        completeness: >-
          Identical structure to the accented artifact - 5,843 units in exactly the same
          order.
        independence_warning: >-
          NOT an independent witness. It is a mechanical accent-strip of the accented file.
          Evidence: (a) all 153 sampled mantras classify as ACCENT_ONLY with zero other
          differences; (b) the accent-removal transform corrupted the file's own preamble,
          which reads "WD. Whitney" with a retroflex D where the accented file reads
          "W.D. Whitney". Do not cite it as cross-edition corroboration of the text.
    artifact_rights_verbatim: |
      THIS GRETIL TEXT FILE IS FOR REFERENCE PURPOSES ONLY!
      COPYRIGHT AND TERMS OF USAGE AS FOR SOURCE FILE.
    artifact_rights_location: >-
      Preamble of both avs_acu.htm and avs___u.htm, immediately after the edition
      statement. Extracted programmatically by
      GretilAVSAdapter.extract_header_metadata().licence_statement_verbatim, so the quote is
      machine-derived from the snapshot rather than transcribed by hand.
    artifact_rights_reading: >-
      This is not a licence. It is a disclaimer that DEFERS to the upstream source file,
      which the artifact itself identifies as the TITUS edition. The governing terms are
      therefore TITUS's - recorded separately under source_id TITUS_AVS below.
    artifact_declares_no_cc_licence: true
    important_contrast: >-
      GRETIL's Rigveda TEI file declares CC BY-NC-SA 4.0 in a TEI availability element. The
      Atharvaveda files are NOT TEI, have NO availability element, and declare NO Creative
      Commons licence of any kind. The Rigveda licence tells us nothing here.
    site_rights_verbatim: null
    site_rights_finding: >-
      NONE FOUND. The GRETIL index page gretil.html (1,033,721 bytes) contains no occurrence
      of licence, license, copyright, terms of use, Creative Commons or public domain
      anywhere. Both https://gretil.sub.uni-goettingen.de/ and /gretil.htm are 59-byte
      meta-refresh redirects to gretil.html. There are no about, terms, legal or impressum
      links in the index. GRETIL declares no site-level licence at all.
    site_directory_listing: >-
      HTTP 403 on /gretil/1_sanskr/1_veda/1_sam/ - no directory indexes
    artifact_vs_site_conflict: >-
      NO CONFLICT, because there is no site-level statement to conflict with. The only
      applicable statement is the artifact's own FOR REFERENCE PURPOSES ONLY.
    rights_status_recommended: REFERENCE_ONLY
    rights_recommendation_basis: >-
      The artifact's own words are FOR REFERENCE PURPOSES ONLY. Redistribution is NOT
      established. Local research ingestion with full provenance is what the pilot does;
      publishing the Sanskrit text is not authorised by anything found.
    redistribution_blocker: >-
      YES. Requires written permission from the TITUS Project, Institut fuer Empirische
      Sprachwissenschaft, Universitaet Frankfurt am Main.
    known_defects:
      - >-
        4 locator collisions - AVS 9.6.48, 12.5.53, 13.4.26 and 20.96.22 each occur twice.
        Three are typos; 20.96.22 is a genuine two-verses-one-number edition divergence.
      - >-
        13 label-versus-marker disagreements, nine of them clustered in kanda 7
        (7.6.3, 7.6.4, 7.45.2, 7.54.2, 7.55.1, 7.68.3, 7.72.3, 7.76.5, 7.76.6)
      - >-
        1 corrupt pada letter - (AVS_8,5.11 with retroflex d) where c is meant
      - >-
        46 units carry no in-text verse marker at all
      - >-
        anuvaka group markers exist in only 11 of 20 kandas (3, 8-14, 17, 18), so a complete
        anuvaka layer CANNOT be built from this artifact
    stated_counts_in_artifact: >-
      NONE. The preamble asserts no kanda, sukta or mantra total. Verified
      programmatically - extract_header_metadata().stated_total_counts returns the empty
      tuple. There is therefore no source-stated total to reconcile against for this
      artifact, and that absence is itself recorded in the build provenance.

