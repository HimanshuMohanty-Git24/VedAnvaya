    accent_status: UNACCENTED_VERIFIED
    accent_evidence: >-
      Verified on kanda 1 sukta 01, kanda 17, and kanda 20 sukta 143. The only combining
      mark present is U+094D VIRAMA. NO U+0951 UDATTA and NO U+0952 ANUDATTA anywhere.
    bonus_content: >-
      Many sukta pages carry Sayana-bhasya in a template, and header notes carry
      devata/chandas/rishi strings. This is a traditional-metadata lead and is under
      separate investigation. Sayana's Atharvaveda commentary is of disputed authenticity;
