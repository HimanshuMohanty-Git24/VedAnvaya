      than clause moves the corpus total DOWN by ~1954, while the divergence to be
      explained is UP by 138. Wrong direction, off by an order of magnitude.
      Paryaya grouping MERGES; raising a count requires SPLITTING.
    reason: >-
      Stays OPEN_RESEARCH and requires a second complete edition to adjudicate.
      What survives is weaker but sound: granularity conventions demonstrably vary
      within the source and that variation concentrates in prose books. The
      splitting-direction case at AVS 15.2.1 (1 Roth/Whitney verse = 8 Vishva
