      candidate editions surfaced (P. Pallasena Narayanaswami; Jitendra Bansal)
      and NEITHER could be confirmed as the transcription's basis.
      Contrast Yajurveda, where the equivalent search DID find a sibling preface
      page naming the 1929 Nirnaya Sagara edition (CORR-4). The same rescue was
      looked for here and does not exist.
    reason: >-
      This is now an ESTABLISHED NEGATIVE rather than an unexamined gap, which is
      a real advance even though the state label is unchanged. Per this registry's
      own closing method the dimension stays OPEN_RESEARCH because only a NEW
      SOURCE or a different chain of title would change it, and that is exactly an
      external dependency. Identity must NOT be frozen: identity_status stays
      RESEARCH_REQUIRED and key_pattern stays null in data/registry/works.yaml.

  - run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
