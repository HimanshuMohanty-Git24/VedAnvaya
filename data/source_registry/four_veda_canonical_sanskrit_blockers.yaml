      5839 vs ~5977 mantras: FOUR counts exist in one lineage (GRETIL 5839 distinct,
      VedaWeb 5842, TITUS plaintext 5919, commonly cited ~5977).
      A CLAIMED MECHANISM WAS RAISED AND THEN FALSIFIED IN THIS RUN, and the
      falsification is recorded because the reasoning error is instructive: leaf
      n300 shows AVS 12.5 prose carrying two concurrent numbering systems (running
      clause numbers plus parenthesised paryaya-group numbers), and Agent A claimed
      this as the divergence generator. Agent F corroborated the OBSERVATION from
      the artifact (73 clause units and 7 group markers in 12.5; 220 group markers
