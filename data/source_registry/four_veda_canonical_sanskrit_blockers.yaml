      transcription_fidelity_measured: >-
        NEW, OPEN_RESEARCH. Model transcription of this source was attempted at production
        settings under the two-stage protocol and MEASURED rather than assumed.
        MEASURED OVER 227 UNITS READ INDEPENDENTLY TWICE (26 leaves, kandas 1-2):
          VERIFIED_EXACT 123, exact agreement rate 0.542.
          VERIFIED_WITH_ORTHOGRAPHIC_NOTE 42 - agree on the letters, differ in accent or in
          punctuation, numerals and spacing.
          TRANSCRIPTION_UNCERTAIN 62 - differ in the letters themselves, e.g. AVS 2.19.1
          read as "dvesi" by one reader and "dvesti" by the other.
          14 of 313 units carry any Vedic accent mark.
        THE RATE MOVED FOUR TIMES AS THE SAMPLE GREW AND EVERY EARLIER FIGURE IS WITHDRAWN:
        0.00 on 22 units (one leaf), 0.26 on 46, 0.485 on 167, 0.505 on 204, 0.542 on 227.
        The first was
        recorded here in a sentence that ALSO said 22 units were "enough to refuse promotion
        and NOT enough to characterise the error rate" - and then stated the rate anyway.
        That is the one-locus overgeneralisation this registry has corrected four times,
        committed once more by the run correcting the others, and then repeated at 46 and
        again at 167. THE MONOTONE CLIMB IS ITSELF THE FINDING: across FIVE successive sample
        sizes the measurement has risen every time and has not converged, so 0.542 is a FLOOR from
        two kandas at a resolution now known to be wrong, and must not be cited as a corpus
        rate. Anyone quoting a single number from this dimension is quoting a snapshot of an
        unconverged series.
        THE ACCENT RESULT HAS A DIFFERENT CAUSE THAN FIRST RECORDED, and the correction
        matters more than the number. Both readers initially recorded ZERO accents, which
        read as a capability failure. It was an ACQUISITION failure: the first pass fetched
        the IIIF derivative at width 2000, and a reader stated the reason precisely - at
        that resolution the accent marks of this fount "sit on aksara boundaries and cannot
        be assigned to a specific aksara without guessing", so they refused to record them,
        which is exactly what RIGHTS-13 requires. Re-fetched at width 4000 the same marks
        are unambiguously attached to their aksara, verified visually on leaf n17. The IIIF
        "full" size returns only 2025px, so 4000 must be requested explicitly. The volume
        has been re-acquired at 4000 and IMAGE_WIDTH in the fetch script now pins it.
        SO WHAT THIS DIMENSION ACTUALLY RECORDS: an exact-agreement rate of 0.542 on a
        small sample at the WRONG resolution, with the resolution defect now fixed - the
        whole volume re-acquired at width 4000, aggregate
        4008cdca2886f79a37d23a1323fe2e5edec676f3e08549d23aa865088f3917b6 - and the
        measurement NOT yet repeated at the right one. It is not yet evidence about what
        model transcription can do from an adequate image.
        WHAT IS STILL TRUE INDEPENDENT OF RESOLUTION: a failure both readers share is
        invisible to a two-reader check, because agreement is its only signal. The zero-accent
        result was caught by a separate accent_fidelity_gap measurement, not by the status
        vocabulary, and that gap measurement is retained for exactly that reason.
        WHAT DID NOT MOVE: the source is legible, its structure was derived from it
        successfully and independently (20 kandas, 731 suktas from the printed running heads
        alone), and rights are clear. Nothing here weakens the acquisition or the artifact.
        WHAT WOULD CLOSE IT: a measured exact-agreement rate at width 4000 over a
        statistically meaningful sample, and independent human verification of a subset.
      transcription_channel_independence: >-
        NEW, OPEN_RIGHTS. RIGHTS-13 names an LLM assistant as the MOST LIKELY breach path
        for this project, because the agents operating it hold GRETIL and TITUS text in
        training and will complete an unclear aksara helpfully and silently. This run began
        transcribing with model readers, so the channel is no longer hypothetical and needs
        its own dimension rather than being folded into transcription_labour, which is about
        EFFORT and would go RESOLVED on volume alone while this stayed open.
        WHAT IS CONTROLLED: readers are instructed to read the page and not answer from
        recall, to mark an unclear aksara [?] rather than guess, and never to consult any
        digital Atharvaveda; two readers who cannot see each other read the same image; and
        no reading is ever synthesised from two disagreeing ones, because a merged reading
        has no traceable source. VERIFIED_EXACT is assigned only by agreement.
        WHAT IS NOT CONTROLLED, AND WHY THIS IS OPEN RATHER THAN RESOLVED: a model
        transcribing Devanagari from an image is not performing pure optical recognition.
        Its output is shaped by language priors learned from a corpus that includes the
        encumbered text. Two independent model readings can therefore AGREE because they
        share a prior rather than because the page says so, which is a correlated-error mode
        that a two-reader check cannot detect by construction. The residual is unquantified.
        WHAT WOULD CLOSE IT: independent human verification of a statistically meaningful
        sample against the leaf images, or verification against a second rights-compatible
        public-domain witness. Neither is available in an automated run.
        SCOPE NOTE: this is the same class of gap already recorded for Samaveda as
        cross-script rendering under samaveda_sources.yaml, which observed that
        agent-performed transliteration of a passage the model holds memorised is a
        RIGHTS-13-class channel that RIGHTS-13 does not name. Both are the general problem
        that RIGHTS-13's OPERATIONAL TEST assumes a reader whose recall is separable from
        their reading, and a model's is not.
