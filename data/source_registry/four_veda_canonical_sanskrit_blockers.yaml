purpose: >-
  Consolidated, non-authoritative snapshot of the three open canonical-Sanskrit blockers
  (YV, SV, AV) for the FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE session. Authoritative
  detail lives in docs/FOUR_VEDA_RIGHTS_MATRIX.md, docs/FOUR_VEDA_SOURCE_ADJUDICATION.md and
  docs/FOUR_VEDA_STRUCTURAL_MODEL.md. This file restates, it does not decide.
  UPDATED 2026-09-07 by SAMAVEDA_CANONICAL_IDENTITY_FINAL_CLOSURE, which closed the
  Samaveda source-edition question and then discovered that it was NOT the binding
  constraint. Two new SV dimensions carry the real blocker: referent_integrity and
  arcika_arity. See docs/reports/SAMAVEDA_CANONICAL_IDENTITY_FINAL_CLOSURE.md,
  docs/reports/SAMAVEDA_COUNT_RECONCILIATION.md and
  docs/reports/SAMAVEDA_ADDRESSING_STABILITY.md.
  NOTE ON THIS FILE'S OWN AUTHORITY, which matters more than it did before: the
  restrictive constraint on freezing Samaveda identity lives in ADR-017 ("no key is
  declared, not even provisionally"), NOT here. This file cannot license a freeze and
  does not attempt to.
human_readable_mirror: docs/FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKERS.md
note: >-
  Originally scoped to data/qa/, moved here because data/qa/** is gitignored
  build-output space (gate results, comparison TSVs) and this is hand-authored,
  committed registry content, matching data/source_registry/four_veda_source_matrix.yaml's
  role rather than a generated QA artifact.

blocker_states:
  - OPEN_RESEARCH
  - OPEN_ENGINEERING
  - OPEN_RIGHTS
  - OPEN_PHILOLOGICAL_REVIEW
  - RESOLVED
  - DEFERRED_NONBLOCKING

# ---------------------------------------------------------------------------
# STATE TRANSITIONS
# Append-only. Every entry records old state, new state, evidence, agent, run
# and reason. A dimension is never silently overwritten: the transition log is
# the audit trail and the `dimensions` maps below are the current value.
#
# This log exists because of a defect found in this very run: the sibling file
# data/source_registry/four_veda_source_matrix.yaml carried a
# corrections_applied block in which 8 of 9 recorded corrections had NEVER been
# written into the data rows they described. A correction log that is not
# mechanically tied to the data it describes will drift from it. Here the log is
# explicitly secondary to `dimensions`, and `dimensions` is what a consumer reads.
# ---------------------------------------------------------------------------
state_transitions:
  - run: SAMAVEDA_REFERENT_INTEGRITY_REPAIR
    date: "2026-09-07"
    work_id: VG:WORK:SV:KAU
    dimension: referent_integrity
    old_state: OPEN_ENGINEERING
    new_state: RESOLVED
    agent: "Agent A (coordinator, sole writer of identity contracts), Agent B (segmentation), Agent C (arity and level classification), Agent D (identity invariants), Agent E (provenance), Agent F (adversarial QA)"
    evidence: >-
      THE DEFECT SET WAS AUDITED ON THE SELECTED WITNESS, NOT THE REJECTED ONE, and that
      changed the problem. The previous run's forensics - seven welded addresses, nine
      surplus markers, a phantom thirteenth verse - were all measured on the GRETIL
      artifact, which is PERMISSION_REQUIRED and was never going to be the canonical
      source. Of the 1,875-verse corpus, only 29 verses (1.55%) of the SELECTED witness
      were pinned, all three pinned pages sitting in the one region with zero defects.
      This run fetched the remaining arcika corpus: 106 pages under
      samavedah/kauthumiya/samhita (74 Purvarcika + 32 Uttararcika), gana excluded by
      scope, into data/raw/wikisource_sa/ with per-page sha256 and revid.
      SIX SOURCE-SYNTAX FAMILIES WERE FOUND THAT THE PREVIOUS ADAPTER COULD NOT READ, and
      the honest measure of the old parser is that it found 1,195 of 1,875 verse markers
      and reported nothing wrong: (1) verse terminators spelled with two ASCII pipes;
      (2) terminators spelled with two single dandas U+0964; (3) unterminated terminators
      with an opening danda only; (4) a mixed single-open/double-close terminator; (5) an
      HTML-table dialect that prints the local verse index and pada label in a second
      cell; (6) dasati headings written parenthesised rather than bare, which made one
      whole ardha read as having no dasati structure at all. All six are handled by
      SYNTAX CLASS, not by verse id. Repaired lift: 1,872 of the 1,875 printed markers.
      THE PRIMARY DEFECT WAS NOT ANY OF THOSE. The superseded adapter's parse_at_address
      took the five-level address FROM THE CALLER and wrote the samhita RUNNING number
      (1..1875) into the identity-bearing verse slot. The repair removes the method: the
      address is now derived from the page title read against each collection's DECLARED
      SHAPE - necessary because the dotted address in a title means prapathaka under
      1.1.x, dasati under 1.2.x and ardha under 2.x.y, so a positional read mis-keys - the
      dasati from the numeral the page prints, and the dasati-local verse index from the
      source's own printed running-number arithmetic, which FAILS CLOSED when that
      arithmetic does not close. Document order is never consulted.
      MEASURED OUTCOME on the full selected corpus: 1,874 candidate occurrences, 1,844
      canonical keys, ZERO addresses absorbing more than one printed verse, ZERO source
      occurrences claimed by two keys, ZERO unexplained positional identity. The
      Purvarcika group reproduces the traditional 650 EXACTLY as 585 + 55 + 10.
      A BINDING INVARIANT NOW EXISTS. models.PassageReferentBinding records per released
      key the source artifact, locator, revision, snapshot digest, printed verse marker,
      raw text SHA-256 and a normalization-independent comparison SHA-256.
      vedagraph.referent.compare_referents classifies every key across builds as
      UNCHANGED_REFERENT, INTENTIONAL_REFERENT_CORRECTION, REFERENT_DRIFT,
      REMOVED_INVALID_PASSAGE or NEWLY_DISCOVERED_PASSAGE, and assert_no_referent_drift
      FAILS the build on any drift without a recorded migration. The baseline is committed
      at tests/fixtures/identity/sv_referent_baseline.jsonl BECAUSE data/derived/** is
      gitignored and a baseline written there would silently not be a baseline.
      THE FINGERPRINT IS A GUARD, NOT IDENTITY: it is never an input to uuid_for_urn,
      canonical keys name no source, and replacing a TextVersion cannot change a key.
    reason: >-
      RESOLVED because the defect CLASS is unrepresentable, not because the known
      instances were patched. A key can no longer carry a running number, an index above
      its dasati's printed verse count, a level its collection does not declare, or an
      address inferred from document position. And the failure mode that made the class
      invisible - a byte-identical UUID over a moved referent passing every gate - now has
      a gate that fails it.
      WHAT IS NOT CLAIMED: coverage is incomplete and is tracked as its own dimension.
      31 of 1,875 verses carry no key. That is a coverage gap, not an identity ambiguity;
      no minted key is capable of denoting a different verse, and because the WHOLE
      affected dasati is withheld in every case, supplying the missing structure later adds
      keys without renumbering any existing one.

  - run: SAMAVEDA_REFERENT_INTEGRITY_REPAIR
    date: "2026-09-07"
    work_id: VG:WORK:SV:KAU
    dimension: arcika_arity
    old_state: OPEN_PHILOLOGICAL_REVIEW
    new_state: RESOLVED
    agent: "Agent C (research), Agent A (identity decision)"
    evidence: >-
      DISSOLVED AS AN IDENTITY QUESTION RATHER THAN ADJUDICATED, and the distinction is
      the point. The arity dispute was binding only because the candidate key put a bare
      ORDINAL in its top slot, and that ordinal has no stable denotation across witnesses:
      slot-1 value 2 means Aranyarcika in the Pandey e-text lineage (GRETIL + TITUS, which
      are ONE witness) and Uttararcika in all six independent witnesses, a 1,225-verse
      referent collision verified on both sides.
      EVERY WITNESS AGREES ON WHAT ACTUALLY MATTERS FOR IDENTITY: the same four blocks, in
      the same order, with the same extents - Chanda 585, Aranya 55, Mahanamnya 10,
      Uttara 1225. The dispute is a BRACKETING dispute about how far the grouping name
      "Purvarcika" reaches. The selected witness's own root page settles its own usage,
      numbering two top-level arcikas and giving Purvarcika = 1-650, and its Purvarcika
      index page asserts the three-way internal split with exact ranges.
      THE KEY THEREFORE NAMES THE FOUR SUB-COLLECTIONS AND NUMBERS NOTHING. It deliberately
      does NOT name the two top-level groupings, because a further finding of this run is
      that the extent of "Purvarcika" is itself contested - 650 in Wikisource, the Vedic
      Heritage Portal, Wikipedia and B. R. Sharma HOS 57, but 585 in Caland and Vedapeetha,
      which treat the Aranyaka portion as a separate collection. The four sub-collection
      extents are disputed by nobody, so they are the safest thing in the corpus to key on.
      CROSS-WITNESS MEASUREMENT, structure only, no encumbered text read: collection
      assignment agrees for 1,867 of 1,867 comparable printed verse numbers, ZERO
      disagreements. Chanda agrees 585/585 on prapathaka, dasati AND verse; Aranya 55/55;
      Uttara 1,217/1,217 on prapathaka and ardha.
    reason: >-
      RESOLVED for identity. The philological question is NOT closed and is not pretended
      to be: whether Chanda/Aranya/Mahanamnya are siblings of Uttara or children of a
      Purvarcika, and whether "Purvarcika" reaches 585 or 650, remain open. They are now
      DOCUMENTATION questions. Answering either changes the container spine and renumbers
      no key, which is exactly the property the previous scheme lacked and the reason the
      arity had to block a freeze before.

