      consulted, so reordering a page cannot move a referent. MEASURED over the full
      selected corpus: 1,844 keys minted, ZERO addresses absorbing more than one printed
      verse, ZERO source occurrences claimed by two keys.
      (2) arcika_arity, was OPEN_PHILOLOGICAL_REVIEW, now RESOLVED - and note HOW. The
      philological question of whether the Kauthuma samhita has two, three or four
      top-level arcikas is NOT settled and does not need to be. It was only ever binding
      because the candidate key put a bare ORDINAL in its top slot, and that ordinal has no
      stable denotation: slot-1 value 2 means Aranyarcika in the Pandey lineage and
      Uttararcika in all six independent witnesses. Every witness holds the SAME FOUR
      BLOCKS IN THE SAME ORDER with the same extents 585/55/10/1225; the dispute is purely
      about how far the grouping name "Purvarcika" reaches. Naming the four collections
      records exactly what is agreed and leaves the bracketing to the container spine,
      where revising it renumbers nothing. MEASURED: collection assignment agrees between
      the two lineages for 1,867 of 1,867 comparable printed verse numbers, zero
      disagreements. An arity decision is now a documentation change, not a migration.
      A NEW INVARIANT EXISTS THAT DID NOT BEFORE. models.PassageReferentBinding records,
      per released key, the source artifact, locator, revision, snapshot digest, printed
      verse marker, raw text SHA-256 and a normalization-independent comparison SHA-256.
      vedagraph.referent compares a build against the COMMITTED baseline at
      tests/fixtures/identity/sv_referent_baseline.jsonl and FAILS the build when a key
      changes what it denotes without a recorded migration. The fingerprint is a GUARD and
      never an identity input: keys stay source-independent and a TextVersion replacement
      cannot change one. This closes the defect class where a byte-identical UUID over a
      moved referent was reported as a success by every gate in the build.
