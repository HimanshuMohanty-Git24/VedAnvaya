  - run: FOUR_VEDA_CANONICAL_SANSKRIT_BLOCKER_CLOSURE
    date: "2026-09-07"
    work_id: VG:WORK:YV:VSM
    dimension: boundary_provenance
    old_state: NOT_PREVIOUSLY_TRACKED
    new_state: OPEN_ENGINEERING
    agent: "Agent F (ruling), Agent E (rights clearance), Agent A (accepted and applied)"
    evidence: >-
      NEW DIMENSION, added because the existing set could not express why a layer
      with 1975/1975 coverage is still not PRIMARY_TEXT. Coverage and boundary
      provenance are different properties and collapsing them is exactly the
      overclaim this registry forbids.
      Measured: 1939 of 1975 units are read from a DECLARED ordinal header; 36 fall
      back to accent-presence inference and are REPORTED as ParseFailure
      ORDINAL_HEADER_ABSENT rather than passing silently.
      Agent F root-caused all 36. NINE ARE PARSER-ATTRIBUTABLE: 8 where a correct
      ordinal header IS present but the source omits its trailing danda so the regex
      rejects it - proved, not inferred, because in 8 of 8 cases the ordinal word
      names exactly the mantra number the run resolved to (astavimsi->28,
      satsasti->66, astasasti->68, saptacatvarimsi->47, ekavimsi->21, sodasi->16,
      ekacatvarimsi->41, dvicatvarimsi->42); and 1 where an intervening Bhavisya
      Purana rsi/chandas citation resets the state machine.
      TWENTY-SEVEN ARE SOURCE PROPERTIES: 22 where the header was consumed by the
      preceding mula, 3 with no header within six preceding lines.
    reason: >-
      text_role STAYS EXTRACTED_FROM_CONTAINER. Agent E cleared the upgrade on
      RIGHTS grounds in advance and correctly noted it has zero rights consequence,
      then deferred to the fidelity gate. Agent F ruled against on three independent
      grounds, of which the third is decisive BECAUSE IT SURVIVES EVERY AVAILABLE
      FIX: the enum's own definition makes boundary provenance the discriminator,
      and even after fixing all 9 parser cases, 27 units would STILL lack a
      source-declared header. A blanket layer-level PRIMARY_TEXT would make
      interpretive segmentation canonical for those 27, which that enum member
      explicitly forbids. So the answer to "will this become PRIMARY_TEXT once the
      regex is fixed" is NO, not "not yet".
      SPECIFIED FOR THE NEXT RUN, not done here: carry boundary provenance PER
      RECORD (header-declared vs inference-derived), leaving the LAYER role
      permanently accurate while letting a consumer select the header-declared units
      with confidence. Also recorded: a validated two-pass fix for 8 of the 9 parser
      cases - harvest ordinal vocabulary from danda-bearing matches (490 strings),
      accept a danda-less line only if its exact text is in that vocabulary. Tested
      end-to-end: 8 accepted, 8 of 8 targets covered, zero false positives. The
      naive fixes are unsafe and were measured: with the lookbehind it breaks 280
      working headers, without it admits 339 false lines.

