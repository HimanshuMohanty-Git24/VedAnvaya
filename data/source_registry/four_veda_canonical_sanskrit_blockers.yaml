      cheap, and it must be done outside the Purvarcika defect-free zone.
      ONE FINDING THAT CUTS AGAINST THE INDEPENDENCE CLAIM, recorded rather than buried:
      the 1179-typeset-as-1181 defect is present in BOTH lineages at the same locus, and
      so are single-danda verse terminators at running numbers 1133 and 1592. Two readings
      are open - common descent, or a defect inherited from a shared print antecedent - and
      this run does not adjudicate between them. It is direct evidence for the codepoint
      re-verification item above.
