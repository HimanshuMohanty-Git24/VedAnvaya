  - run: SAMAVEDA_CANONICAL_IDENTITY_FINAL_CLOSURE
    date: "2026-09-07"
    work_id: VG:WORK:SV:KAU
    dimension: source_edition_identity
    old_state: OPEN_RESEARCH
    new_state: RESOLVED
    agent: "Agent B (investigation), Agent E (rights concurrence), Agent A (applied)"
    evidence: >-
      RESOLVED MEANS THE INVESTIGATION IS CLOSED AND THE ANSWER IS NEGATIVE. It does
      NOT mean an edition was identified. Read the next dimension before acting on this
      one.
      The pinned corpus (samavedah/kauthumiya/samhita) is now shown POSITIVELY to be a
      hand-keyed community transcription with NO printed antecedent, rather than one whose
      antecedent we merely failed to find: 0 templates / 0 prshtham-namespace links / 0
      images on all three pinned pages, so no page-number correspondence to any printed
      book exists or could be recovered; the principal contributor describes his own work
      as "tankanam" (typing) on his own talk page (rev 230976, 2020-04-19); the community
      itself asked him to state the source in 2021 and received only a personal-site link,
      so source non-attribution is a KNOWN AND UNREMEDIED condition of this corpus; an
      exhaustive external-link census of the whole tree found NOT ONE link to any scan or
      printed edition of the Samaveda across 840+ pages.
      Front matter is proven absent BY ENUMERATION: all 908 namespace-0 samaveda* titles
      enumerated to exhaustion, and a 20-term Devanagari front-matter sweep returns one
      hit under samavidhanabrahmanam, not the samhita. Wiki-wide intitle:prakkathanam
      returns exactly 3 pages, ONE OF WHICH IS THE YAJURVEDA CONTRAST CASE. The YV preface
      exists; the SV analogue does not.
      BOTH CANDIDATES REFUTED as Wikisource-attested sources: narayanasvami -> 3 hits, all
      a different work; insource:"Narayanaswami" -> 6 hits, none Samaveda; bansal and
      insource:"Bansal" -> 0 totalhits WIKI-WIDE. Zero occurrences anywhere in the Samaveda
      corpus in any namespace, including all talk and all contributor pages.
      A PRIOR NEGATIVE WAS PARTLY A FALSE NEGATIVE BY CONSTRUCTION: the previous run's
      route 2 used the prefix "charcha:", which is the HINDI Wikisource talk prefix.
      Sanskrit Wikisource uses "sambhashanam:". That probe would have returned 404
      regardless of content. The corrected probe found the two contributor admissions
      quoted above. LESSON: an exhausted-route finding is only as strong as the namespace
      vocabulary it used; enumerate meta=siteinfo&siprop=namespaces before declaring a
      namespace empty.
    reason: >-
      Transitions per this registry's OWN closing method, quoted from its human-readable
      mirror: a dimension is OPEN_RESEARCH only if new RESEARCH would change the label; if
      only a NEW SOURCE or a different chain of title would change it, the correct label is
      RESOLVED even when the practical outcome is negative, because the negative answer is
      itself the resolved state. The previous run applied the opposite reading to this same
      dimension, which was inconsistent with the method it cited. Corrected here.
      ROUTE 5 MUST NOT BE OPENED ON THIS CORPUS. The evidence is exhausted and consistently
      negative. Any future work belongs to printed_edition_recension_determination below.
      This transition does NOT unfreeze identity and is NOT the reason identity stays
      unfrozen - see referent_integrity and arcika_arity.

  - run: SAMAVEDA_CANONICAL_IDENTITY_FINAL_CLOSURE
    date: "2026-09-07"
    work_id: VG:WORK:SV:KAU
    dimension: printed_edition_recension_determination
    old_state: null
    new_state: OPEN_RESEARCH
    agent: "Agent B (located and read), Agent A (applied)"
    evidence: >-
      NEW DIMENSION, added because a fifth route found something the old dimension set
      could not express: a SECOND, SCAN-BACKED Samaveda corpus on the same wiki, carrying a
      complete printed citation. All four prior routes missed it because the Index
      namespace (anukramanika:) was never probed; list=allpages&apnamespace=106 finds it
      immediately.
      THE EDITION: Samaveda-samhita with the commentary of Sayana, ed. Satyavrata Samasrami
      Bhattacharya. Calcutta: Asiatic Society of Bengal (Bibliotheca Indica). FIVE volumes,
      1874-1878. Vols 1-3 on Wikimedia Commons; vols 4-5 on archive.org
      (in.ernet.dli.2015.344954, in.ernet.dli.2015.487322). Ties to the transcription are
      threefold and independent: Index wikitext (samparakah=Satyavrata Samasrami,
      varsham=1874, prakasakah=Asiatic Society of Bengal), the Commons Information blocks,
      and direct transclusion of the scans.
      RIGHTS ARE CLEAN AND DERIVE FROM THE WORK, not from any tag or digitiser: published
      1874-1878, so pre-1929 publication alone establishes US PD; the editor's death date
      is not findable (BnF ark:/12148/cb14538799z gives only "18.."), but attested activity
      runs 1873-1906, so any plausible date puts expiry no later than ~1990 under a life+60
      term. Digitised by the Digital Library of India from Asiatic Society Library holdings;
      the permission field is EMPTY on all three Commons file pages and no scan-layer claim
      is asserted.
      WHY IT DOES NOT CLOSE THE BLOCKER, stated plainly: (1) every prshtham page is
      categorised aparishkrtam - UNPROOFREAD RAW OCR; vol 1 has 163 gaps in 961 pages, vol 2
      has TWO transcribed pages, vols 4-5 are not on Commons at all. (2) THE RECENSION IS
      NOT ESTABLISHED. Griffith's 1895 preface, verified verbatim, assigns BOTH Benfey and
      Samasrami to RANAYANIYA: "Professor Benfey ... brought out an excellent edition of the
      Ranayaniya recension ... and Pandit Satyavrata Samasrami of Calcutta published in
      1874-78 in the Bibliotheca Indica a meritorious edition of the Sanhita according to
      the same recension." A stobha-spelling discriminator run against the scan OCR points
      the other way (hau 7 hits / havu 0) but derives from a wiki-tier source and 1874
      Devanagari OCR is poor - suggestive, not probative. A division-scheme discriminator is
      VOID: the two published accounts contradict each other and the edition carries both
      systems simultaneously.
      A COORDINATOR HYPOTHESIS WAS RAISED AND REFUTED, recorded so it is not repeated: the
      coordinator suggested the repository's Benfey-equals-Ranayaniya attribution might be
      defective, since Benfey is sometimes described as Kauthuma. Checking the primary
      source refuted the hypothesis. THE REPOSITORY REPORTED GRIFFITH ACCURATELY AND THAT
      RECORD MUST NOT BE "CORRECTED" INTO ERROR.
    reason: >-
      OPEN_RESEARCH, but narrow, named and cheap - the opposite of the open-ended state the
      old source_edition_identity dimension carried. An identified edition of UNCERTAIN
