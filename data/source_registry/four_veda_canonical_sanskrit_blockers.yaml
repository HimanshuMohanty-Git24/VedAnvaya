    work_id: VG:WORK:SV:KAU
    dimension: engineering_repoint_to_wikisource
    old_state: OPEN_ENGINEERING
    new_state: OPEN_ENGINEERING
    agent: "Agent A (diagnostic), Agent F (cross-source verification)"
    evidence: >-
      Still open, but DEMONSTRATED FEASIBLE rather than asserted. The three pinned
