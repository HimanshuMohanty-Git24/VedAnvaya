      (True), untruncated. Neither reading is lost.
      The second outstanding item, LEADING_INVOCATION_REMOVED at VSM 1.1 (removed
      "harih om"), is likewise still NEEDS_REVIEW.
    reason: >-
      A PRESERVED VARIANT IS NOT A RESOLVED VARIANT. Choosing between two attested
      printed readings is a human philological judgement that the session brief
      explicitly forbids any agent from making unilaterally, so this dimension
